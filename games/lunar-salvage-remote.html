<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1226">
<title>Remote Lunar Mission Controller</title>
<style>
  :root{ --ink:#e8eefc; --soft:#c9d4ee; --muted:#9fb0d4; --bg:#0b1226; --panel:#121a30; --line:rgba(255,255,255,.14); --blue:#2f7de1; --cyan:#4fc3f7; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  button,input{font:inherit;color:inherit}
  *{-webkit-touch-callout:none}
  [hidden]{display:none !important}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));box-sizing:border-box}
  .center{justify-content:center;align-items:center;text-align:center;gap:14px;overflow:auto}
  h1{margin:0;font-size:24px}
  p{margin:0;color:var(--soft);font-size:15px;line-height:1.5;max-width:420px}
  .code{font:800 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-align:center;width:9.5ch;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:#0e1730;color:#fff}
  .code:focus{outline:2px solid var(--cyan)}
  .cta{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:200px;padding:14px 22px;border-radius:14px;font-size:17px;font-weight:700;box-sizing:border-box;text-align:center}
  .cta.blue{background:var(--blue);color:#fff}
  .cta.line{border:1px solid rgba(255,255,255,.25)}
  .msg{min-height:1.4em;font-size:14px;color:var(--muted)}
  .msg.err{color:#ffd6d6}
  .steps{display:flex;gap:8px;justify-content:center}
  .steps i{width:28px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
  .steps i.on{background:var(--cyan)}
  .phoneart{width:150px;height:86px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}

  /* controller: a rover console like the one on the big screen */
  .top{display:flex;align-items:center;gap:8px}
  .modes{display:flex;gap:5px;flex:1;background:#0a1128;border:2px solid #33447a;border-radius:16px;padding:4px}
  .modes button{all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 2px;border-radius:11px;font-weight:800;font-size:14px;color:#b9c6ea}
  .modes button.on{background:var(--accent);color:#fff;box-shadow:0 0 0 2px #0a0d1c inset,0 0 12px var(--accent)}
  body.arm .modes button.on{color:#2a1a00}
  body{--accent:#2f7de1} body.arm{--accent:#f2a93b} body.magnet{--accent:#e5484d} body.laser{--accent:#a259ff}
  .stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
  .stat i{width:9px;height:9px;border-radius:50%;background:#8a94a8}
  .stat.ok i{background:var(--cyan)}
  .teamtag{display:flex;justify-content:space-between;align-items:center;margin-top:10px;border-radius:12px;padding:8px 12px;font-weight:900;letter-spacing:.06em;font-size:14px;color:#fff;border:3px solid #0a0d1c}
  .teamtag.blue{background:#2f7de1} .teamtag.gold{background:#f2a93b;color:#2a1a00}
  .teamtag span{font-variant-numeric:tabular-nums;font-size:18px}
  .task{font-size:14px;font-weight:700;color:#fff;margin:10px 2px 0;line-height:1.35;min-height:1.35em}
  .pad{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;min-height:0;background:linear-gradient(180deg,#1e2b56,#0b1228);border:3px solid #3a4c86;border-radius:24px;padding:14px;position:relative}
  .pad:before{content:"";position:absolute;left:22%;right:22%;top:5px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
  .wheel{width:min(190px,92%);aspect-ratio:1;touch-action:none}
  .wheel svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 12px rgba(47,125,225,.45))}
  .lbl{font-size:12px;font-weight:700;color:var(--soft);text-align:center}
  .joy{width:min(180px,90%);aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;background:radial-gradient(circle,#0a1128 0 60%,#1a2448 61%);border:4px solid #0a0d1c;box-shadow:0 0 0 3px #33447a,0 0 16px var(--accent);box-sizing:border-box}
  .joy i{position:absolute;left:50%;top:50%;width:38%;height:38%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff,var(--accent) 72%);border:3px solid #0a0d1c;box-shadow:0 4px 0 #0a0d1c;pointer-events:none}
  .joy b{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#b9c6ea;pointer-events:none}
  .joy b.t{top:10%} .joy b.d{bottom:9%}
  .acts{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap;align-content:center}
  .b{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border:3px solid #0a0d1c;box-shadow:0 4px 0 #0a0d1c;font-weight:900;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
  .b.press{transform:translateY(3px);box-shadow:0 1px 0 #0a0d1c}
  .go{width:96px;height:140px;border-radius:16px 16px 20px 20px;font-size:18px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 3px,transparent 3px 12px),linear-gradient(#3b8af0,#2766c4)}
  .back{width:78px;height:92px;border-radius:14px 14px 18px 18px;font-size:15px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 3px,transparent 3px 12px),#3a4672}
  .big{width:120px;height:120px;border-radius:50%;font-size:17px;border-width:4px;box-shadow:0 5px 0 #0a0d1c}
  .big.grab{background:radial-gradient(circle at 40% 35%,#ffc566,#f2a93b 70%);color:#2a1a00}
  .big.mag{background:radial-gradient(circle at 40% 35%,#ff7a7e,#e5484d 70%)}
  .big.fire{background:radial-gradient(circle at 40% 35%,#c99bff,#a259ff 70%)}
  .big.spray{background:radial-gradient(circle at 40% 35%,#7fd0ff,#2f7de1 70%);color:#fff}
  .big.drill{background:radial-gradient(circle at 40% 35%,#9d7bff,#5b3fb8 70%);color:#fff}
  #modes button[hidden]{display:none}
  .b.launch{background:#2f7de1;color:#fff;font-weight:900}
  .big.on{box-shadow:0 1px 0 #0a0d1c,0 0 22px var(--accent);transform:translateY(4px)}
  .sm{width:70px;height:56px;border-radius:14px;background:#24305a;font-size:13px}
  .sm.aim{background:#fff;color:#14182a}
  .col{display:flex;flex-direction:column;gap:8px}
  .slider{width:52px;height:136px;border-radius:14px;background:#0a1128;border:3px solid #0a0d1c;position:relative;box-sizing:border-box;touch-action:none;font-size:9px;font-weight:900;color:#b9c6ea}
  .slider .tk{position:absolute;left:50%;top:20px;bottom:20px;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(var(--accent),#24305a)}
  .slider .th{position:absolute;left:50%;width:36px;height:18px;margin:-9px 0 0 -18px;border-radius:6px;background:#dfe6f4;border:3px solid #0a0d1c;box-sizing:border-box}
  .slider .tl,.slider .bl{position:absolute;left:0;right:0;text-align:center}
  .slider .tl{top:4px} .slider .bl{bottom:4px}
  .bottom{display:flex;gap:8px;margin-top:10px}
  .bottom .b{flex:1;min-height:46px;font-size:14px;border-radius:14px;background:#0e1730;border:2px solid var(--line);box-shadow:none;font-weight:700}
  /* the quiz, while a question is open on the big screen (owner, 2026-11-26) */
  #sQuiz{gap:14px;overflow:auto;touch-action:pan-y}
  /* the rocket's messages between stages (owner, 2026-11-27) */
  #sBrief{gap:14px;overflow:auto;touch-action:pan-y}
  .bcount{font-size:13px;font-weight:800;color:var(--soft)}
  .bmis{background:#121a30;border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;color:#fff}
  .bmis:empty{display:none}
  .bmis b{display:block;font-size:12px;letter-spacing:.06em;color:#ffd23f;margin-bottom:4px}
  .bmis ol{margin:6px 0 0;padding-left:20px}
  #sBrief .cta{width:100%;touch-action:manipulation}
  .qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .kicker{font-size:14px;font-weight:800;color:#ffd23f}
  .say{all:unset;cursor:pointer;flex:none;width:46px;height:46px;border-radius:50%;background:#24305a;border:2px solid var(--line);display:grid;place-items:center}
  .say svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .qq{font-size:22px;font-weight:800;line-height:1.3;color:#fff}
  .qopts{display:flex;flex-direction:column;gap:10px}
  .qopts.two{display:grid;grid-template-columns:1fr 1fr}
  .qopt{all:unset;cursor:pointer;box-sizing:border-box;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:#121a30;padding:16px;min-height:58px;font-size:18px;font-weight:800;line-height:1.3;color:#fff;touch-action:manipulation}
  .qopt.p{background:#fdfcf7;color:#1d3a8f;border-color:transparent;padding:8px;text-align:center;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
  .qopt.p img{display:block;width:100%;height:auto}
  .qopt.p span{display:block;font-size:18px}
  .qopt.press{transform:translateY(2px)}
  .qopt.right{border-color:#4fc3f7;background:rgba(79,195,247,.18)}
  .qopt.p.right{box-shadow:0 0 0 4px #4fc3f7;background:#fdfcf7}
  .qopt.wrong{opacity:.55;text-decoration:line-through}
  .qwhy{font-size:16px;line-height:1.5;color:var(--soft);max-width:none}
  .qwhy b{color:#fff}
  .qbig{font-size:34px;font-weight:900;color:#fff;margin:0}
  #sQuiz .cta{width:100%;touch-action:manipulation}
  @media (orientation: portrait){
    .pad{grid-template-columns:1fr;grid-template-rows:1fr auto}
  }
</style>
</head>
<body>

<!-- 1: join -->
<section class="screen center" id="sJoin">
  <h1>Remote Lunar Mission Controller</h1>
  <p>Type the room code shown on the big screen, then tap Connect.</p>
  <input class="code" id="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000" aria-label="Room code">
  <button class="cta blue" id="bJoin">Connect</button>
  <div class="msg" id="joinMsg" role="status"></div>
</section>

<!-- 2: calibrate -->
<section class="screen center" id="sCal" hidden>
  <div class="steps"><i id="st1"></i><i id="st2"></i><i id="st3"></i></div>
  <svg class="phoneart" id="phoneArt" viewBox="0 0 150 86" aria-hidden="true"><rect x="10" y="8" width="130" height="70" rx="12" fill="#1b2747" stroke="#4fc3f7" stroke-width="3"/><rect x="22" y="18" width="106" height="50" rx="5" fill="#0b1226"/><circle cx="133" cy="43" r="3" fill="#4fc3f7"/></svg>
  <h1 id="calTitle">Hold the phone sideways</h1>
  <p id="calText">Hold it like a steering wheel, screen facing you. Keep it still, then tap Ready.</p>
  <button class="cta blue" id="bReady">Ready</button>
  <button class="cta line" id="bTouch">Use touch instead of tilting</button>
  <div class="msg" id="calMsg" role="status"></div>
</section>

<!-- 3: controller -->
<section class="screen" id="sPad" hidden>
  <div class="top">
    <div class="modes" id="modes">
      <button data-m="drive" class="on">Drive</button>
      <button data-m="arm">Arm</button>
      <button data-m="magnet">Magnet</button>
      <button data-m="laser">Laser</button>
      <button data-m="drill" hidden>Drill</button>
      <button data-m="hose" hidden>Hose</button>
    </div>
    <span class="stat" id="stat"><i></i><span id="statTxt">Connected</span></span>
  </div>
  <div class="teamtag" id="teamTag" hidden></div>
  <div class="task" id="task"></div>
  <div class="pad">
    <div class="zone" id="zone"></div>
    <div class="acts" id="acts"></div>
  </div>
  <div class="bottom">
    <button class="b launch" id="bLaunch" hidden>Launch</button>
    <button class="b" id="bScan">Scan</button>
    <button class="b" id="bNotes">Notes</button>
    <button class="b" id="bTest" hidden>Test the power</button>
    <button class="b" id="bPause">Pause</button>
    <button class="b" id="bCal">Tilt setup</button>
  </div>
</section>

<!-- 5: the rocket's messages between stages, while they are on the big screen -->
<section class="screen" id="sBrief" hidden>
  <div class="qtop"><span class="kicker" id="bKick"></span><span class="bcount" id="bCount"></span></div>
  <p class="qq" id="bLine"></p>
  <div class="bmis" id="bMis"></div>
  <button class="cta blue" id="bBriefNext" type="button">Next</button>
</section>

<!-- 4: the quiz, while a question is open on the big screen -->
<section class="screen" id="sQuiz" hidden>
  <div class="qtop"><span class="kicker" id="qKick"></span><button class="say" id="qSay" aria-label="Read it to me"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button></div>
  <div id="qBody"></div>
</section>

<script>
"use strict";
/* BEGIN pure */
/* tilt: learn which way this phone tilts, then turn tilt angles into -1..1 controls */
function wrapDeg(d){ return ((d % 360) + 540) % 360 - 180; }
function clampN(v, a, b){ return v < a ? a : v > b ? b : v; }
function shapeAxis(v){ v = clampN(v, -1, 1); const a = Math.abs(v); if (a < 0.12) return 0; return Math.sign(v) * (a - 0.12) / 0.88; }
/* from a "tilt it right" sample: which sensor axis moved most, and which way */
function learnLR(cal, beta, gamma){
  const db = wrapDeg(beta - cal.b0), dg = wrapDeg(gamma - cal.g0);
  if (Math.max(Math.abs(db), Math.abs(dg)) < 14) return null;
  return Math.abs(dg) >= Math.abs(db) ? { lr: "g", lrS: Math.sign(dg) } : { lr: "b", lrS: Math.sign(db) };
}
/* from a "tip the top away" sample, on the other axis */
function learnFB(cal, beta, gamma){
  const d = cal.lr === "g" ? wrapDeg(beta - cal.b0) : wrapDeg(gamma - cal.g0);
  if (Math.abs(d) < 12) return null;
  return Math.sign(d);
}
function tiltAxes(cal, beta, gamma, range){
  range = range || 28;
  const db = wrapDeg(beta - cal.b0), dg = wrapDeg(gamma - cal.g0);
  const lrRaw = cal.lr === "g" ? dg : db, fbRaw = cal.lr === "g" ? db : dg;
  return { lr: shapeAxis(lrRaw * cal.lrS / range), fb: shapeAxis(fbRaw * (cal.fbS || 1) / range) };
}
function readCode(s){ const d = String(s || "").replace(/\D/g, ""); return /^[1-9]\d{5}$/.test(d) ? d : null; }
/* END pure */

const $ = (id) => document.getElementById(id);
/* a long press must never open the phone's menu: it would cancel a held GO, MAGNET or FIRE */
addEventListener("contextmenu", (e) => { if (!e.target.closest("input")) e.preventDefault(); });
const show = (id) => ["sJoin", "sCal", "sPad", "sQuiz", "sBrief"].forEach(s => $(s).hidden = s !== id);
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_e) {} };

/* ---------- connection: the same Supabase Realtime room the game opened ---------- */
const SB_URL = "https://wdctkfhwygwwulipwnys.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkY3RrZmh3eWd3d3VsaXB3bnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTUzNjUsImV4cCI6MjEwMzU5MTM2NX0.5KraVohURHNDx-n0mb6o3egJPf1KkpecBSz8fMRlQcI";
const C = { sb: null, ch: null, code: "", id: Array.from(crypto.getRandomValues(new Uint32Array(2))).join("-"), hostSeen: 0, hb: 0, sendT: 0, kicked: false };
const S = { m: "drive", held: false, test: false, paused: false, r: 0.2, step: "", mag: false, firing: false, tools: ["drive", "arm", "magnet", "laser"], launch: false };
function loadOne(src){ return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("load")); document.head.appendChild(s); }); }
function loadSb(){ return window.supabase ? Promise.resolve() : loadOne("/assets/vendor/supabase.js").catch(() => loadOne("https://unpkg.com/@supabase/supabase-js@2.112.4/dist/umd/supabase.js")); }
function send(p){ if (!C.ch) return; p.i = C.id; try { const r = C.ch.send({ type: "broadcast", event: "m", payload: p }); if (r && r.catch) r.catch(() => {}); } catch (_e) {} }
async function connect(code){
  await loadSb();
  if (!C.sb) C.sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }, realtime: { params: { eventsPerSecond: 30 } } });
  if (C.ch){ try { await C.sb.removeChannel(C.ch); } catch (_e) {} C.ch = null; }
  const ch = C.sb.channel("lunarsalvage-remote-" + code, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "m" }, (e) => onMsg(e.payload));
  await new Promise((ok, no) => {
    const to = setTimeout(() => no(new Error("timeout")), 9000);
    ch.subscribe((s) => { if (s === "SUBSCRIBED"){ clearTimeout(to); ok(); } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT"){ clearTimeout(to); no(new Error(s)); } });
  });
  C.ch = ch; C.code = code; C.hostSeen = 0; C.kicked = false;
  send({ t: "who" });
  for (let k = 0; k < 10 && !C.hostSeen && !C.kicked; k++) await new Promise(r => setTimeout(r, 400));
  if (C.kicked) throw new Error("full");
  if (!C.hostSeen) throw new Error("nohost");
  send({ t: "hi" });
  clearInterval(C.hb);
  C.hb = setInterval(() => {
    send({ t: "hi" });
    const quiet = performance.now() - C.hostSeen > 7000;
    $("stat").classList.toggle("ok", !quiet);
    $("statTxt").textContent = quiet ? "Looking for the game" : "Connected";
    if (quiet) send({ t: "who" });
  }, 2000);
}
function onMsg(p){
  if (!p || p.i === C.id) return;
  if (p.t === "host"){ C.hostSeen = performance.now(); return; }
  if (p.t === "full" && p.to === C.id){
    C.kicked = true;
    if (p.bye){ clearInterval(C.hb); show("sJoin"); $("joinMsg").textContent = "The big screen disconnected this phone."; }
    else $("joinMsg").textContent = "Another phone is already driving this rover.";
    return;
  }
  if (p.t === "gone"){ $("statTxt").textContent = "The game closed"; $("stat").classList.remove("ok"); return; }
  if (p.t === "st"){
    /* in the Rover Contest each phone gets its own messages */
    if (p.to && p.to !== C.id) return;
    C.hostSeen = performance.now();
    S.team = p.team || ""; S.score = p.score || 0;
    const modeChanged = p.m !== S.m, heldChanged = !!p.held !== S.held;
    S.m = p.m; S.held = !!p.held; S.test = !!p.test; S.paused = !!p.paused; S.step = p.step || ""; S.mag = !!p.mag; S.firing = !!p.firing;
    /* the game says which tools this world has right now; an older game sends none, so keep the four */
    if (Array.isArray(p.tools)) S.tools = p.tools.filter(t => typeof t === "string");
    S.launch = !!p.launch;
    if (modeChanged && typeof p.r === "number") S.r = clampN(p.r, 0, 1);
    /* only a new tool rebuilds the buttons: rebuilding while a finger holds MAGNET would let go of the part */
    paintPad(modeChanged);
    quizState(p.quiz || null);
    briefState(p.quiz ? null : (p.brief || null));
  }
}

/* ---------- the rocket's messages between stages: read them here, and Next (or Land) moves them on there ---------- */
let briefKey = "";
function briefState(z){
  if (!z || typeof z !== "object"){ briefKey = ""; if (!$("sBrief").hidden) show("sPad"); return; }
  if ($("sPad").hidden && $("sBrief").hidden) return;   /* still joining, setting up tilt, or on a question */
  const key = JSON.stringify(z);
  if (key === briefKey && !$("sBrief").hidden) return;
  briefKey = key;
  $("bKick").textContent = "Message from " + String(z.who || "Mission Control");
  $("bCount").textContent = (+z.i || 1) + " of " + (+z.n || 1);
  $("bLine").textContent = String(z.text || "");
  const mis = $("bMis"); mis.textContent = "";
  if (z.goal){
    const h = document.createElement("b"); h.textContent = z.loc ? "Next stop: " + String(z.loc) : "Mission brief";
    const g = document.createElement("div"); g.textContent = String(z.goal);
    mis.append(h, g);
    if (Array.isArray(z.steps) && z.steps.length){
      const ol = document.createElement("ol");
      z.steps.slice(0, 8).forEach(t => { const li = document.createElement("li"); li.textContent = String(t); ol.append(li); });
      mis.append(ol);
    }
  }
  const btn = $("bBriefNext"); btn.textContent = z.last ? "Land" : "Next"; btn.disabled = false;
  if ($("sBrief").hidden){ show("sBrief"); buzz([20, 40, 20]); }
}
$("bBriefNext").onclick = () => { $("bBriefNext").disabled = true; send({ t: "brief", next: 1 }); buzz(20); };

/* ---------- the quiz: the big screen sends its question; a tap here answers it there ---------- */
let quizKey = "";
/* an answer picture, drawn as an image: a picture can't run anything on this page, whoever sent it */
function quizImg(svg){
  if (typeof svg !== "string" || svg.indexOf("<svg") !== 0) return null;
  const im = document.createElement("img");
  im.alt = "";
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#1d3a8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#1d3a8f"'));
  return im;
}
function quizState(z){
  if (!z || typeof z !== "object"){ quizKey = ""; if (!$("sQuiz").hidden) show("sPad"); return; }
  if ($("sPad").hidden && $("sQuiz").hidden) return;   /* still joining or setting up tilt */
  const key = JSON.stringify(z);
  if (key === quizKey && !$("sQuiz").hidden) return;
  quizKey = key;
  paintQuiz(z);
  if ($("sQuiz").hidden){ show("sQuiz"); buzz([20, 40, 20]); }
}
function quizButton(text, act){ const b = document.createElement("button"); b.className = "cta blue"; b.textContent = text; b.onclick = act; return b; }
function paintQuiz(z){
  const body = $("qBody"); body.textContent = "";
  $("qSay").hidden = !!z.done;
  if (z.done){
    $("qKick").textContent = String(z.kid || "") + "'s questions";
    const h = document.createElement("p"); h.className = "qbig"; h.textContent = (+z.right || 0) + " of " + (+z.of || 0) + " right";
    const t = document.createElement("p"); t.className = "qwhy"; t.textContent = z.right === z.of ? "You think like a space engineer. That's a star!" : "Good try. You can take them again any time from Pause.";
    body.append(h, t, quizButton(String(z.back || "Back to the rover"), () => { send({ t: "quiz", done: 1 }); buzz(20); }));
    return;
  }
  $("qKick").textContent = String(z.kid || "") + "'s question " + (+z.n || 1) + " of " + (+z.of || 3);
  const q = document.createElement("p"); q.className = "qq"; q.textContent = String(z.q || "");
  const opts = document.createElement("div"); opts.className = "qopts" + (z.two ? " two" : "");
  (Array.isArray(z.opts) ? z.opts : []).slice(0, 6).forEach((o, k) => {
    const b = document.createElement("button");
    const im = o && o.pic ? quizImg(o.pic) : null;
    b.className = "qopt" + (im ? " p" : "");
    if (im){ const s = document.createElement("span"); s.textContent = String(o.t || ""); b.append(im, s); b.setAttribute("aria-label", String(o.t || "")); }
    else b.textContent = String((o && o.t) || "");
    if (z.answered){ if (k === z.a) b.classList.add("right"); else if (k === z.pick) b.classList.add("wrong"); b.disabled = true; }
    else b.onclick = () => { opts.querySelectorAll("button").forEach(x => x.disabled = true); b.classList.add("press"); send({ t: "quiz", a: k }); buzz(25); };
    opts.append(b);
  });
  body.append(q, opts);
  if (z.answered){
    const w = document.createElement("p"); w.className = "qwhy";
    const strong = document.createElement("b"); strong.textContent = z.ok ? "Right! " : "Not quite. ";
    w.append(strong, String(z.why || ""));
    body.append(w, quizButton(z.last ? "See how you did" : "Next", () => { send({ t: "quiz", next: 1 }); buzz(20); }));
    buzz(z.ok ? [30, 50, 30] : 120);
  }
}
$("qSay").onclick = () => { send({ t: "quiz", say: 1 }); buzz(15); };
addEventListener("pagehide", () => send({ t: "bye" }));

/* ---------- join ---------- */
const q = new URLSearchParams(location.search).get("c");
if (readCode(q)) $("code").value = readCode(q);
$("code").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
$("bJoin").onclick = async () => {
  const code = readCode($("code").value);
  if (!code){ $("joinMsg").textContent = "The code is the six numbers on the big screen."; return; }
  /* iPhones ask before sharing tilt; this tap is when they may ask */
  await askMotion();
  $("joinMsg").className = "msg"; $("joinMsg").textContent = "Connecting";
  $("bJoin").disabled = true;
  try {
    /* a phone that just closed the page still counts for a few seconds, so try again before giving up */
    for (let tries = 0; ; tries++){
      try { await connect(code); break; }
      catch (e){
        if (e.message !== "full" || tries >= 3) throw e;
        $("joinMsg").textContent = "Another phone is connected. Trying again";
        await new Promise(r => setTimeout(r, 2500));
      }
    }
    buzz(30);
    startCal();
  } catch (e){
    $("joinMsg").className = "msg err";
    $("joinMsg").textContent = e.message === "nohost" ? "No game is using that code. Check the six numbers on the big screen." : e.message === "full" ? "Another phone is already driving this rover." : "Couldn't connect. Check the phone's internet and try again.";
  }
  $("bJoin").disabled = false;
};

/* ---------- tilt ---------- */
const T = { beta: null, gamma: null, at: 0, cal: null, touch: false, phase: 0 };
let motionAsked = false;
async function askMotion(){
  if (motionAsked) return;
  motionAsked = true;
  try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") await DeviceOrientationEvent.requestPermission(); } catch (_e) {}
  addEventListener("deviceorientation", (e) => { if (e.beta == null || e.gamma == null) return; T.beta = e.beta; T.gamma = e.gamma; T.at = performance.now(); calTick(); });
}
function startCal(){
  show("sCal"); T.phase = 0; T.cal = null;
  setCal(0, "Hold the phone sideways", "Hold it like a steering wheel, screen facing you. Keep it still, then tap Ready.");
  $("bReady").hidden = false; $("calMsg").textContent = "";
  /* no tilt sensor (a laptop, or tilt is blocked): go straight to touch */
  setTimeout(() => { if (T.beta == null && !$("sCal").hidden){ $("calMsg").textContent = "This phone isn't sharing its tilt, so the touch controls are ready instead."; setTimeout(useTouch, 1600); } }, 1800);
}
function setCal(step, title, text){
  ["st1", "st2", "st3"].forEach((id, i) => $(id).classList.toggle("on", i <= step));
  $("calTitle").textContent = title; $("calText").textContent = text;
  $("phoneArt").style.transform = step === 1 ? "rotate(18deg)" : step === 2 ? "perspective(200px) rotateX(28deg)" : "none";
}
$("bReady").onclick = () => {
  if (T.beta == null){ useTouch(); return; }
  T.cal = { b0: T.beta, g0: T.gamma, lr: null, lrS: 1, fbS: 1 };
  T.phase = 1; $("bReady").hidden = true;
  setCal(1, "Now turn it right", "Turn the phone to the right, like turning a steering wheel.");
  buzz(20);
};
function calTick(){
  if (T.phase === 1){
    const r = learnLR(T.cal, T.beta, T.gamma);
    if (r){ Object.assign(T.cal, r); T.phase = 3; buzz([30, 60, 30]); setCal(2, "All set", "Turn the phone like a steering wheel to drive. The Arm, the Magnet and the Laser use the joystick on the screen."); setTimeout(() => usePad(false), 1200); }
  } else if (T.phase === 2){
    const f = learnFB(T.cal, T.beta, T.gamma);
    if (f){ T.cal.fbS = f; T.phase = 3; buzz([30, 60, 30]); setCal(2, "All set", "Tilt to steer and aim. Tip away lowers the arm, tip back raises it."); setTimeout(() => usePad(false), 900); }
  }
}
$("bTouch").onclick = () => useTouch();
function useTouch(){ T.touch = true; usePad(true); }
function usePad(touch){
  T.touch = touch;
  show("sPad");
  paintPad(true);
  send({ t: "b", b: "start" });
}
$("bCal").onclick = () => { T.touch = false; startCal(); };

/* ---------- controller: a steering wheel and pedals to drive; a joystick, a reach lever and one big
   button for the Arm, the Magnet and the Laser ---------- */
const WHEEL = '<svg viewBox="0 0 120 120" aria-hidden="true"><g id="wheelRot"><circle cx="60" cy="60" r="50" fill="none" stroke="#0a0d1c" stroke-width="17"/><circle cx="60" cy="60" r="50" fill="none" stroke="#dfe6f4" stroke-width="11"/>'
  + '<path d="M17 52a44 44 0 0 1 6-14M97 38a44 44 0 0 1 6 14" stroke="#2f7de1" stroke-width="7" stroke-linecap="round" fill="none"/>'
  + '<path d="M14 66h30M76 66h30M60 76v32" stroke="#0a0d1c" stroke-width="15" stroke-linecap="round"/><path d="M14 66h30M76 66h30M60 76v32" stroke="#dfe6f4" stroke-width="9" stroke-linecap="round"/>'
  + '<circle cx="60" cy="64" r="17" fill="#2f7de1" stroke="#0a0d1c" stroke-width="4"/><circle cx="60" cy="64" r="6" fill="#5fd2ff"/><rect x="55" y="5" width="10" height="13" rx="3" fill="#5fd2ff" stroke="#0a0d1c" stroke-width="2.5"/></g></svg>';
const K = { steer: 0, wheelId: null, jx: 0, jy: 0, joyId: null, reachId: null, go: 0, bk: 0, big: 0 };
let built = "";
function paintPad(rebuild){
  document.body.className = S.m;
  document.querySelectorAll("#modes button").forEach(b => { b.classList.toggle("on", b.dataset.m === S.m); b.hidden = !S.tools.includes(b.dataset.m); });
  $("bLaunch").hidden = !S.launch;
  $("task").textContent = S.paused ? "Paused" : S.step;
  const tt = $("teamTag"); tt.hidden = !S.team;
  if (S.team){ tt.className = "teamtag " + S.team; tt.textContent = ""; tt.append(S.team === "blue" ? "BLUE ROVER" : "GOLD ROVER"); const sc = document.createElement("span"); sc.textContent = S.score; tt.append(sc); }
  $("bTest").hidden = !S.test;
  $("bPause").textContent = S.paused ? "Resume" : "Pause";
  $("bCal").hidden = S.m !== "drive";
  const key = S.m + (T.touch ? "t" : "");
  if (built !== key || rebuild){
    built = key;
    const zone = $("zone"), acts = $("acts");
    K.jx = K.jy = 0; K.go = K.bk = K.big = 0; K.wheelId = K.joyId = K.reachId = null;
    if (S.m === "drill"){
      zone.innerHTML = '<div class="lbl" style="font-size:16px;line-height:1.4;max-width:16em;margin:auto">Park the rover on a dashed ring, then hold DRILL until it finds something.</div>';
      acts.innerHTML = '<button class="b big drill" data-h="fire" id="big">DRILL</button>';
    } else if (S.m === "drive"){
      zone.innerHTML = '<div class="wheel" id="wheel" data-c="wheel">' + WHEEL + '</div><div class="lbl">' + (T.touch ? "Hold the wheel and slide to steer" : "Turn your phone to steer") + "</div>";
      acts.innerHTML = '<button class="b back" data-h="bk">BACK</button><button class="b go" data-h="go">GO</button>';
    } else {
      zone.innerHTML = '<div class="joy" id="joy" data-c="joy"><b class="t">UP</b><b class="d">DOWN</b><i id="knob"></i></div><div class="lbl">' + (S.m === "laser" ? "Aim the laser" : S.m === "hose" ? "Aim the hose" : "Swing and lift the arm") + "</div>";
      const slider = '<div class="slider" id="reach" data-c="reach"><span class="tl">FAR</span><span class="tk"></span><span class="th" id="reachTh"></span><span class="bl">NEAR</span></div>';
      if (S.m === "arm") acts.innerHTML = '<div class="col"><button class="b sm aim" data-a="aim">AIM</button><button class="b sm" data-a="rot">TURN</button></div>' + slider + '<button class="b big grab" data-a="grab" id="big">' + (S.held ? "LET GO" : "GRAB") + "</button>";
      else if (S.m === "magnet") acts.innerHTML = '<div class="col"><button class="b sm aim" data-a="aim">AIM</button></div>' + slider + '<button class="b big mag" data-h="mag" id="big">MAGNET</button>';
      else if (S.m === "hose") acts.innerHTML = '<div class="col"><button class="b sm aim" data-a="aim">AIM</button></div><button class="b big spray" data-h="fire" id="big">SPRAY</button>';
      else acts.innerHTML = '<div class="col"><button class="b sm aim" data-a="aim">AIM</button></div><button class="b big fire" data-h="fire" id="big">FIRE</button>';
    }
  }
  const big = $("big");
  if (big && S.m === "arm") big.textContent = S.held ? "LET GO" : "GRAB";
  if (big && S.m !== "arm") big.classList.toggle("on", S.m === "magnet" ? S.mag : S.firing);
  const th = $("reachTh"); if (th && K.reachId == null) th.style.top = (20 + (1 - S.r) * (th.parentNode.clientHeight - 40)) + "px";
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => { send({ t: "mode", m: b.dataset.m }); buzz(15); });
(function(){
  const pad = $("sPad");
  const hold = { go: "go", bk: "bk", mag: "big", fire: "big" };
  function wheelMove(el, e){ const r = el.getBoundingClientRect(); K.steer = clampN((e.clientX - (r.left + r.width / 2)) / (r.width * 0.36), -1, 1); }
  function joyMove(el, e){
    const r = el.getBoundingClientRect(), max = r.width / 2 - r.width * 0.19;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const d = Math.hypot(dx, dy);
    if (d > max){ dx *= max / d; dy *= max / d; }
    $("knob").style.transform = "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px))";
    K.jx = shapeAxis(dx / max); K.jy = shapeAxis(-dy / max);
  }
  function reachMove(el, e){ const r = el.getBoundingClientRect(); S.r = clampN(1 - (e.clientY - r.top - 20) / (r.height - 40), 0, 1); const th = $("reachTh"); if (th) th.style.top = (20 + (1 - S.r) * (r.height - 40)) + "px"; }
  pad.addEventListener("pointerdown", (e) => {
    const el = e.target.closest("[data-c],[data-h],[data-a]"); if (!el || !pad.contains(el)) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_e) {}
    el.dataset.pid = e.pointerId;
    if (el.dataset.c === "wheel"){ if (T.touch){ K.wheelId = e.pointerId; wheelMove(el, e); } }
    else if (el.dataset.c === "joy"){ K.joyId = e.pointerId; joyMove(el, e); }
    else if (el.dataset.c === "reach"){ K.reachId = e.pointerId; reachMove(el, e); }
    else if (el.dataset.h){ K[hold[el.dataset.h]] = 1; el.classList.add("press"); buzz(10); }
    else if (el.dataset.a){ el.classList.add("press"); send({ t: "b", b: el.dataset.a }); buzz(25); }
  });
  pad.addEventListener("pointermove", (e) => {
    if (e.pointerId === K.wheelId){ const w = $("wheel"); if (w) wheelMove(w, e); }
    else if (e.pointerId === K.joyId){ const j = $("joy"); if (j) joyMove(j, e); }
    else if (e.pointerId === K.reachId){ const r = $("reach"); if (r) reachMove(r, e); }
  });
  function end(e){
    if (e.pointerId === K.wheelId) K.wheelId = null;
    if (e.pointerId === K.joyId){ K.joyId = null; K.jx = K.jy = 0; const k = $("knob"); if (k) k.style.transform = ""; }
    if (e.pointerId === K.reachId) K.reachId = null;
    pad.querySelectorAll('[data-pid="' + e.pointerId + '"]').forEach(el => { delete el.dataset.pid; el.classList.remove("press"); if (el.dataset.h) K[hold[el.dataset.h]] = 0; });
  }
  pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end); pad.addEventListener("lostpointercapture", end);
})();
$("bScan").onclick = () => { send({ t: "b", b: "scan" }); buzz(20); };
$("bNotes").onclick = () => { send({ t: "notes" }); buzz(15); };
$("bLaunch").onclick = () => { send({ t: "launch" }); buzz([60, 40, 60]); };
$("bTest").onclick = () => { send({ t: "b", b: "test" }); buzz([40, 40, 40]); };
$("bPause").onclick = () => send({ t: "b", b: "pause" });

/* about 16 updates a second while the controller is open */
setInterval(() => {
  if ($("sPad").hidden || !C.ch) return;
  let lr = 0;
  if (S.m === "drive"){
    if (T.touch){ if (K.wheelId == null) K.steer *= 0.6; lr = K.steer; }
    else if (T.cal && T.beta != null) lr = tiltAxes(T.cal, T.beta, T.gamma).lr;
    const w = $("wheelRot"); if (w) w.setAttribute("transform", "rotate(" + (lr * 110).toFixed(1) + " 60 60)");
  }
  const msg = { t: "in", lr: +lr.toFixed(3), jx: +K.jx.toFixed(3), jy: +K.jy.toFixed(3), go: K.go, bk: K.bk, mag: S.m === "magnet" ? K.big : 0, fire: S.m === "laser" || S.m === "drill" || S.m === "hose" ? K.big : 0 };
  if (K.reachId != null) msg.r = +S.r.toFixed(3);   /* only while the lever is moving, so Aim can move the arm */
  send(msg);
}, 60);
</script>

</body>
