<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline | Chike's Creative Space</title>
<meta name="theme-color" content="#FAF4E6">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF4E6; --ink: #1E2226; --sun: #F2C230; --cyan: #1273B0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background:var(--paper); color:var(--ink);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    text-align:center;
  }
  .card{ max-width:440px; }
  .mark{
    width:88px; height:88px; margin:0 auto 22px; border-radius:24px;
    background:var(--sun); display:flex; align-items:center; justify-content:center;
    box-shadow:6px 6px 0 var(--ink); border:2px solid var(--ink);
  }
  .mark img{ width:56px; height:56px; object-fit:contain; }
  h1{ font-size:clamp(1.5rem,5vw,2rem); margin:0 0 14px; line-height:1.2; }
  p{ font-size:1.05rem; line-height:1.55; opacity:.82; margin:0 0 26px; }
  button{
    font:inherit; font-weight:800; font-size:1rem; cursor:pointer;
    padding:14px 26px; border-radius:999px; border:2px solid var(--ink);
    background:var(--cyan); color:#FFF6EE; box-shadow:4px 4px 0 var(--ink);
    transition:transform .15s, box-shadow .15s;
  }
  button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  @media (prefers-reduced-motion: reduce){ button{ transition:none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><img src="/assets/brand/logo.webp" alt=""></div>
    <h1>You’re offline, but your next creative adventure is still waiting.</h1>
    <p>Check your connection and try again!</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
