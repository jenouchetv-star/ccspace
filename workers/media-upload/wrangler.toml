name = "media-upload"
main = "index.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "chikes-creative-space-media"

[vars]
# After creating the bucket and enabling public access (see README.md in
# this folder), replace this with the real pub-*.r2.dev URL or your
# custom domain - it must have NO trailing slash.
PUBLIC_BASE_URL = "https://REPLACE-ME.r2.dev"
