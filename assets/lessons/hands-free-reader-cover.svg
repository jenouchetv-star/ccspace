<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="The teal book How Computers See, with a digital hand beside it swiping to turn the page">
  <defs>
    <radialGradient id="cover" cx="70%" cy="20%" r="95%">
      <stop offset="0" stop-color="#18606F"/>
      <stop offset=".7" stop-color="#0B2D36"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D9D6CE" stroke-width="1"/>
    </pattern>
    <pattern id="cgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#7DD3E6" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="#EFEDE8"/>
  <rect width="1600" height="1200" fill="url(#grid)" opacity=".7"/>

  <!-- the book -->
  <ellipse cx="660" cy="1030" rx="330" ry="42" fill="url(#floor)"/>
  <rect x="384" y="196" width="566" height="812" rx="16" fill="#F6F1E6" stroke="#E2DACB" stroke-width="2"/>
  <rect x="378" y="190" width="566" height="812" rx="16" fill="#FBF7EE" stroke="#E2DACB" stroke-width="2"/>
  <rect x="360" y="180" width="572" height="818" rx="16" fill="url(#cover)"/>
  <rect x="360" y="180" width="572" height="818" rx="16" fill="url(#cgrid)"/>
  <rect x="360" y="180" width="44" height="818" rx="10" fill="url(#spine)"/>
  <rect x="420" y="210" width="482" height="758" rx="8" fill="none" stroke="#F3EEE4" stroke-opacity=".3" stroke-width="2"/>
  <text x="458" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" letter-spacing="4" fill="#7DD3E6">HANDS-FREE READER</text>
  <g font-family="Newsreader, Georgia, 'Times New Roman', serif" fill="#F3EEE4" font-size="86" letter-spacing="-1.5">
    <text x="454" y="392">How</text>
    <text x="454" y="480">Computers</text>
    <text x="454" y="568">See</text>
  </g>
  <text x="458" y="624" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#F3EEE4" fill-opacity=".78">A hands-free book about</text>
  <text x="458" y="660" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#F3EEE4" fill-opacity=".78">computer vision</text>

  <!-- the digital hand on the cover -->
  <g transform="translate(640 650) scale(1.8)" stroke="#F3EEE4" stroke-opacity=".8" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M60 150L42 138L30 118L22 100L14 84M60 150L50 88L47 62L45 46L44 32M50 88L66 84L66 56L66 38L66 22M66 84L81 88L83 62L84 46L85 32M81 88L95 95M60 150L95 95L100 76L103 63L106 51"/>
  </g>
  <g transform="translate(640 650) scale(1.8)" fill="#F3EEE4">
    <circle cx="60" cy="150" r="2.6"/><circle cx="42" cy="138" r="2.6"/><circle cx="30" cy="118" r="2.6"/><circle cx="22" cy="100" r="2.6"/>
    <circle cx="50" cy="88" r="2.6"/><circle cx="47" cy="62" r="2.6"/><circle cx="45" cy="46" r="2.6"/>
    <circle cx="66" cy="84" r="2.6"/><circle cx="66" cy="56" r="2.6"/><circle cx="66" cy="38" r="2.6"/>
    <circle cx="81" cy="88" r="2.6"/><circle cx="83" cy="62" r="2.6"/><circle cx="84" cy="46" r="2.6"/>
    <circle cx="95" cy="95" r="2.6"/><circle cx="100" cy="76" r="2.6"/><circle cx="103" cy="63" r="2.6"/>
    <g fill="#67E8F9"><circle cx="14" cy="84" r="3.8"/><circle cx="44" cy="32" r="3.8"/><circle cx="66" cy="22" r="3.8"/><circle cx="85" cy="32" r="3.8"/><circle cx="106" cy="51" r="3.8"/></g>
  </g>
  <rect x="650" y="764" width="230" height="2.4" fill="#67E8F9" opacity=".55"/>

  <!-- beside the book: a big digital hand swiping, with the 21 points the AI finds -->
  <g transform="translate(1030 300) scale(3.2)">
    <path d="M14 26h-9M8 21l-5 5 5 5" fill="none" stroke="#0E7490" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <g stroke="#2B2B30" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M60 150L42 138L30 118L22 100L14 84M60 150L50 88L47 62L45 46L44 32M50 88L66 84L66 56L66 38L66 22M66 84L81 88L83 62L84 46L85 32M81 88L95 95M60 150L95 95L100 76L103 63L106 51"/>
    </g>
    <g fill="#FFFFFF" stroke="#2B2B30" stroke-width="1.1">
      <circle cx="60" cy="150" r="2.3"/><circle cx="42" cy="138" r="2.3"/><circle cx="30" cy="118" r="2.3"/><circle cx="22" cy="100" r="2.3"/>
      <circle cx="50" cy="88" r="2.3"/><circle cx="47" cy="62" r="2.3"/><circle cx="45" cy="46" r="2.3"/>
      <circle cx="66" cy="84" r="2.3"/><circle cx="66" cy="56" r="2.3"/><circle cx="66" cy="38" r="2.3"/>
      <circle cx="81" cy="88" r="2.3"/><circle cx="83" cy="62" r="2.3"/><circle cx="84" cy="46" r="2.3"/>
      <circle cx="95" cy="95" r="2.3"/><circle cx="100" cy="76" r="2.3"/><circle cx="103" cy="63" r="2.3"/>
    </g>
    <g fill="#0E7490"><circle cx="14" cy="84" r="3.4"/><circle cx="44" cy="32" r="3.4"/><circle cx="66" cy="22" r="3.4"/><circle cx="85" cy="32" r="3.4"/><circle cx="106" cy="51" r="3.4"/></g>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#6B6B72">
    <text x="1060" y="840">21 points · swipe left to turn</text>
  </g>
</svg>
