<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="t d">
  <title id="t">A report card of the 2024 national test results</title>
  <desc id="d">Fourth-grade reading down 5 points since 2019, eighth-grade reading down 5 points since 2019, and fourth-grade math down 3 points since 2019 but up 2 since 2022.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#C9DCE2"/>
    </pattern>
    <pattern id="lines" width="10" height="46" patternUnits="userSpaceOnUse">
      <line x1="0" y1="45" x2="10" y2="45" stroke="#E4DCC8" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- the desk -->
  <rect width="1600" height="1200" fill="#E6F0F2"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>

  <g transform="rotate(-3 800 600)">
    <!-- hard shadow, then the card -->
    <rect x="262" y="172" width="1100" height="880" rx="30" fill="#1E2226"/>
    <rect x="248" y="158" width="1100" height="880" rx="30" fill="#FAF4E6" stroke="#1E2226" stroke-width="8"/>
    <!-- header band -->
    <path d="M252 188 a26 26 0 0 1 26 -26 h1040 a26 26 0 0 1 26 26 v122 h-1092 z" fill="#1E2226"/>
    <text x="320" y="262" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="68" letter-spacing="6" fill="#F2C230">REPORT CARD</text>
    <text x="320" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="3" fill="#FAF4E6">U.S. NATIONAL TEST RESULTS · 2024</text>
    <!-- gold star seal -->
    <g transform="translate(1210 236)">
      <circle r="58" fill="#F2C230" stroke="#FAF4E6" stroke-width="6"/>
      <path d="M0 -34 L9.6 -11 L34 -10.5 L15 5 L21 29 L0 15.5 L-21 29 L-15 5 L-34 -10.5 L-9.6 -11 Z" fill="#1E2226"/>
    </g>

    <!-- ruled paper -->
    <rect x="296" y="340" width="1004" height="640" fill="url(#lines)" opacity=".9"/>
    <!-- column labels -->
    <text x="320" y="392" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="3" fill="#1273B0">SUBJECT</text>
    <text x="890" y="392" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="3" fill="#1273B0">CHANGE SINCE 2019</text>
    <line x1="312" y1="412" x2="1284" y2="412" stroke="#1E2226" stroke-width="4"/>

    <!-- rows -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="320" y="504" font-weight="800" font-size="52" fill="#1E2226">4th-grade reading</text>
      <g transform="translate(910 486)"><path d="M0 -26 L26 18 L-26 18 Z" fill="#BC3229" transform="rotate(180)"/></g>
      <text x="956" y="504" font-weight="900" font-size="56" fill="#BC3229">−5 points</text>

      <line x1="312" y1="550" x2="1284" y2="550" stroke="#1E2226" stroke-width="2" opacity=".35"/>
      <text x="320" y="640" font-weight="800" font-size="52" fill="#1E2226">8th-grade reading</text>
      <g transform="translate(910 622)"><path d="M0 -26 L26 18 L-26 18 Z" fill="#BC3229" transform="rotate(180)"/></g>
      <text x="956" y="640" font-weight="900" font-size="56" fill="#BC3229">−5 points</text>

      <line x1="312" y1="686" x2="1284" y2="686" stroke="#1E2226" stroke-width="2" opacity=".35"/>
      <text x="320" y="776" font-weight="800" font-size="52" fill="#1E2226">4th-grade math</text>
      <g transform="translate(910 758)"><path d="M0 -26 L26 18 L-26 18 Z" fill="#BC3229" transform="rotate(180)"/></g>
      <text x="956" y="776" font-weight="900" font-size="56" fill="#BC3229">−3 points</text>
      <text x="956" y="818" font-weight="700" font-size="28" fill="#1273B0">(but +2 since 2022)</text>
    </g>

    <!-- footer -->
    <line x1="312" y1="880" x2="1284" y2="880" stroke="#1E2226" stroke-width="4"/>
    <text x="320" y="934" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#4A545C">Source: NAEP 2024, the Nation’s Report Card</text>
  </g>

  <!-- a pencil resting across the corner -->
  <g transform="translate(1180 980) rotate(-28)">
    <rect x="-250" y="-22" width="380" height="44" fill="#F2C230" stroke="#1E2226" stroke-width="6"/>
    <line x1="-250" y1="0" x2="130" y2="0" stroke="#1E2226" stroke-width="3" opacity=".35"/>
    <rect x="-310" y="-22" width="60" height="44" fill="#BC3229" stroke="#1E2226" stroke-width="6"/>
    <rect x="-262" y="-22" width="24" height="44" fill="#C9CED2" stroke="#1E2226" stroke-width="6"/>
    <path d="M130 -22 L210 0 L130 22 Z" fill="#E9C9A0" stroke="#1E2226" stroke-width="6" stroke-linejoin="round"/>
    <path d="M182 -8 L210 0 L182 8 Z" fill="#1E2226"/>
  </g>
</svg>
