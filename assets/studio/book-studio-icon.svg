<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Book Studio">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223F"/>
      <stop offset="1" stop-color="#0B0F1E"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3DE6FF"/>
      <stop offset="1" stop-color="#3D6BFF"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B5BFF"/>
      <stop offset="1" stop-color="#FF3D8B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#3D6BFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3D6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- an open book: two pages drawn as bold strokes -->
  <path d="M60 40 C 50 31, 36 30, 26 33 L 26 84 C 36 81, 50 83, 60 91" fill="none" stroke="url(#l)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 40 C 70 31, 84 30, 94 33 L 94 84 C 84 81, 70 83, 60 91 Z" fill="none" stroke="url(#r)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60" cy="40" r="6" fill="#FFD23D"/>
</svg>
