<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Card Maker Studio">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1A3D"/>
      <stop offset="1" stop-color="#0C0A1A"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3DE6FF"/>
      <stop offset="1" stop-color="#3D6BFF"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B5BFF"/>
      <stop offset="1" stop-color="#FF3D8B"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD23D"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#9B5BFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9B5BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- a folded card, standing open (front panel in the studios' blue, inside panel in their purple-pink), with a heart -->
  <path d="M60 30 L 30 38 L 30 90 L 60 84" fill="none" stroke="url(#l)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 30 L 90 38 L 90 90 L 60 84 Z" fill="none" stroke="url(#r)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M75 72 C 63 63, 63 52, 70 50 C 73 49, 75 51, 75 54 C 75 51, 77 49, 80 50 C 87 52, 87 63, 75 72 Z" fill="url(#h)"/>
</svg>
