<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Creative Space Studio">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1A3D"/>
      <stop offset="1" stop-color="#0C0A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#FFD23D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFD23D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- five strokes, one for each space (art, books, cards, sound, motion), growing out of one bright center -->
  <g stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M60 45 L60 23" stroke="#3DE6FF"/>
    <path d="M74.3 55.4 L95.2 48.6" stroke="#3D6BFF"/>
    <path d="M68.8 72.1 L81.8 89.9" stroke="#9B5BFF"/>
    <path d="M51.2 72.1 L38.2 89.9" stroke="#FF3D8B"/>
    <path d="M45.7 55.4 L24.8 48.6" stroke="#FF8A3D"/>
  </g>
  <circle cx="60" cy="60" r="8.5" fill="#FFD23D"/>
</svg>
