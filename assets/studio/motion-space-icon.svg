<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Motion Space">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1A3D"/>
      <stop offset="1" stop-color="#0C0A1A"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3DE6FF"/>
      <stop offset="1" stop-color="#3D6BFF"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset=".55" stop-color="#FF3D8B"/>
      <stop offset="1" stop-color="#9B5BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#9B5BFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9B5BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- a bouncing ball, frame by frame: fading copies along its path, then the ball itself -->
  <path d="M22 88 C 34 40, 52 40, 62 74" fill="none" stroke="url(#t)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>
  <circle cx="26" cy="72" r="7" fill="url(#t)" opacity=".35"/>
  <circle cx="38" cy="50" r="8" fill="url(#t)" opacity=".55"/>
  <circle cx="54" cy="48" r="9" fill="url(#t)" opacity=".8"/>
  <circle cx="76" cy="76" r="16" fill="url(#b)"/>
  <path d="M60 96 L 92 96" stroke="#FFD23D" stroke-width="6" stroke-linecap="round"/>
</svg>
