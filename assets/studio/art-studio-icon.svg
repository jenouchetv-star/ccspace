<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Art Studio">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211A3D"/>
      <stop offset="1" stop-color="#0E0B1A"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset=".5" stop-color="#FF3D8B"/>
      <stop offset="1" stop-color="#9B5BFF"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DE6FF"/>
      <stop offset="1" stop-color="#3D6BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#7B4DFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7B4DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- A: two strokes meeting in a peak, like a brush lifted at the top -->
  <path d="M24 92 L47 30 L70 92" fill="none" stroke="url(#a)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- S: a ribbon that crosses the A where its bar would be -->
  <path d="M97 40 C 95 28, 69 27, 68 43 C 67 58, 97 56, 96 75 C 95 94, 64 94, 57 82" fill="none" stroke="url(#s)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="94" cy="96" r="6.5" fill="#FFD23D"/>
</svg>
