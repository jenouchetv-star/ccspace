<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sound Space">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1A3D"/>
      <stop offset="1" stop-color="#0C0A1A"/>
    </linearGradient>
    <linearGradient id="w" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="96" y2="0">
      <stop offset="0" stop-color="#3DE6FF"/>
      <stop offset=".45" stop-color="#3D6BFF"/>
      <stop offset=".75" stop-color="#9B5BFF"/>
      <stop offset="1" stop-color="#FF3D8B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#3D6BFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3D6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- a sound wave: bars of different heights -->
  <g stroke="url(#w)" stroke-width="10" stroke-linecap="round">
    <path d="M27 54 L27 66"/>
    <path d="M43 40 L43 80"/>
    <path d="M59 28 L59 92"/>
    <path d="M75 44 L75 76"/>
    <path d="M91 52 L91 68"/>
  </g>
  <circle cx="91" cy="34" r="6.5" fill="#FFD23D"/>
</svg>
