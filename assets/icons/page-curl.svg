<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 592">
  <!-- The turned-back corner of a page, for the top right corner of a book card (.card__curl). Its straight edge
       is the fold, from (90,0) on the top edge to (572,592) on the right edge; the card cuts its picture away
       beyond that line, so the flap reads as the page's own corner folded over. -->
  <defs>
    <linearGradient id="curl" gradientUnits="userSpaceOnUse" x1="330" y1="295" x2="120" y2="466">
      <stop offset="0" stop-color="#C9CBCC"/>
      <stop offset=".14" stop-color="#E2E3E4"/>
      <stop offset=".55" stop-color="#F4F4F4"/>
      <stop offset="1" stop-color="#E6E7E8"/>
    </linearGradient>
  </defs>
  <path d="M90 0C104 118 66 262 0 375C232 410 432 482 572 592Z" fill="url(#curl)"/>
</svg>
