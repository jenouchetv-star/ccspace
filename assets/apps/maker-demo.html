<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maker Program demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maker Program demo, version 3. One clickable simulation of the program for school and library partners.
   Content source: the owner's program overview (2026-11-26). Every person, place and number is fictional sample data.

   Design plan
   - Tokens: ink #1E2226, paper #FAF4E6 (public), canvas #F2F3F1 (portal), surface #FFF, line #E2E4E1, line-strong #CDD1CC,
     slate #56616A, blue #1273B0 (actions, links, current nav), blue-soft #E3EEF6, sun #F2C230 (kid-facing and the
     today marker only), sun-soft #FBF1D2, leaf #2F6B2C (done), leaf-soft #E4F0E2, clay #B4532A (errors only).
   - Type: Plus Jakarta Sans. Display 40/44 800 (public heroes), page title 28/34 800, section 19/26 700, body 16/26 500,
     small 14/20 500 slate, tabular numbers. Sentence case everywhere.
   - Three registers. Public pages: paper, the site header with highlighter links, editorial left-aligned layout, tables
     on the paper with hairlines, pill buttons. Partner portal: ink rail, canvas, page head (title, one line, actions),
     whitespace and hairlines first, a white panel only around one real unit (a table, a form step, a list), never a
     panel in a panel. Kid-facing (.kid-* only): the video stage, pause cards, clips and the family showcase keep the
     .com brand: ink borders, hard shadows, sun chips, halftone sky.
   - Home: headline and lead on the left, the classroom photo on the right; below, the two formats as a table, the
     learning cycle as one line of five words, the host roles as a table.
   - Partner home: the 5 partnership steps on one hairline (done in leaf, now marked with the sun dot), this year's plan
     as a table beside today's session, then facilitators and kit shipments as tables.
   - Run the session: "On the screen for the kids" over the branded stage, the player bar and the 6 numbered chapters;
     the facilitator guide panel on the right.
   - Checked against the anti-slop list: no caps, no eyebrow labels, no middle-dot chains, no code-style labels, no arrows on
     buttons, no emoji, no em dashes, no decorative gradients (the halftone lives on kid surfaces only), tables for
     tabular content, numbered markers only for real sequences, motion only in answer to actions plus the slow zoom. */
:root{
  --ink:#1E2226; --paper:#FAF4E6; --canvas:#F2F3F1; --surface:#FFFFFF; --line:#E2E4E1; --line-strong:#CDD1CC;
  --slate:#56616A; --blue:#1273B0; --blue-deep:#0D5A8C; --blue-soft:#E3EEF6; --sun:#F2C230; --sun-soft:#FBF1D2;
  --leaf:#2F6B2C; --leaf-soft:#E4F0E2; --clay:#B4532A; --hl-now:#8FE3F0;
  --halftone:radial-gradient(rgba(30,34,38,.08) 1px, transparent 1.3px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink); background:var(--paper); font-size:16px; line-height:26px; font-weight:500; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
button:disabled{ cursor:not-allowed; opacity:.5; }
h1,h2,h3,h4,p,figure,blockquote{ margin:0; }
ul,ol{ margin:0; }
a{ color:var(--blue); font-weight:600; text-underline-offset:3px; }
img{ display:block; max-width:100%; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
h1:focus, h2:focus, main:focus{ outline:none; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
body[data-shell="app"]{ background:var(--canvas); }
.skip{ position:absolute; left:-9999px; top:8px; z-index:200; background:#fff; border:2px solid var(--ink); border-radius:10px; padding:8px 14px; font-weight:700; color:var(--ink); }
.skip:focus{ left:12px; }
.num{ font-variant-numeric:tabular-nums; }
.fade{ animation:fade .32s var(--ease) both; }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

/* type scale */
.t-display{ font-size:40px; line-height:44px; font-weight:800; letter-spacing:-.02em; }
.t-title{ font-size:28px; line-height:34px; font-weight:800; letter-spacing:-.015em; }
.t-section{ font-size:19px; line-height:26px; font-weight:700; }
.t-small, .small{ font-size:14px; line-height:20px; font-weight:500; color:var(--slate); }
.lead{ font-size:18px; line-height:29px; color:#353C42; max-width:60ch; }
.prose{ max-width:70ch; }
.prose p + p{ margin-top:12px; }
.list{ padding-left:20px; max-width:70ch; }
.list li + li{ margin-top:6px; }

/* ---------- presenter bar (not part of the product) ---------- */
.jbar{ position:sticky; top:0; z-index:50; background:var(--ink); color:#fff; padding:10px 20px; font-size:14px; line-height:20px; }
.jbar :focus-visible{ outline-color:var(--sun); }
.jrow{ display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; }
.jname{ font-weight:700; color:#fff; white-space:nowrap; }
.jstages{ display:flex; gap:2px; flex-wrap:wrap; flex:1; }
.jstage{ border:0; background:none; color:#AEB6BC; border-radius:8px; padding:6px 10px; font-weight:600; display:inline-flex; align-items:center; gap:8px; min-height:36px; }
.jstage i{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:12px; font-weight:700; border:1px solid #5B646B; }
.jstage:hover{ color:#fff; }
.jstage.is-done i{ background:#3F7F3B; border-color:#3F7F3B; color:#fff; }
.jstage[aria-current="step"]{ background:#fff; color:var(--ink); }
.jstage[aria-current="step"] i{ border-color:var(--ink); }
.jnav{ display:flex; align-items:center; gap:8px; }
.jnav span{ color:#D2D8DC; font-weight:600; white-space:nowrap; }
.jbtn{ border:1px solid #5B646B; background:none; color:#fff; border-radius:10px; padding:6px 12px; min-height:36px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.jbtn:hover{ border-color:#fff; }
.jbtn svg{ width:16px; height:16px; }
.jbtn--hi{ background:#fff; border-color:#fff; color:var(--ink); }
.jtools{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 18px; margin-top:8px; padding-top:8px; border-top:1px solid #343B41; }
.jtool{ display:inline-flex; align-items:center; gap:8px; color:#AEB6BC; font-weight:600; }
.jtools__sp{ flex:1; }
.jnote{ color:#AEB6BC; }

/* the site's styleguide segmented control: paper track, 3px padding, ink pill when chosen */
.seg{ display:inline-flex; flex-wrap:wrap; border:2px solid var(--ink); border-radius:999px; padding:3px; background:var(--paper); gap:3px; }
.seg__opt{ font-family:inherit; font-weight:700; font-size:14px; line-height:20px; border:0; border-radius:999px; padding:6px 16px; background:transparent; color:var(--ink); cursor:pointer; }
.seg__opt.is-on{ background:var(--ink); color:var(--paper); }
.seg__opt:focus-visible{ outline:3px solid var(--blue); outline-offset:1px; }
.jbar .seg{ border-color:var(--paper); }
.jbar .seg__opt{ padding:4px 12px; }
.jbar .seg__opt:focus-visible{ outline-color:var(--sun); }
.portal .seg{ border:1px solid var(--line-strong); }

/* ---------- public pages ---------- */
.site{ background:#fff; border-bottom:2px solid var(--ink); }
.site__in{ max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:24px; height:76px; padding:0 24px; }
.site__logo{ display:block; height:76px; padding:8px 0; flex:none; }
.site__logo img{ height:100%; width:auto; }
.site__links{ display:flex; gap:14px; margin-left:8px; }
.site__cta{ margin-left:auto; }
/* the site's highlighter stroke (index.html .nav__link): yellow on hover, blue on the current page */
.hl{ --hl:var(--sun); padding:6px .14em; text-decoration:none; color:var(--ink); font-weight:800; font-size:16px; border:0; cursor:pointer; white-space:nowrap;
  background:linear-gradient(180deg,transparent 40%,var(--hl) 40%,var(--hl) 96%,transparent 96%) 0 50% / 0% 1.3em no-repeat; transition:background-size .28s var(--ease); }
.hl:hover{ background-size:100% 1.3em; }
.hl[aria-current="page"]{ --hl:var(--hl-now); background-size:100% 1.3em; }
.pub{ max-width:1180px; margin:0 auto; padding:56px 24px 88px; }
.pub-foot{ border-top:1px solid var(--line-strong); }
.pub-foot p{ max-width:1180px; margin:0 auto; padding:24px; }
.pbtn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:999px; padding:9px 20px; font-size:16px; font-weight:700; text-decoration:none; box-shadow:2px 2px 0 var(--ink); transition:transform .16s var(--ease), box-shadow .16s var(--ease); }
@media (hover:hover){ .pbtn:not(:disabled):hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); } }
.pbtn--go{ background:var(--blue); color:#fff; }
.pbtn--sm{ min-height:38px; padding:5px 14px; font-size:14px; }
.pbtn svg{ width:18px; height:18px; }
.row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.hero{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.08fr); gap:56px; align-items:center; }
.hero h1{ max-width:15ch; }
.hero .lead{ margin-top:20px; }
.hero .row{ margin-top:28px; }
.hero__photo{ width:100%; aspect-ratio:1600/905; object-fit:cover; border-radius:16px; border:2px solid var(--ink); }
.hero figcaption{ margin-top:10px; }
.block{ margin-top:72px; padding-top:40px; border-top:1px solid var(--line-strong); }
.block__head{ display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:24px 48px; }
.block__head > p{ max-width:62ch; }
.block__body{ margin-top:28px; }
.ph{ margin-bottom:40px; }
.ph .lead{ margin-top:14px; }
.cols{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:40px 56px; }
.cols--3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.cols h3{ font-size:16px; line-height:26px; font-weight:700; }
.cols p{ margin-top:4px; color:#353C42; }
.cycle{ display:flex; flex-wrap:wrap; gap:6px 0; font-size:24px; line-height:34px; font-weight:800; letter-spacing:-.01em; }
.cycle span + span::before{ content:","; margin-right:.35em; color:var(--slate); }
.cycle span:last-child::after{ content:"."; color:var(--slate); }
.facts{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; }
.facts b{ display:block; font-size:28px; line-height:34px; font-weight:800; letter-spacing:-.015em; font-variant-numeric:tabular-nums; }
.facts span{ display:block; margin-top:4px; font-size:14px; line-height:20px; color:var(--slate); }
.hosts{ display:flex; gap:4px; align-items:flex-end; overflow:hidden; }
.hosts figure{ flex:1; min-width:0; text-align:center; }
.hosts img{ height:190px; width:auto; margin:0 auto; }
.hosts figcaption{ font-size:14px; line-height:20px; font-weight:700; margin-top:6px; }
.hosts figcaption span{ display:block; color:var(--slate); font-weight:500; }
.pricebig{ font-size:28px; line-height:34px; font-weight:800; letter-spacing:-.015em; font-variant-numeric:tabular-nums; }
.proposed{ display:inline-block; font-size:14px; line-height:20px; font-weight:600; color:var(--slate); border:1px solid var(--line-strong); border-radius:999px; padding:2px 10px; background:#fff; vertical-align:middle; }

/* tables: lists of things, on the paper (public) or inside one panel (portal) */
.tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tbl{ width:100%; border-collapse:collapse; font-size:15px; line-height:23px; }
.tbl caption{ text-align:left; }
.tbl th{ text-align:left; font-size:14px; line-height:20px; font-weight:600; color:var(--slate); padding:10px 16px 10px 0; border-bottom:1px solid var(--ink); vertical-align:bottom; }
.tbl td{ padding:14px 16px 14px 0; border-bottom:1px solid var(--line-strong); vertical-align:top; }
.tbl th:last-child, .tbl td:last-child{ padding-right:0; }
.tbl tbody th{ color:var(--ink); font-size:15px; line-height:23px; font-weight:700; border-bottom:1px solid var(--line-strong); vertical-align:top; padding-top:14px; }
.tbl td.r, .tbl th.r{ text-align:right; }
.tbl .nowrap{ white-space:nowrap; }
.tbl tr.is-hi td, .tbl tr.is-hi th{ background:rgba(18,115,176,.06); }
.portal .tbl th{ border-bottom-color:var(--line-strong); }
.portal .tbl td, .portal .tbl tbody th{ border-bottom-color:var(--line); }
.portal .tbl tr:last-child td, .portal .tbl tr:last-child th{ border-bottom:0; }
.panel .tbl th:first-child, .panel .tbl td:first-child{ padding-left:24px; }
.panel .tbl th:last-child, .panel .tbl td:last-child{ padding-right:24px; }
.tlink{ border:0; background:none; padding:0; color:var(--blue); font-weight:700; text-align:left; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
.tlink:hover{ text-decoration-thickness:2px; }

/* status words: a dot and a word, no pills */
.st{ display:inline-flex; align-items:center; gap:7px; font-size:14px; line-height:20px; font-weight:600; white-space:nowrap; }
.st::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--c,var(--line-strong)); flex:none; }
.st--done{ --c:var(--leaf); color:var(--leaf); }
.st--now{ --c:var(--sun); box-shadow:none; }
.st--now::before{ box-shadow:0 0 0 1.5px var(--ink); }
.st--next{ --c:var(--blue); }
.st--wait{ --c:var(--line-strong); color:var(--slate); }
.st--risk{ --c:var(--clay); color:var(--clay); }
.tag{ display:inline-block; font-size:13px; line-height:18px; font-weight:600; color:var(--blue-deep); background:var(--blue-soft); border-radius:6px; padding:2px 8px; white-space:nowrap; }
.sample{ display:inline-block; font-size:13px; line-height:18px; font-weight:600; color:var(--slate); border:1px dashed var(--line-strong); border-radius:6px; padding:1px 8px; white-space:nowrap; vertical-align:middle; }

/* numbered sequences (session steps, partnership steps, setup steps) */
.seq{ list-style:none; padding:0; counter-reset:seq; }
.seq > li{ counter-increment:seq; position:relative; padding:0 0 22px 52px; }
.seq > li::before{ content:counter(seq); position:absolute; left:0; top:0; width:32px; height:32px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; font-weight:700; font-size:14px; background:#fff; }
.seq > li::after{ content:""; position:absolute; left:16px; top:36px; bottom:4px; width:1px; background:var(--line-strong); }
.seq > li:last-child::after{ display:none; }
.seq h3{ font-size:16px; line-height:26px; font-weight:700; padding-top:3px; }
.seq h3 .small{ font-weight:600; margin-left:8px; }
.seq p{ margin-top:2px; color:#353C42; max-width:64ch; }

/* the partnership timeline (portal): one hairline, steps along it */
.tline{ list-style:none; padding:0; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px; position:relative; }
.tline::before{ content:""; position:absolute; left:14px; right:14px; top:14px; height:1px; background:var(--line-strong); }
.tline li{ position:relative; }
.tline i{ position:relative; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:13px; font-weight:700; background:#fff; border:1.5px solid var(--line-strong); color:var(--slate); }
.tline i svg{ width:14px; height:14px; }
.tline .is-done i{ background:var(--leaf); border-color:var(--leaf); color:#fff; }
.tline .is-now i{ background:var(--sun); border-color:var(--ink); color:var(--ink); }
.tline b{ display:block; margin-top:10px; font-size:15px; line-height:22px; font-weight:700; }
.tline span{ display:block; font-size:14px; line-height:20px; color:var(--slate); }

/* ---------- partner portal ---------- */
.portal{ display:grid; grid-template-columns:248px minmax(0,1fr); min-height:calc(100vh - var(--jbar-h,96px)); background:var(--canvas); }
.rail{ background:var(--ink); color:#fff; }
.rail__in{ display:flex; flex-direction:column; position:sticky; top:var(--jbar-h,96px); height:calc(100vh - var(--jbar-h,96px)); overflow-y:auto; }
.rail__logo{ display:block; padding:18px 20px 10px; }
.rail__logo img{ height:64px; width:auto; }
.rail__org{ padding:6px 20px 14px; font-size:14px; line-height:20px; color:#AEB6BC; border-bottom:1px solid #343B41; }
.rail__org b{ display:block; color:#fff; font-size:15px; font-weight:700; }
.rail__nav{ padding:12px; display:flex; flex-direction:column; gap:2px; }
.rail__nav button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 12px; border-radius:8px; border:0; background:none; font-weight:600; font-size:15px; line-height:22px; color:#C9D0D5; }
.rail__nav button:hover{ background:rgba(255,255,255,.07); color:#fff; }
.rail__nav button[aria-current="page"]{ background:var(--blue); color:#fff; }
.rail__nav button:focus-visible, .rail__logo:focus-visible{ outline:2px solid #fff; outline-offset:-2px; }
.rail__sub{ padding:14px 12px 4px; font-size:13px; line-height:18px; color:#8B949B; font-weight:600; }
.rail__user{ margin-top:auto; padding:16px 20px; border-top:1px solid #343B41; display:flex; align-items:center; gap:10px; font-size:14px; line-height:20px; color:#AEB6BC; }
.rail__user b{ display:block; color:#fff; font-weight:700; }
.av{ width:36px; height:36px; border-radius:50%; background:#363E45; color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
.pmain{ padding:36px clamp(16px,3.2vw,48px) 72px; min-width:0; }
.pmain__in{ max-width:1180px; }
.phead{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 24px; margin-bottom:36px; }
.phead p{ margin-top:6px; color:var(--slate); max-width:70ch; }
.pact{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px; border:1px solid var(--line-strong); background:#fff; color:var(--ink); border-radius:10px; padding:8px 16px; font-size:15px; line-height:22px; font-weight:600; text-decoration:none; white-space:nowrap; transition:background .14s, border-color .14s; }
.btn:hover:not(:disabled){ border-color:var(--ink); }
.btn--go{ background:var(--blue); border-color:var(--blue); color:#fff; }
.btn--go:hover:not(:disabled){ background:var(--blue-deep); border-color:var(--blue-deep); }
.btn--quiet{ border-color:transparent; background:none; color:var(--blue); padding-left:8px; padding-right:8px; }
.btn--quiet:hover:not(:disabled){ border-color:transparent; text-decoration:underline; text-underline-offset:3px; }
.btn--sm{ min-height:36px; padding:5px 12px; font-size:14px; }
.btn svg{ width:18px; height:18px; flex:none; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:24px; min-width:0; }
.panel--flush{ padding:0; overflow:hidden; }
.panel--flush > .panel__head{ padding:20px 24px 12px; }
.panel__head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px; margin-bottom:16px; }
.panel--flush > .panel__head{ margin-bottom:0; }
.panel__foot{ padding:14px 24px; border-top:1px solid var(--line); }
.sec + .sec{ margin-top:44px; }
.pmain__in > :not(.phead):not(.filters) + *{ margin-top:44px; }
.sec__head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px; margin-bottom:16px; }
.sec__head p{ width:100%; margin-top:-8px; }
.grid2{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr); gap:32px; align-items:start; }
.grid2--even{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.split{ display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,380px); gap:32px; align-items:start; }
.kv{ display:grid; grid-template-columns:max-content minmax(0,1fr); gap:8px 20px; font-size:15px; line-height:23px; }
.kv dt{ color:var(--slate); font-weight:500; }
.kv dd{ margin:0; font-weight:600; }
.stack > * + *{ margin-top:16px; }
.divide > * + *{ margin-top:20px; padding-top:20px; border-top:1px solid var(--line); }
.ok-note{ display:flex; gap:10px; align-items:flex-start; padding:12px 16px; border-radius:10px; background:var(--leaf-soft); color:#22501F; font-weight:600; font-size:15px; line-height:23px; }
.ok-note svg{ width:18px; height:18px; flex:none; margin-top:2px; }
.info-note{ padding:12px 16px; border-radius:10px; background:var(--blue-soft); color:#174E73; font-size:15px; line-height:23px; }
.err{ color:var(--clay); font-size:14px; line-height:20px; font-weight:600; }
.today{ display:grid; grid-template-columns:200px minmax(0,1fr); gap:20px; align-items:start; }
.today img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; }
.today h3{ font-size:19px; line-height:26px; font-weight:700; }
.mbar{ display:flex; align-items:center; gap:10px; font-size:14px; line-height:20px; color:var(--slate); }
.mbar i{ flex:1; height:6px; border-radius:999px; background:var(--line); overflow:hidden; display:block; }
.mbar i b{ display:block; height:100%; background:var(--blue); }

/* year plan: one simple timeline, September to May */
.gantt{ --lw:220px; position:relative; display:grid; grid-template-columns:var(--lw) minmax(0,1fr); align-items:center; row-gap:12px; font-size:14px; line-height:20px; }
.gantt__months{ display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); color:var(--slate); font-weight:600; }
.gantt__months span{ border-left:1px solid var(--line-strong); padding-left:6px; }
.gantt .lbl{ font-weight:700; padding-right:12px; }
.gantt .lbl span{ display:block; font-weight:500; color:var(--slate); }
.gantt__track{ position:relative; height:30px; background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100% / 9)); }
.gantt__track .bar{ position:absolute; top:3px; bottom:3px; border-radius:6px; background:var(--blue-soft); border:1px solid #B9D3E6; }
.gantt__track .bar.is-done{ background:var(--leaf-soft); border-color:#BFD8BB; }
.gantt__track .bar.is-now{ background:var(--blue); border-color:var(--blue); }
.gantt__track .bar.is-open{ background:#fff; border-style:dashed; border-color:var(--line-strong); }
.gantt__foot{ background:none; height:26px; }
.gantt__today{ position:absolute; top:2px; transform:translateX(-50%); white-space:nowrap; background:var(--sun); border:1.5px solid var(--ink); border-radius:999px; padding:0 8px; font-size:13px; font-weight:700; }
.gantt__line{ position:absolute; top:24px; bottom:26px; width:2px; background:var(--ink); left:calc(var(--lw) + (100% - var(--lw)) * var(--t)); pointer-events:none; }
.gantt-key{ display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:16px; font-size:14px; line-height:20px; color:var(--slate); }
.gantt-key i{ display:inline-block; width:14px; height:10px; border-radius:3px; margin-right:6px; vertical-align:0; border:1px solid; }

/* the plan offers: comparable, so cards here, kept quiet */
.plans{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; align-items:stretch; }
.plan{ background:#fff; border:1px solid var(--line-strong); border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:6px; }
.plan__top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; min-height:30px; margin-bottom:6px; }
.plan .pricebig{ margin-top:6px; }
.plan__inc{ flex:1; margin:10px 0 18px; color:#353C42; }
.plan .pbtn{ align-self:flex-start; }
.plans__foot{ margin-top:28px; padding-top:20px; border-top:1px solid var(--line-strong); max-width:820px; }
.plans__foot p + p{ margin-top:6px; }

/* forms */
.form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 24px; }
.form .wide{ grid-column:1/-1; }
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; border:0; padding:0; margin:0; }
.field > label, .field > legend, .field .lbl{ font-size:15px; line-height:22px; font-weight:600; padding:0; }
.field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea{ border:1px solid var(--line-strong); border-radius:10px; padding:9px 12px; background:#fff; font-size:16px; min-height:44px; width:100%; }
.field textarea{ min-height:96px; resize:vertical; line-height:24px; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue); }
.field [aria-invalid="true"]{ border-color:var(--clay) !important; }
.field small{ font-size:14px; line-height:20px; color:var(--slate); }
.pub .field input:not([type=checkbox]):not([type=radio]), .pub .field select{ border-color:var(--ink); }
.check{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; font-size:15px; line-height:23px; }
.check + .check{ margin-top:14px; }
.check input{ width:20px; height:20px; margin:2px 0 0; accent-color:var(--blue); flex:none; }
.check span{ max-width:70ch; }
.choice{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border:1px solid var(--line-strong); border-radius:10px; background:#fff; cursor:pointer; }
.choice + .choice{ margin-top:10px; }
.choice.is-on{ border-color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); }
.choice input{ margin-top:4px; accent-color:var(--blue); width:18px; height:18px; flex:none; }
.choice b{ display:block; }
.stepper{ display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:10px; background:#fff; }
.pub .stepper{ border-color:var(--ink); }
.stepper button{ width:42px; height:42px; border:0; background:none; display:grid; place-items:center; color:var(--ink); }
.stepper button svg{ width:16px; height:16px; }
.stepper output{ min-width:3ch; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
.sum{ list-style:none; padding:0; }
.sum li{ display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
.sum li:first-child{ border-top:0; }
.sum li span:last-child{ white-space:nowrap; font-weight:600; }
.sum li.is-disc{ color:var(--leaf); }
.sum li.is-total{ border-top:1px solid var(--ink); font-weight:800; font-size:18px; line-height:28px; }
.sum li.is-total span:last-child{ font-weight:800; }
.wiz{ list-style:none; padding:0; display:flex; flex-wrap:wrap; gap:6px 8px; margin-bottom:24px; }
.wiz button{ display:inline-flex; align-items:center; gap:8px; border:0; background:none; padding:6px 10px 6px 6px; border-radius:8px; font-size:15px; font-weight:600; color:var(--slate); }
.wiz button:hover:not(:disabled){ background:#fff; }
.wiz button:disabled{ cursor:default; opacity:1; }
.wiz i{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:13px; font-weight:700; border:1.5px solid var(--line-strong); background:#fff; color:var(--slate); flex:none; }
.wiz i svg{ width:14px; height:14px; }
.wiz .is-now button{ color:var(--ink); }
.wiz .is-now i{ background:var(--blue); border-color:var(--blue); color:#fff; }
.wiz .is-done i{ background:var(--leaf); border-color:var(--leaf); color:#fff; }
.wiz__foot{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }
.wiz__foot .small{ margin:0 auto; }
.fsec + .fsec{ margin-top:28px; padding-top:24px; border-top:1px solid var(--line); }
.fsec > h3{ font-size:16px; line-height:24px; font-weight:700; }
.fsec > p{ margin:2px 0 18px; }
.sign{ font-family:inherit; font-style:italic; font-size:22px !important; font-weight:600; }

/* room diagram */
.room{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; font-size:14px; line-height:20px; }
.room div{ border:1px solid var(--line-strong); border-radius:8px; padding:10px 8px; text-align:center; font-weight:600; background:#fff; }
.room div small{ display:block; font-weight:500; color:var(--slate); }
.room .front{ grid-column:1/-1; background:var(--ink); color:#fff; border-color:var(--ink); }
.room .front small{ color:#C9D0D5; }
.room .mat{ background:var(--canvas); }

/* portfolio and photo wall (adult view of kids' projects) */
.wgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:20px; }
.wcard{ position:relative; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; padding:0; display:block; width:100%; color:var(--ink); }
.wcard__ph{ aspect-ratio:4/3; overflow:hidden; border-bottom:1px solid var(--line); background:var(--canvas); }
.wcard__ph svg{ width:100%; height:100%; display:block; }
.wcard__body{ padding:12px 14px 14px; }
.wcard h3{ font-size:15px; line-height:22px; font-weight:700; }
.wcard blockquote{ margin-top:6px; font-size:14px; line-height:21px; color:#353C42; }
button.wcard{ cursor:pointer; display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; }
#linkBox:focus, #takeHome:focus{ outline:none; }
button.wcard:hover{ border-color:var(--line-strong); }
.wcard .pick{ position:absolute; top:10px; left:10px; width:24px; height:24px; border-radius:6px; border:1.5px solid var(--line-strong); background:#fff; display:grid; place-items:center; }
.wcard.is-on{ border-color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); }
.wcard.is-on .pick{ background:var(--blue); border-color:var(--blue); }
.wcard.is-on .pick::after{ content:""; width:5px; height:10px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:translateY(-1px) rotate(45deg); }
.wcard .is-new{ position:absolute; top:10px; right:10px; }
.wweek + .wweek{ margin-top:40px; }
.wweek > h2{ margin-bottom:14px; }

/* drawers (adult) */
.backdrop{ position:fixed; inset:0; z-index:80; background:rgba(30,34,38,.4); animation:fade .25s var(--ease) both; }
.drawer{ position:fixed; z-index:81; top:0; right:0; bottom:0; width:min(480px,100%); background:#fff; display:flex; flex-direction:column; animation:fade .25s var(--ease) both; box-shadow:-1px 0 0 var(--line); }
.drawer__head{ padding:20px 24px 16px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.drawer__head h2{ font-size:19px; line-height:26px; font-weight:700; }
.drawer__head p{ margin-top:2px; }
.drawer__body{ padding:20px 24px; overflow:auto; flex:1; }
.drawer__foot{ padding:14px 24px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; }
.iconbtn{ width:40px; height:40px; border-radius:10px; border:1px solid var(--line-strong); background:#fff; display:grid; place-items:center; flex:none; padding:0; color:var(--ink); }
.iconbtn svg{ width:18px; height:18px; }
.team + .team{ margin-top:18px; }
.team h3{ font-size:14px; line-height:20px; font-weight:700; margin-bottom:8px; }
.kids{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.kid{ display:flex; align-items:center; gap:10px; border:1px solid var(--line-strong); background:#fff; border-radius:8px; padding:8px 10px; min-height:42px; font-size:15px; font-weight:600; text-align:left; color:var(--ink); }
.kid i{ width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line-strong); flex:none; display:grid; place-items:center; }
.kid[aria-pressed="true"]{ border-color:var(--leaf); background:var(--leaf-soft); }
.kid[aria-pressed="true"] i{ background:var(--leaf); border-color:var(--leaf); }
.band{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.band output{ min-width:3ch; text-align:center; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
.viewfinder{ position:relative; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:#2A3138; }
.viewfinder svg.shot{ position:absolute; inset:0; width:100%; height:100%; }
.viewfinder .corners{ position:absolute; inset:14px; border:2px dashed rgba(255,255,255,.7); border-radius:10px; pointer-events:none; }
.viewfinder .hint{ position:absolute; left:50%; top:14px; transform:translateX(-50%); background:rgba(30,34,38,.85); color:#fff; border-radius:999px; padding:3px 12px; font-size:13px; line-height:20px; font-weight:600; white-space:nowrap; }
.flash{ position:absolute; inset:0; background:#fff; animation:flash .45s var(--ease) both; pointer-events:none; }
@keyframes flash{ from{ opacity:.9; } to{ opacity:0; } }

/* tour and toast (presenter tools, adult) */
.tour-spot{ position:fixed; z-index:60; border-radius:12px; pointer-events:none; box-shadow:0 0 0 3px var(--blue), 0 0 0 9999px rgba(30,34,38,.45); }
.tour-tip{ position:fixed; z-index:90; width:min(400px, calc(100vw - 32px)); background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px -12px rgba(30,34,38,.4); padding:18px 20px; }
.tour-tip__step{ font-size:14px; line-height:20px; color:var(--slate); font-weight:600; }
.tour-tip h2{ font-size:19px; line-height:26px; font-weight:700; margin-top:2px; }
.tour-tip__body{ margin-top:8px; font-size:15px; line-height:24px; }
.tour-tip__act{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.tour-tip__nav{ display:flex; justify-content:space-between; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.tour-tip__tools{ display:flex; flex-wrap:wrap; gap:2px 4px; margin-top:8px; }
.tour-tip__tools button{ min-height:36px; border:0; background:none; font-size:14px; font-weight:600; color:var(--blue); padding:0 6px; }
.tour-bar{ height:4px; border-radius:999px; background:var(--line); margin-top:12px; overflow:hidden; }
.tour-bar i{ display:block; height:100%; background:var(--blue); }
.tour-mini{ position:fixed; z-index:90; left:16px; bottom:16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px -12px rgba(30,34,38,.4); padding:10px 12px; max-width:calc(100vw - 32px); font-weight:600; font-size:15px; }
.toast{ position:fixed; z-index:95; left:50%; bottom:22px; transform:translateX(-50%); max-width:calc(100vw - 32px); background:var(--ink); color:#fff; border-radius:10px; padding:10px 16px; font-weight:600; font-size:15px; opacity:0; pointer-events:none; transition:opacity .25s var(--ease); }
.toast.on{ opacity:1; }
.pathbtn{ display:block; width:100%; text-align:left; border:1px solid var(--line-strong); border-radius:12px; background:#fff; padding:16px; }
.pathbtn + .pathbtn{ margin-top:12px; }
.pathbtn:hover{ border-color:var(--ink); }
.pathbtn b{ display:block; font-size:16px; }
.pathbtn span{ display:block; font-size:14px; line-height:20px; color:var(--slate); margin-top:2px; }

/* ---------- kid-facing: the .com brand (stage, pause cards, clips, family showcase) ---------- */
.kid-label{ display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:14px; line-height:20px; font-weight:600; color:var(--slate); }
.kid-label i{ width:8px; height:8px; border-radius:50%; background:var(--clay); }
.kid-wrap{ position:relative; container-type:inline-size; }
.kid-stage{ position:relative; aspect-ratio:16/9; border:3px solid var(--ink); border-radius:18px; overflow:hidden; box-shadow:4px 4px 0 var(--ink); color:var(--ink);
  background-color:#CFE6F4; background-image:var(--halftone), linear-gradient(180deg,#CFE6F4 0%,#E6F2F9 100%); background-size:7px 7px,100% 100%; }
.kid-stage--warm{ background-color:#FBE7C6; background-image:var(--halftone), linear-gradient(180deg,#FFF1D6 0%,#FBE3C3 100%); }
.kid-stage--leaf{ background-color:#D6EEDF; background-image:var(--halftone), linear-gradient(180deg,#E6F6EC 0%,#CFEBDB 100%); }
.kid-floor{ position:absolute; left:0; right:0; bottom:0; height:22%; background:rgba(30,34,38,.07); border-top:2px solid rgba(30,34,38,.12); }
.kid-cast{ position:absolute; left:3%; right:3%; bottom:21%; height:68%; display:flex; justify-content:center; align-items:flex-end; gap:1.5cqw; }
.kid-cast figure{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; transition:opacity .3s var(--ease); }
.kid-cast img{ height:84%; width:auto; }
.kid-cast figcaption{ margin-top:.6cqw; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:.2cqw 1.2cqw; font-size:max(11px,1.45cqw); line-height:1.3; font-weight:800; white-space:nowrap; }
.kid-cast .is-talk figcaption{ background:var(--sun); }
.kid-cast .is-quiet{ opacity:.45; }
.kid-host{ position:absolute; bottom:3%; height:86%; left:6%; }
.kid-host img{ height:100%; width:auto; }
.kid-host--b{ left:24%; }
.kid-frame{ position:absolute; left:0; top:0; bottom:0; width:56.25%; overflow:hidden; border-right:3px solid var(--ink); }
.kid-frame img{ width:100%; height:100%; object-fit:cover; transform-origin:45% 40%; animation:kenburns 20s cubic-bezier(.2,.7,.3,1) both; }
.kid-stage.is-paused .kid-frame img{ animation-play-state:paused; }
@keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.1) translate(-1.2%,-1.2%); } }
.kid-chip{ position:absolute; top:2.2cqw; left:2.2cqw; z-index:2; background:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:.35cqw 1.6cqw; font-size:max(12px,1.7cqw); line-height:1.35; font-weight:800; }
.kid-count{ position:absolute; top:2.2cqw; right:2.2cqw; z-index:2; background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:.35cqw 1.6cqw; font-size:max(12px,1.7cqw); line-height:1.35; font-weight:800; }
.kid-card{ position:absolute; right:4%; top:15%; width:46%; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:2cqw 2.4cqw; }
.kid-stage--frame .kid-card{ width:37%; right:3.2%; }
.kid-stage--frame .kid-card p{ font-size:max(13px,2.3cqw); font-weight:700; color:var(--ink); }
.kid-card h4{ font-size:max(14px,2.5cqw); line-height:1.22; font-weight:800; }
.kid-card p{ margin-top:.9cqw; font-size:max(12px,1.85cqw); line-height:1.4; font-weight:600; color:#333A3F; }
.kid-card ul{ margin-top:.9cqw; padding-left:2.2cqw; font-size:max(12px,1.75cqw); line-height:1.45; font-weight:600; }
.kid-big{ font-size:max(16px,3.4cqw) !important; line-height:1.15 !important; }
.kid-waves{ display:grid; grid-template-columns:1fr 1fr; gap:1.2cqw; margin-top:1.2cqw; }
.kid-waves div{ border:2px solid var(--line-strong); border-radius:10px; padding:.8cqw; text-align:center; font-size:max(11px,1.35cqw); line-height:1.3; font-weight:700; background:#FBFDFE; }
.kid-waves svg{ width:100%; height:4cqw; }
.kid-cap{ position:absolute; left:50%; bottom:2.4cqw; transform:translateX(-50%); width:min(90%,820px); background:rgba(30,34,38,.92); color:#fff; border-radius:12px; padding:1.1cqw 2cqw; font-size:max(13px,2.15cqw); line-height:1.35; font-weight:700; text-align:center; z-index:3; }
.kid-cap b{ color:var(--sun); }
@container (max-width:560px){ .kid-card p, .kid-card ul, .kid-waves{ display:none; } .kid-card{ top:20%; } .kid-cast figcaption{ display:none; } }
.kid-pause{ position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; padding:2cqw; border-radius:18px; overflow:auto;
  background-color:rgba(207,230,244,.96); background-image:var(--halftone); background-size:7px 7px; }
.kid-pause__in{ width:min(100%,700px); background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink); padding:14px 20px 16px; }
.kid-pause__top{ display:flex; align-items:center; gap:14px; }
.kid-pause__top img{ width:52px; height:52px; object-fit:cover; object-position:50% 4%; border-radius:50%; border:2.5px solid var(--ink); background:var(--sun-soft); flex:none; }
.kid-pause__chip{ display:inline-block; background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:2px 12px; font-weight:800; font-size:15px; line-height:22px; }
.kid-pause__say{ margin-top:4px; font-weight:700; color:var(--slate); font-size:15px; line-height:22px; }
.kid-pause__prompt{ margin-top:10px; font-size:clamp(17px,2.5cqw,24px); line-height:1.3; font-weight:800; letter-spacing:-.01em; }
.kid-steps{ display:grid; grid-template-columns:repeat(6,minmax(0,58px)); gap:6px; margin-top:10px; }
.kid-steps figure{ position:relative; }
.kid-steps img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:2px solid var(--ink); }
.kid-steps figcaption{ position:absolute; left:4px; top:4px; width:20px; height:20px; border-radius:50%; background:var(--sun); border:2px solid var(--ink); font-size:11px; font-weight:800; display:grid; place-items:center; line-height:1; }
.kid-timer{ display:flex; align-items:center; gap:14px; margin-top:10px; }
.kid-timer__num{ font-size:clamp(28px,4.2cqw,44px); line-height:1; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.kid-timer__bar{ flex:1; height:14px; border-radius:999px; background:#E4ECF1; border:2px solid var(--ink); overflow:hidden; }
.kid-timer__bar i{ display:block; height:100%; background:var(--sun); }
.kid-timeup{ margin-top:8px; font-weight:800; color:var(--clay); }
.kid-btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.kid-btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; border:2.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:999px; padding:5px 14px; font-size:14px; font-weight:800; box-shadow:2px 2px 0 var(--ink); }
.kid-btn--go{ background:var(--blue); color:#fff; }
.kid-btn svg{ width:18px; height:18px; }
@container (max-width:640px){
  .kid-pause{ position:relative; inset:auto; margin-top:14px; padding:0; background:none; overflow:visible; }
  .kid-pause__in{ width:100%; }
}
.kid-player{ display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
.kid-ibtn{ width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--line-strong); border-radius:50%; background:#fff; flex:none; padding:0; color:var(--ink); }
.kid-ibtn--play{ background:var(--blue); border-color:var(--blue); color:#fff; }
.kid-ibtn[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }

function ymd(iso) { const p = iso.split("-").map(Number); return { y: p[0], m: p[1] - 1, d: p[2], w: weekdayOf(iso) }; }
function fmtDay(iso) { const t = ymd(iso); return MON[t.m] + " " + t.d; }
function fmtShort(iso) { const t = ymd(iso); return MON[t.m].slice(0, 3) + " " + t.d; }

function fmtDateY(iso) { return fmtDate(iso) + ", " + ymd(iso).y; }

function fmtClock(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

  if (S.screen === "run" && screen !== "run") P.playing = false;
  if (screen === "run" && S.screen !== "run") { UI.key = ""; UI.ckey = ""; }
  if (UI.projector && screen !== "run") setProjector(false, true);
  stopClip();
  S.screen = screen;
  window.scrollTo(0, 0);
  render(true);
}
function setMode(m, quiet) {
  if (S.mode === m) return;
  S.mode = m; P = freshPlayer(); UI.drawer = null; stopClip(); S.order.placed = false; S.order.err = [];
  render();
  if (!quiet) toast(m === "school" ? "School: Lincoln Elementary, Maple Valley Unified" : "Library: Maple Street Library, Riverbend Library System");
}
function setProjector(on, quiet) {
  UI.projector = on;
  document.body.classList.toggle("is-projector", on);
  try {
    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().then(() => { UI.fsUsed = true; }).catch(() => {});
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (e) { /* fullscreen not allowed: the projector layout still works */ }
  if (!quiet) { const b = on ? $("#projExit") : $("#projBtn"); if (b) b.focus(); toast(on ? "Projector mode. Press Esc to exit." : "Projector mode off."); }
  if (UI.tour) tourPlace();
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && UI.projector && UI.fsUsed) { UI.fsUsed = false; setProjector(false); } });
const ROLE_HOME = { public: "home", coordinator: "phome", facilitator: "fhome", family: "family", admin: "admin" };

/* ---------- actions ---------- */
const ACT = {
  go: (el) => { if (el.dataset.step) { S.setup.step = Number(el.dataset.step); S.setup.max = Math.max(S.setup.max, S.setup.step); } go(el.dataset.go); },
  jprev: () => { const i = SCREEN_ORDER.indexOf(S.screen); if (i > 0) go(SCREEN_ORDER[i - 1]); },
  jnext: () => { const i = SCREEN_ORDER.indexOf(S.screen); if (i < SCREEN_ORDER.length - 1) go(SCREEN_ORDER[i + 1]); },
  stage: (el) => go(SCREEN_ORDER.find((id) => SCREENS[id].stage === Number(el.dataset.stage))),
  mode: (el) => setMode(el.dataset.v),
  role: (el) => { const r = el.dataset.v; if (SCREENS[S.screen].role !== r) go(ROLE_HOME[r]); },
  speed: (el) => { S.speed = Number(el.dataset.v); render(); },
  pickMode: (el) => { if (S.mode !== el.dataset.mode) setMode(el.dataset.mode, true); go(el.dataset.next); },
  demoOnly: (el) => toast(el.dataset.msg || "Simulated in this demo."),
  reset: () => resetDemo(),
  tour: () => { if (UI.tour && !UI.tour.paused) { UI.tour.paused = true; tourDraw(); } openDrawer("tourPick"); },
  tourStart: (el) => tourStart(el.dataset.path),
  tourResume: () => { UI.drawer = null; renderDrawer(); UI.tour.paused = false; tourShow(UI.tour.i); },
  tourNext: () => tourNext(), tourPrev: () => tourShow(UI.tour.i - 1), tourExit: () => tourExit(),
  tourPause: () => { UI.tour.paused = true; tourDraw(); }, tourRestart: () => tourShow(0),
  tourDo: () => { const s = TOUR[UI.tour.path][UI.tour.i]; TOUR_ACTIONS[s.action](); UI.tour.did = true; tourDraw(); },
  tier: (el) => { S.tier[S.mode] = el.dataset.v; S.order.placed = false; S.order.err = []; go("checkout"); },
  sites: (el) => { S.order.sites = Math.min(12, Math.max(1, S.order.sites + Number(el.dataset.d))); render(); },
  workshops: (el) => { S.order.workshops = Math.min(12, Math.max(1, S.order.workshops + Number(el.dataset.d))); render(); },
  kits: (el) => { S.order.kits = Math.min(12, Math.max(0, S.order.kits + Number(el.dataset.d))); render(); },
  billing: (el) => { S.order.billing = el.dataset.v; render(); },
  editOrder: () => { S.order.placed = false; render(true); },
  setupGo: (el) => { const n = Number(el.dataset.step); if (n <= S.setup.max) { S.setup.step = n; S.setup.err = []; render(); focusStep(); } },
  setupBack: () => { if (S.setup.step > 1) { S.setup.step--; S.setup.err = []; render(); focusStep(); } else go("agreement"); },
  setupNext: () => {
    const s = S.setup, miss = setupMissing(S.mode, s.step, s.v[S.mode]);
    s.err = miss;
    if (miss.length) { render(); const f = document.getElementById("sv-" + miss[0].k) || $("#teamRows input"); if (f) f.focus(); return; }
    if (s.step < 5) { s.step++; s.max = Math.max(s.max, s.step); render(); focusStep(); return; }
    s.done = true; s.err = [];
    go("phome"); toast("Setup done. The demo now jumps ahead to late November, mid-way through the first year.");
  },
  addInvite: () => { const t = S.setup.v[S.mode].team; t.push({ name: "", email: "", role: school() ? "Facilitator" : "Librarian" }); render(); const f = document.getElementById("tm" + (t.length - 1) + "n"); if (f) f.focus(); },
  rmInvite: (el) => { S.setup.v[S.mode].team.splice(Number(el.dataset.i), 1); render(); const f = $("#teamRows input"); if (f) f.focus(); },
  catFormat: (el) => { S.cat.format = el.dataset.v; render(); },
  catGrades: (el) => { S.cat.grades = el.dataset.v; render(); },
  openProgram: (el) => { S.unitId[S.mode] = el.dataset.id; go("unit"); },
  schedProgram: (el) => { const p = prog(el.dataset.id); if (p.kind === "unit") { if (!school()) setMode("school", true); S.sched.school.unit = p.id; } else { if (school()) setMode("library", true); S.sched.library.program = p.id; } S.sched[S.mode].saved = false; go("schedule"); },
  dow: (el) => { S.sched.school.dow = Number(el.dataset.v); S.sched.school.saved = false; render(); },
  saveSched: () => { S.sched[S.mode].saved = true; render(); toast(school() ? "Saved to the year plan." : "Added to the workshop calendar."); },
  openKits: () => openDrawer("kits"),
  kitReport: () => { UI.kitMsg = "Thanks. We'll ship the missing item within 2 business days (simulated)."; renderDrawer(); },
  prepView: (el) => { S.prepView = el.dataset.v; render(); },
  play: () => playerPlay(),
  nextCh: () => nextChapter(),
  captions: () => { S.captions = !S.captions; const b = $("#ccBtn"); if (b) b.setAttribute("aria-pressed", S.captions); paintPlayer(true); toast(S.captions ? "Captions on." : "Captions off."); },
  chap: (el) => { jumpTo(Number(el.dataset.ch)); paintPlayer(true); },
  projector: () => setProjector(!UI.projector),
  resume: () => { if (P.ch < LAST) jumpTo(P.ch + 1); paintPlayer(true); const pb = $("#playBtn"); if (pb) pb.focus({ preventScroll: true }); },
  timerToggle: () => { if (P.left <= 0) { P.left = P.total; P.timeUp = false; } P.timerOn = !P.timerOn; paintPlayer(true); },
  plus2: () => { P.left += 120; P.total = Math.max(P.total, P.left); P.timeUp = false; P.timerOn = true; paintPlayer(true); toast("Added 2 minutes."); },
  endSession: () => { sess().completed = true; P.done = P.done.map(() => true); P.phase = "end"; P.playing = false; if (UI.projector) setProjector(false, true); go("done"); },
  count: () => openDrawer("count"),
  capture: () => openDrawer("capture"),
  closeDrawer: () => closeDrawer(),
  att: (el) => { const a = sess().attendance; a[el.dataset.kid] = !a[el.dataset.kid]; renderDrawer(); afterCount(); },
  attAll: () => { ROSTER.forEach((k) => { sess().attendance[k.id] = true; }); renderDrawer(); afterCount(); },
  hc: (el) => { const h = sess().headcount, b = el.dataset.band; h[b] = Math.max(0, Math.min(40, h[b] + Number(el.dataset.d))); renderDrawer(); afterCount(); },
  capShot: () => { UI.cap.shot = true; renderDrawer(); const c = $("#capCaption"); if (c && !(UI.tour && !UI.tour.paused)) c.focus(); },
  capRetake: () => { UI.cap.shot = false; renderDrawer(); const b = $("#capShot"); if (b) b.focus(); },
  capSave: () => {
    const c = UI.cap;
    if (!c.release) { c.err = true; renderDrawer(); const r = $("#capRelease"); if (r) r.focus(); return; }
    const item = { id: "n" + Date.now().toString(36), mode: S.mode, art: "guitar", title: "Rubber-band guitar", caption: c.caption.trim() || (school() ? "We got three notes out of one band." : "A guitar to take home."), isNew: true };
    if (school()) { item.week = 3; item.team = c.team; } else item.event = "Rubber-Band Guitar Workshop, December 5";
    S.data.portfolio.push(item); sess().photos.push(item.id);
    const sc = showcase(); if (sc.items.indexOf(item.id) < 0) sc.items.unshift(item.id);
    UI.cap = freshCap(); renderDrawer(); const b = $("#capShot"); if (b) b.focus();
    toast(school() ? "Saved to Team " + item.team + ", week 3, and added to the showcase." : "Saved to the event photo wall and the showcase.");
    if (S.screen === "run") paintPlayer(true); else render();
  },
  portWeek: (el) => { S.port.week = el.dataset.v; render(); },
  scPick: (el) => { const a = showcase().items, k = a.indexOf(el.dataset.id); if (k < 0) a.push(el.dataset.id); else a.splice(k, 1); render(); },
  genLink: () => { generateLink(); render(); const l = $("#linkBox"); if (l) { l.setAttribute("tabindex", "-1"); l.focus(); } toast("Private link created. It expires in 30 days."); },
  clip: (el) => clipToggle(el.dataset.clip),
  fb1: (el) => { S.feedback[S.mode].q1 = el.dataset.v; render(); },
  fb2: (el) => { S.feedback[S.mode].q2 = el.dataset.v; render(); },
  sendFeedback: () => { const f = S.feedback[S.mode]; if (!f.q1 || !f.q2) { S.fbErr = true; render(); return; } S.fbErr = false; f.sent = true; render(); },
  renew: () => toast("Renewal is simulated. Our team would send a renewal quote.")
};
function focusStep() { const h = $("#setupStepTitle"); if (h) h.focus({ preventScroll: false }); }
function afterCount() { if (S.screen === "run") paintPlayer(true); save(); }
function placeOrder() {
  const o = S.order;
  o.err = checkoutErrors(bill(), o.method);
  if (o.err.length) { render(); const f = document.getElementById("co-" + o.err[0].k); if (f) f.focus(); return; }
  o.processing = true; render();
  setTimeout(() => {
    o.processing = false; o.placed = true; o.orderNo = ORDER_NO;
    if (S.screen === "checkout") { render(); const h = $("#screenTitle"); if (h) h.focus(); }
    toast(o.method === "po" ? "Purchase order received. Nothing was sent." : "Invoice requested. Nothing was sent.");
  }, 1200);
}
function signAgreement() {
  const a = S.agree;
  a.err = [];
  if (!a.dpa) a.err.push("dpa"); if (!a.terms) a.err.push("terms"); if (!String(a.name).trim()) a.err.push("name");
  if (a.err.length) { render(); const f = document.getElementById(a.err[0] === "name" ? "ag-name" : "ag-" + a.err[0]); if (f) f.focus(); return; }
  a.signed = true; render(); toast("Signed. Copies would go to " + O().coordinator + " by email (simulated).");
}
const TOUR_ACTIONS = {
  play: () => { if (P.phase !== "video" || !P.playing) playerPlay(); },
  playTrailer: () => { UI.clip = null; clipToggle("trailer"); },
  generateLink: () => { generateLink(); render(); }
};
const TOUR_SETUP = {
  threeSites: () => { S.order.sites = 3; S.order.placed = false; S.order.err = []; },
  playerStart: () => { P = freshPlayer(); },
  hookPause: () => { jumpTo(1); P.line = curLines().length - 1; enterPause(); },
  makeStep: () => { jumpTo(3); P.line = 3; P.playing = false; },
  openCount: () => { TOUR_SETUP.hookPause(); UI.drawer = "count"; },
  familyView: () => { if (!showcase().link) generateLink(); }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "checkout" && !S.order.processing) placeOrder();
  else if (f.dataset.form === "agree") signAgreement();
  else if (f.dataset.form === "sched") ACT.saveSched();
});
function setField(el) {
  const f = el.dataset.field, val = el.type === "checkbox" ? el.checked : el.value, k = f.split(".")[1];
  if (f.indexOf("sv.") === 0) { S.setup.v[S.mode][k] = val; return false; }
  if (f === "team") { S.setup.v[S.mode].team[Number(el.dataset.i)][el.dataset.k] = val; return false; }
  if (f.indexOf("bill.") === 0) { bill()[k] = val; return false; }
  if (f === "order.method") { S.order.method = val; S.order.err = []; return true; }
  if (f === "order.taxExempt") { S.order.taxExempt = val; return true; }
  if (f.indexOf("agree.") === 0) { S.agree[k] = val; if (el.type === "checkbox") S.agree.err = S.agree.err.filter((x) => x !== k); return el.type === "checkbox"; }
  if (f.indexOf("sched.") === 0) { const s = S.sched[S.mode]; s[k] = el.type === "number" ? Number(val) : val; s.saved = false; return true; }
  if (f === "cat.focus") { S.cat.focus = val; return true; }
  if (f === "port.team") { S.port.team = val; return true; }
  if (f === "prep") { const a = sess().prep, i = Number(el.dataset.i), j = a.indexOf(i); if (el.checked && j < 0) a.push(i); if (!el.checked && j >= 0) a.splice(j, 1); return true; }
  if (f === "notes") { sess().notes = val; return false; }
  if (f === "fb.q3") { S.feedback[S.mode].q3 = val; return false; }
  if (f === "capCaption") { UI.cap.caption = val; return false; }
  if (f === "capTeam") { UI.cap.team = val; return false; }
  if (f === "capRelease") { UI.cap.release = val; UI.cap.err = false; renderDrawer(); return false; }
  if (f === "scTitle") { showcase().title = val; return false; }
  return false;
}
document.addEventListener("input", (e) => { const el = e.target.closest("[data-field]"); if (el && el.type !== "checkbox" && el.type !== "radio" && el.tagName !== "SELECT" && el.type !== "date" && el.type !== "number") { setField(el); save(); } });
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-field]"); if (!el) return;
  if (el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT" || el.type === "date" || el.type === "number") { if (setField(el)) render(); save(); }
});

/* ---------- guided tour ---------- */
function tourStart(path) { UI.drawer = null; renderDrawer(); UI.tour = { path: path, i: 0, paused: false, did: false }; tourShow(0); }
function tourShow(i) {
  const Tr = UI.tour, steps = TOUR[Tr.path];
  Tr.i = Math.max(0, Math.min(steps.length - 1, i)); Tr.paused = false; Tr.did = false;
  const s = steps[Tr.i];
  if (S.mode !== Tr.path) { S.mode = Tr.path; P = freshPlayer(); }
  S.speed = 4; UI.drawer = null; stopClip();
  if (UI.projector) setProjector(false, true);
  if (S.screen === "run" && s.screen !== "run") P.playing = false;
  if (s.screen === "run") { UI.key = ""; UI.ckey = ""; }
  S.screen = s.screen;
  if (s.setup) TOUR_SETUP[s.setup]();
  render();
  const el = $(s.target); if (el) el.scrollIntoView({ block: "center", behavior: "auto" });
  tourDraw();
}
function tourNext() { const Tr = UI.tour; if (Tr.i >= TOUR[Tr.path].length - 1) { tourExit(true); return; } tourShow(Tr.i + 1); }
function tourExit(finished) {
  UI.tour = null; $("#tourRoot").innerHTML = "";
  toast(finished ? "That's the whole program, end to end. Reset demo to run it again." : "Tour closed. Everything stays clickable.");
  const b = $("#tourBtn"); if (b) b.focus();
}
function tourDraw() {
  const Tr = UI.tour, root = $("#tourRoot");
  if (!Tr) { root.innerHTML = ""; return; }
  const steps = TOUR[Tr.path], s = steps[Tr.i], n = steps.length;
  if (Tr.paused) {
    root.innerHTML = '<div class="tour-mini" role="region" aria-label="Guided tour, paused"><span>Tour paused at step ' + (Tr.i + 1) + " of " + n + "</span>" + btn(I.play + "Resume", 'id="tourResumeBtn" data-act="tourResume"', "go") + btn("Exit", 'data-act="tourExit"') + "</div>";
    if (!UI.drawer) $("#tourResumeBtn").focus();
    return;
  }
  root.innerHTML = '<div class="tour-spot" id="tourSpot"></div><div class="tour-tip" id="tourTip" role="dialog" aria-modal="true" aria-labelledby="tourTitle" aria-describedby="tourBody">'
    + '<p class="tour-tip__step">' + (Tr.path === "school" ? "School" : "Library") + " tour, step " + (Tr.i + 1) + " of " + n + ". " + esc(STAGES[SCREENS[s.screen].stage]) + "</p>"
    + '<h2 id="tourTitle">' + esc(s.title) + '</h2><p class="tour-tip__body" id="tourBody">' + esc(s.body) + "</p>"
    + '<div class="tour-bar" aria-hidden="true"><i style="width:' + Math.round(100 * (Tr.i + 1) / n) + '%"></i></div>'
    + (s.action ? '<div class="tour-tip__act">' + (Tr.did ? '<span class="st st--done">Done. Press Next when ready.</span>' : btn(esc(s.actionLabel), 'id="tourDo" data-act="tourDo"', "go")) + "</div>" : "")
    + '<div class="tour-tip__nav">' + btn("Back", 'id="tourBack" data-act="tourPrev"' + (Tr.i === 0 ? " disabled" : "")) + btn(Tr.i === n - 1 ? "Finish" : "Next", 'id="tourNextBtn" data-act="tourNext"', s.action && !Tr.did ? "" : "go") + "</div>"
    + '<div class="tour-tip__tools"><button type="button" data-act="tourPause">Pause and click around</button><button type="button" data-act="tourRestart">Restart</button><button type="button" data-act="tourExit">Exit tour</button></div></div>';
  tourPlace();
  const f = $("#tourDo") || $("#tourNextBtn"); if (f) f.focus({ preventScroll: true });
}
function tourPlace() {
  const Tr = UI.tour; if (!Tr || Tr.paused) return;
  const s = TOUR[Tr.path][Tr.i], el = $(s.target), spot = $("#tourSpot"), tip = $("#tourTip");
  if (!spot || !tip) return;
  const vw = document.documentElement.clientWidth, vh = innerHeight, tw = tip.offsetWidth, th = tip.offsetHeight, gap = 16;
  if (!el) { spot.style.display = "none"; tip.style.left = Math.max(16, (vw - tw) / 2) + "px"; tip.style.top = Math.max(16, (vh - th) / 2) + "px"; return; }
  const r = el.getBoundingClientRect(), pad = 6;
  spot.style.display = "block";
  spot.style.left = (r.left - pad) + "px"; spot.style.top = (r.top - pad) + "px"; spot.style.width = (r.width + pad * 2) + "px"; spot.style.height = (r.height + pad * 2) + "px";
  let left, top;
  if (vw < 700) { left = 16; top = r.bottom + gap + th < vh ? r.bottom + gap : Math.max(16, vh - th - 16); }
  else if (r.right + gap + tw < vw) { left = r.right + gap; top = Math.min(Math.max(16, r.top), vh - th - 16); }
  else if (r.left - gap - tw > 0) { left = r.left - gap - tw; top = Math.min(Math.max(16, r.top), vh - th - 16); }
  else if (r.bottom + gap + th < vh) { left = Math.min(Math.max(16, r.left), vw - tw - 16); top = r.bottom + gap; }
  else if (r.top - gap - th > 0) { left = Math.min(Math.max(16, r.left), vw - tw - 16); top = r.top - gap - th; }
  else { left = vw - tw - 16; top = vh - th - 16; }
  tip.style.left = Math.max(16, left) + "px"; tip.style.top = Math.max(16, top) + "px";
}
addEventListener("resize", () => { if (UI.tour) tourPlace(); });
addEventListener("scroll", () => { if (UI.tour) tourPlace(); }, { passive: true });

document.addEventListener("keydown", (e) => {
  const Tr = UI.tour;
  if (Tr && !Tr.paused && !UI.drawer) {
    if (e.key === "Escape") { e.preventDefault(); tourExit(); return; }
    const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
    if (!typing && e.key === "ArrowRight") { e.preventDefault(); tourNext(); return; }
    if (!typing && e.key === "ArrowLeft") { e.preventDefault(); if (Tr.i > 0) tourShow(Tr.i - 1); return; }
    if (e.key === "Tab") {
      const f = [...document.querySelectorAll("#tourTip button:not([disabled])")];
      if (f.length) { const i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
      return;
    }
  }
  if (e.key === "Escape") {
    if (UI.drawer) { e.preventDefault(); closeDrawer(); return; }
    if (UI.projector) { e.preventDefault(); setProjector(false); return; }
  }
  if (UI.drawer && e.key === "Tab") {
    const f = [...document.querySelectorAll(".drawer button:not([disabled]), .drawer input, .drawer select")];
    if (f.length) { const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
});

/* ---------- the clock ---------- */
let last = performance.now();
function loop(now) { const d = Math.min(200, now - last); last = now; tickPlayer(d); tickClip(d); requestAnimationFrame(loop); }
render();
requestAnimationFrame(loop);
</script>
