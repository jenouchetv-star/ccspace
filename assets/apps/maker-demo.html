<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maker Program demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maker Program demo. A clickable, simulated prototype for schools (Units) and libraries (Workshops).
   The look follows the approved mockup docs/mockups/maker-demo-dashboard-draft.html (draft 3). */
:root{
  --ink:#1E2226; --paper:#FAF4E6; --cyan:#1273B0; --cyan-deep:#0A5280; --sun:#F2C230; --leaf:#2F6B2C; --plum:#6C3E8C; --hl-now:#8FE3F0;
  --slate:#56616A; --line:#DDE6EB; --line2:#C3D2DB; --sky:#EAF4FA; --skyline:#C6DDEB; --track:#E4ECF1;
  --halftone:radial-gradient(rgba(30,34,38,.07) 1px, transparent 1.2px);
  --ease:cubic-bezier(.2,.9,.3,1);
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink); background:var(--paper);
  background-image:var(--halftone); background-size:7px 7px; font-size:1rem; line-height:1.5; overflow-x:hidden; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
button:disabled{ cursor:not-allowed; opacity:.5; }
h1,h2,h3,h4,p{ margin:0; }
a{ color:var(--cyan-deep); font-weight:700; text-underline-offset:3px; }
img{ display:block; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:-9999px; top:8px; z-index:200; background:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:10px 16px; font-weight:800; color:var(--ink); }
.skip:focus{ left:12px; }
.fade{ animation:fade .38s var(--ease) both; }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

/* the site's highlighter stroke (index.html .nav__link): hover = yellow, current page = blue */
.hl{ --hl:var(--sun); display:inline; padding:4px .14em; text-decoration:none; color:var(--ink); font-weight:800; border:0; cursor:pointer; background-color:transparent;
  background-image:linear-gradient(180deg,transparent 40%,var(--hl) 40%,var(--hl) 96%,transparent 96%); background-position:0 50%; background-size:0% 1.3em; background-repeat:no-repeat;
  transition:background-size .28s var(--ease); }
.hl:hover{ background-size:100% 1.3em; }
.hl[aria-current="page"]{ --hl:var(--hl-now); background-size:100% 1.3em; }

/* demo journey bar (presenter only, not part of the product) */
.jbar{ position:sticky; top:0; z-index:50; background:var(--ink); color:#fff; padding:8px 18px; font-size:.86rem; }
.jbar :focus-visible{ outline-color:var(--sun); }
.jrow{ display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; }
.jbar__tag{ background:var(--plum); border-radius:6px; padding:2px 8px; font-size:.72rem; font-weight:800; letter-spacing:.04em; }
.jstages{ display:flex; gap:4px; flex-wrap:wrap; flex:1; }
.jstage{ border:0; background:none; color:#B9C2C9; border-radius:999px; padding:5px 12px; font-weight:700; display:inline-flex; align-items:center; gap:7px; min-height:34px; }
.jstage i{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:.72rem; font-weight:800; border:1.5px solid #5B646B; }
.jstage:hover{ color:#fff; }
.jstage.done i{ background:#3F7F3B; border-color:#3F7F3B; color:#fff; }
.jstage[aria-current="step"]{ background:#fff; color:var(--ink); }
.jstage[aria-current="step"] i{ background:var(--sun); border-color:var(--ink); color:var(--ink); }
.jnav{ display:flex; align-items:center; gap:8px; }
.jnav span{ color:#D7DDE1; font-weight:600; text-align:right; }
.jbtn{ border:1.5px solid #5B646B; background:none; color:#fff; border-radius:999px; padding:4px 12px; min-height:34px; font-weight:800; display:inline-flex; align-items:center; gap:6px; }
.jbtn:hover{ border-color:#fff; }
.jbtn svg{ width:15px; height:15px; }
.jbtn--sun{ background:var(--sun); border-color:var(--sun); color:var(--ink); }
.jtools{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; margin-top:7px; padding-top:7px; border-top:1px solid #343B41; }
.jtool{ display:inline-flex; align-items:center; gap:8px; color:#B9C2C9; font-weight:700; }
.jtools__sp{ flex:1; }

/* public pages: the site's own header */
.pub{ background:#fff; border-bottom:3px solid var(--ink); box-shadow:0 4px 0 rgba(30,40,46,.12); }
.pub__in{ max-width:1240px; margin:0 auto; display:flex; align-items:center; gap:22px; height:72px; padding:0 22px; }
.pub__logo{ display:block; height:72px; padding:8px 0; flex:none; }
.pub__logo img{ height:100%; width:auto; }
.pub__links{ display:flex; gap:10px; margin-left:6px; }
.pub__cta{ margin-left:auto; }
.pubwrap{ max-width:1240px; margin:0 auto; padding:36px 22px 64px; }
.pubwrap:focus, .main:focus{ outline:none; }

/* partner app: white sidebar with the logo, highlighter nav */
.app{ display:grid; grid-template-columns:244px minmax(0,1fr); min-height:calc(100vh - 92px); }
.side{ background:#fff; border-right:3px solid var(--ink); padding:18px 22px 22px; display:flex; flex-direction:column; gap:22px; }
.side__logo{ display:block; height:76px; }
.side__logo img{ height:100%; width:auto; }
.side__org{ font-size:.86rem; color:var(--slate); font-weight:600; line-height:1.35; }
.side__org b{ display:block; color:var(--ink); font-size:.95rem; }
.side nav{ display:flex; flex-direction:column; align-items:flex-start; gap:12px; font-size:1.02rem; }
.side__who{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; font-size:.84rem; color:var(--slate); font-weight:600; }
.side__who b{ display:block; color:var(--ink); font-size:.92rem; }
.av{ width:36px; height:36px; border-radius:50%; background:var(--sky); border:2px solid var(--ink); display:grid; place-items:center; font-weight:800; font-size:.8rem; color:var(--ink); flex:none; }
.main{ padding:28px clamp(16px,3vw,40px) 56px; min-width:0; }

/* shared pieces (the parent report look) */
.sheet{ background:#fff; border:3px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:6px 6px 0 var(--ink); }
.band{ background-image:var(--halftone), linear-gradient(180deg,#CFE6F4 0%,#E2F0F7 55%,#F1F7FA 100%); background-size:7px 7px,100% 100%;
  border-bottom:3px solid var(--ink); padding:26px clamp(16px,3.4vw,44px) 24px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px 28px; }
.band h1{ font-size:1.7rem; line-height:1.2; font-weight:800; letter-spacing:-.015em; }
h1:focus{ outline:none; }
.meta{ font-size:.88rem; color:var(--slate); font-weight:600; }
.band .meta{ margin-bottom:6px; }
.pad{ padding:36px clamp(16px,3.4vw,44px) 44px; }
.block + .block{ margin-top:48px; }
.block > h2{ font-size:1.15rem; font-weight:800; margin-bottom:16px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.btns{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; border:2.5px solid var(--ink); background:#fff; border-radius:999px; padding:8px 18px; font-size:.95rem; font-weight:800; box-shadow:2px 2px 0 var(--ink); text-decoration:none; color:var(--ink); transition:transform .16s var(--ease), box-shadow .16s var(--ease); }
@media (hover:hover){ .btn:not(:disabled):hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); } }
.btn svg{ width:18px; height:18px; flex:none; }
.btn--go{ background:var(--cyan); color:#fff; }
.btn--sun{ background:var(--sun); }
.btn--lg{ padding:12px 26px; font-size:1.05rem; }
.btn--ghost{ box-shadow:none; border-color:var(--line2); }
.tag{ display:inline-block; font-size:.78rem; font-weight:800; border-radius:999px; padding:3px 10px; border:2px solid var(--ink); background:#fff; }
.tag--sun{ background:var(--sun); }
.tag--new{ background:var(--sun); }
.tags{ display:flex; gap:8px; flex-wrap:wrap; }
.panel{ border:2.5px solid var(--ink); border-radius:16px; background:linear-gradient(180deg,#EAF4FA 0%,#F5F9FC 100%); box-shadow:4px 4px 0 var(--ink); overflow:hidden; }
.panel > section{ padding:16px 20px; }
.panel > section + section{ border-top:1px dashed var(--skyline); }
.panel h3{ font-size:.82rem; font-weight:800; color:var(--plum); margin-bottom:6px; }
.panel h2{ font-size:1.02rem; font-weight:800; }
.panel ul{ margin:0; padding-left:18px; }
.panel li + li{ margin-top:4px; }
.box{ border:2.5px solid var(--ink); border-radius:16px; background:#fff; box-shadow:4px 4px 0 var(--ink); }
.rule{ display:grid; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.rule > div{ padding:24px 28px 26px 0; min-width:0; }
.rule > div + div{ border-left:1px solid var(--line); padding-left:28px; }
.rule h3{ font-size:1.02rem; font-weight:800; margin-bottom:12px; }
.cols2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .cols3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.big b{ display:block; font-size:2.2rem; line-height:1; font-weight:800; letter-spacing:-.02em; }
.big span{ display:block; margin-top:6px; font-size:.88rem; color:var(--slate); font-weight:600; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; }
.st{ display:inline-flex; align-items:center; gap:7px; font-size:.88rem; font-weight:700; white-space:nowrap; }
.st::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--c); border:2px solid var(--c); }
.st--ok{ --c:var(--leaf); } .st--now{ --c:var(--sun); } .st--next{ --c:var(--cyan); } .st--open{ --c:#A7ADB2; color:var(--slate); } .st--open::before{ background:transparent; }
.tblwrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:.8rem; color:var(--slate); font-weight:700; padding:0 12px 10px 0; border-bottom:2px solid var(--ink); }
td{ padding:13px 12px 13px 0; border-bottom:1px solid var(--line); font-weight:600; vertical-align:middle; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field label, .field .lbl{ font-size:.9rem; font-weight:800; }
.field input, .field select, .field textarea{ border:2.5px solid var(--ink); border-radius:12px; padding:10px 12px; background:#FFFDF8; font-weight:600; min-height:44px; width:100%; }
.field small{ color:var(--slate); font-weight:500; }
.form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 22px; }
.check{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; cursor:pointer; font-weight:600; }
.check input{ appearance:none; -webkit-appearance:none; width:22px; height:22px; border:2.5px solid var(--ink); border-radius:6px; margin:1px 0 0; display:grid; place-items:center; flex:none; background:#fff; cursor:pointer; }
.check input:checked{ background:var(--leaf); border-color:var(--leaf); }
.check input:checked::after{ content:""; width:5px; height:10px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:translateY(-1px) rotate(45deg); }
.check input:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }
/* the site's approved segmented control (styleguide, index.html .seg / .seg__opt) */
.seg{ display:inline-flex; flex-wrap:wrap; border:2.5px solid var(--ink); border-radius:999px; padding:3px; background:var(--paper); gap:3px; }
.seg__opt{ font-family:inherit; font-weight:800; font-size:.86rem; border:0; border-radius:999px; padding:8px 18px; background:transparent; color:var(--ink); cursor:pointer; }
.seg__opt.is-on{ background:var(--ink); color:var(--paper); }
.seg__opt:focus-visible{ outline:3px solid var(--cyan); outline-offset:1px; }
.jbar .seg__opt:focus-visible{ outline-color:var(--sun); }
.note{ font-size:.86rem; color:var(--slate); font-weight:500; }
.sample{ display:inline-block; font-size:.74rem; font-weight:800; background:var(--plum); color:#fff; border-radius:6px; padding:2px 8px; vertical-align:middle; letter-spacing:.02em; }
.ic{ width:16px; height:16px; display:inline-block; vertical-align:-3px; }

/* program cards with a host */
.progs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px; }
.prog{ border:2.5px solid var(--ink); border-radius:16px; overflow:hidden; background:#fff; box-shadow:4px 4px 0 var(--ink); text-align:left; padding:0; display:flex; flex-direction:column; }
.prog__art{ height:132px; display:flex; align-items:flex-end; justify-content:center; border-bottom:2.5px solid var(--ink); background-image:var(--halftone); background-size:7px 7px; overflow:hidden; }
.prog__art img{ height:122px; width:auto; margin-bottom:-2px; }
.prog__body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; }
.prog h3{ font-size:1rem; font-weight:800; }
.prog .st{ margin-top:6px; }

/* video player (one host, step by step, then the science) */
.stagewrap{ position:relative; container-type:inline-size; }
.stage{ position:relative; aspect-ratio:16/9; border:3px solid var(--ink); border-radius:18px; overflow:hidden;
  background:linear-gradient(0deg,#E9C79A 0 22%, transparent 22%), linear-gradient(180deg,#FFF4D6 0%,#FBE3C3 100%); }
.stage--sci{ background:linear-gradient(0deg,#BFD9E8 0 22%, transparent 22%), linear-gradient(180deg,#E2F0F7 0%,#CFE6F4 100%); }
.stage--share{ background:linear-gradient(0deg,#A9D8C9 0 22%, transparent 22%), linear-gradient(180deg,#EFFAF6 0%,#D6F0E7 100%); }
.stage__host{ position:absolute; bottom:4%; height:90%; left:7%; }
.stage--center .stage__host{ left:50%; transform:translateX(-50%); }
.stage__host img{ height:100%; width:auto; }
/* the step picture fills the left of the stage and zooms in slowly while the chapter plays */
.stage__frame{ position:absolute; left:0; top:0; bottom:0; width:56.25%; overflow:hidden; border-right:3px solid var(--ink); background:#E9C79A; }
.stage__frame img{ width:100%; height:100%; object-fit:cover; transform-origin:45% 40%; animation:kenburns 18s cubic-bezier(.2,.7,.3,1) both; }
.stage.is-paused .stage__frame img{ animation-play-state:paused; }
@keyframes kenburns{ from{ transform:scale(1) translate(0,0); } to{ transform:scale(1.12) translate(-1.5%,-1.5%); } }
.stage--frame .stage__card{ right:3%; width:37.5%; top:15%; }
.stage__portrait{ position:absolute; left:9%; top:12%; width:31cqw; height:31cqw; border-radius:50%; border:4px solid var(--ink); overflow:hidden; background:#fff; box-shadow:.6cqw .6cqw 0 var(--ink); }
.stage__portrait--center{ left:50%; transform:translateX(-50%); }
.stage__portrait img{ width:100%; height:100%; object-fit:cover; }
img.is-portrait{ border-radius:50%; border:3px solid var(--ink); object-fit:cover; background:#fff; align-self:center; }
.prog__art img.is-portrait{ height:104px; width:104px; margin:0; }
.prog__art:has(.is-portrait), .today__art:has(.is-portrait){ align-items:center; padding:14px 0; }
.today__art img.is-portrait{ height:120px; width:120px; }
.done-hero img.is-portrait{ height:200px; width:200px; border-width:4px; box-shadow:5px 5px 0 var(--ink); }
.pausecard__top img.is-portrait{ object-position:center; }
.mini-frame{ position:absolute; inset:0; }
.mini-frame img{ width:100%; height:100%; object-fit:cover; object-position:50% 30%; }
.stage__chip{ position:absolute; top:2.2cqw; left:2.2cqw; background:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:.4cqw 1.6cqw; font-size:max(.72rem,1.7cqw); font-weight:800; z-index:2; }
.stage__count{ position:absolute; top:2.2cqw; right:2.2cqw; background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:.4cqw 1.6cqw; font-size:max(.72rem,1.7cqw); font-weight:800; z-index:2; }
.stage__card{ position:absolute; right:4.5%; top:14%; width:46%; background:#fff; border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:2cqw 2.4cqw; }
.stage__card h4{ font-size:max(.8rem,2.2cqw); font-weight:800; line-height:1.25; }
.stage__card p{ margin-top:.8cqw; font-size:max(.72rem,1.9cqw); color:#333A3F; line-height:1.4; }
.demo-ph{ margin-top:1.4cqw; height:11cqw; border-radius:10px; border:2px dashed var(--line2); display:grid; place-items:center; font-size:max(.62rem,1.2cqw); font-weight:800; color:var(--slate); background:#FBFDFE; letter-spacing:.03em; }
.sci{ display:grid; grid-template-columns:1fr 1fr; gap:1.2cqw; margin-top:1.2cqw; }
.sci div{ border:2px solid var(--line2); border-radius:10px; padding:1cqw; text-align:center; font-size:max(.62rem,1.3cqw); font-weight:700; background:#FBFDFE; line-height:1.3; }
.sci svg{ width:100%; height:4cqw; }
.stage__cap{ position:absolute; left:50%; bottom:2.4cqw; transform:translateX(-50%); width:min(88%,780px); background:rgba(30,34,38,.9); color:#fff; border-radius:12px; padding:1.2cqw 2cqw; font-size:max(.78rem,2.2cqw); font-weight:700; text-align:center; line-height:1.35; z-index:3; }
@container (max-width:560px){ .demo-ph, .sci, .stage--frame .stage__card p, .stage--sci .stage__card p{ display:none; } .stage__card{ top:18%; width:52%; } .stage--frame .stage__card{ width:38%; top:20%; } }
.pausecard{ position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; padding:24px; border-radius:18px; overflow:auto;
  background-image:var(--halftone), linear-gradient(180deg,rgba(207,230,244,.97) 0%,rgba(241,247,250,.97) 100%); background-size:7px 7px,100% 100%; border:3px solid var(--ink); }
.pausecard__in{ width:min(100%,640px); background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink); padding:18px 22px; }
.pausecard__top{ display:flex; align-items:center; gap:14px; }
.pausecard__top img{ width:58px; height:58px; object-fit:cover; object-position:50% 4%; border-radius:50%; border:2.5px solid var(--ink); background:#FFE7A6; flex:none; }
.pausecard__label{ display:inline-block; background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:2px 12px; font-weight:800; font-size:.86rem; }
.pausecard__say{ margin-top:4px; font-weight:700; color:var(--slate); font-size:.9rem; }
.pausecard__prompt{ margin-top:12px; font-size:1.2rem; font-weight:800; line-height:1.3; }
.timer{ display:flex; align-items:center; gap:14px; margin-top:12px; }
.timer__num{ font-size:2.4rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; color:var(--cyan-deep); }
.timer__bar{ flex:1; height:12px; border-radius:999px; background:var(--track); border:1.5px solid var(--line2); overflow:hidden; }
.timer__bar i{ display:block; height:100%; background:var(--leaf); }
.timeup{ margin-top:8px; font-weight:800; color:var(--plum); }
.pausecard .btns{ margin-top:14px; }
@container (max-width:640px){
  .pausecard{ position:relative; inset:auto; margin-top:14px; padding:0; background:none; border:0; overflow:visible; }
  .pausecard__in{ width:100%; }
}
.player{ display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap; }
.ibtn{ width:46px; height:46px; display:grid; place-items:center; border:2.5px solid var(--ink); border-radius:50%; background:#fff; box-shadow:2px 2px 0 var(--ink); flex:none; padding:0; color:var(--ink); }
.ibtn--play{ background:var(--cyan); color:#fff; }
.ibtn svg{ width:20px; height:20px; }
.track{ flex:1; min-width:120px; height:8px; border-radius:999px; background:var(--track); border:1.5px solid var(--line2); overflow:hidden; }
.track i{ display:block; height:100%; width:0; background:var(--cyan); }
.time{ font-size:.88rem; font-weight:700; color:var(--slate); font-variant-numeric:tabular-nums; }
.chaps{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.chap{ display:inline-flex; align-items:center; gap:7px; border:2px solid var(--line2); border-radius:999px; padding:6px 12px; min-height:40px; font-size:.86rem; font-weight:700; background:#fff; color:#3E464C; }
.chap b{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.74rem; background:var(--sky); border:1.5px solid var(--skyline); }
.chap.done{ border-color:var(--leaf); color:var(--leaf); }
.chap.done b{ background:#E3F3DC; border-color:var(--leaf); }
.chap[aria-current="step"]{ border:2.5px solid var(--ink); background:var(--sun); color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
.chap[aria-current="step"] b{ background:#fff; border-color:var(--ink); }
.run{ display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:28px; align-items:start; }
.only-proj{ display:none !important; }

/* small simulated clips: trailer, prep tip, thank-you */
.mini-player{ position:relative; aspect-ratio:16/9; border:2.5px solid var(--ink); border-radius:14px; overflow:hidden; background:linear-gradient(0deg,#E9C79A 0 22%, transparent 22%), linear-gradient(180deg,#FFF4D6 0%,#FBE3C3 100%); container-type:inline-size; }
.mini-player > img{ position:absolute; bottom:4%; left:50%; transform:translateX(-50%); height:86%; width:auto; }

/* drawers and dialogs */
.backdrop{ position:fixed; inset:0; z-index:80; background:rgba(30,34,38,.38); animation:fade .3s var(--ease) both; }
.drawer{ position:fixed; z-index:81; top:0; right:0; bottom:0; width:min(470px,100%); background:#fff; border-left:3px solid var(--ink); display:flex; flex-direction:column; animation:fade .3s var(--ease) both; }
.drawer__head{ padding:18px 20px 14px; border-bottom:3px solid var(--ink); background-image:var(--halftone), linear-gradient(180deg,#CFE6F4 0%,#F1F7FA 100%); background-size:7px 7px,100% 100%; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }

.viewfinder{ position:relative; aspect-ratio:4/3; border:3px solid var(--ink); border-radius:16px; overflow:hidden; background:#26313A; }
.viewfinder svg.shot{ position:absolute; inset:0; width:100%; height:100%; }

<script>
"use strict";
/*CORE-START*/
/* Everything between CORE-START and CORE-END is plain data and pure functions (no page access), so the
   tests in test/makerDemo.test.js can load it on its own. All people, places and numbers are fictional. */
const DEMO_TODAY = "2026-11-25";
const LINE_MS = 3500;      // one caption every 3.5 seconds at 1x
const TIMER_RATE = 60;     // demo timers run 60 times faster: a 20 minute build timer takes 20 seconds
const SPEEDS = [1, 2, 4];
const STORE_KEY = "ccsMakerDemo:v1";

/* Every host picture lives in this one map: full-body transparent poses, with the portrait as a fallback.
   Stacey's poses are not made yet (poses: null), so Stacey shows as the portrait in a circle. */
const USE_POSES = true;
const POSE_NAMES = ["wave", "point", "explain", "think", "cheer"];
const posesFor = (file) => ({
  wave: "../characters/poses/" + file + "-wave.png",
  point: "../characters/poses/" + file + "-point.png",
  explain: "../characters/poses/" + file + "-explain.png",
  think: "../characters/poses/" + file + "-think.png",
  cheer: "../characters/poses/" + file + "-cheer.png"
});
const HOST_ART = {
  chike: { name: "Chike", portrait: "../characters/chike.jpg", poses: posesFor("chike") },
  stacey: { name: "Stacey", portrait: "../characters/stacey.jpg", poses: null },
  kiyah: { name: "Kiyah", portrait: "../characters/kylah.jpg", poses: posesFor("kylah") },
  zech:  { name: "Zech",  portrait: "../characters/zech.jpg",  poses: posesFor("zech") },
  yuna:  { name: "Yuna",  portrait: "../characters/yuna.jpg",  poses: posesFor("yuna") },
  corey: { name: "Corey", portrait: "../characters/corey.jpg", poses: posesFor("corey") },
  mateo: { name: "Mateo", portrait: "../characters/mateo.jpg", poses: posesFor("mateo") }
};
function hostArt(id, pose) {
  const a = HOST_ART[id] || HOST_ART.chike;
  return (USE_POSES && pose && a.poses && a.poses[pose]) || a.portrait;
}
/* the video frames: the real step pictures of the site's activity "The Rubber-Band Guitar" (act-rubber-band-guitar) */
const frame = (n) => "../activities/rubber-band-guitar/step-" + n + "-large.jpg";

/* the presenter's journey: 6 stages, 17 screens */
const STAGES = ["Sign up", "Schedule", "Prep", "Run", "Share", "Admin"];
const TOUR_FLOWS = STAGES.map((label, i) => ({ id: "ABCDEF"[i], label: label }));
const SCREENS = {
  s1: { role: "coordinator", stage: 0, shell: "pub", t: "Landing page" },
  s2: { role: "coordinator", stage: 0, shell: "pub", t: "Choose your setting" },
  s3: { role: "coordinator", stage: 0, shell: "pub", t: "Plans" },
  s4: { role: "coordinator", stage: 0, shell: "pub", t: "Checkout" },
  s5: { role: "coordinator", stage: 0, shell: "app", t: "Partner setup" },

function paintPlayer(force) {

  const key = [ckey, P.line, P.playing, P.timerOn, P.timeUp, countLabel()].join("|");

      const cap = $("#stageCap"); if (cap && P.phase !== "ready" && P.phase !== "share") cap.textContent = curLine().text;

    UI.ckey = ckey; UI.key = key;
    $("#rail").innerHTML = railHTML();
    $("#sidePanel").innerHTML = panelHTML();
    const pb = $("#playBtn");
    const lbl = P.phase === "pause" ? "Resume video" : P.phase === "share" ? "Play again" : P.playing ? "Pause" : "Play";
    pb.innerHTML = (P.playing && P.phase === "video") ? I.pause : I.play; pb.setAttribute("aria-label", lbl);
    const again = fid && document.getElementById(fid);

    if (UI.tour) tourPlace();

  $("#pbar").style.width = Math.round(100 * pos / tot) + "%";
  $("#ptime").textContent = fmtClock(pos) + " / " + fmtClock(tot);
  const tn = $("#timerNum"); if (tn) tn.textContent = fmtClock(P.left);
  const tb = $("#timerBar"); if (tb) tb.style.width = (P.total ? Math.round(100 * P.left / P.total) : 0) + "%";
}
function startTimer(min) { P.total = P.left = min * 60; P.timerOn = true; P.timeUp = false; }
function enterPause() {
  const ch = lesson().chapters[P.ch];
  P.done[P.ch] = true; P.phase = "pause"; P.playing = false; P.line = curLines().length - 1; P.t = 0;
  startTimer(pauseMinutes(ch.pause, S.mode));

function enterShare() {
  P.ch = LAST; P.done[LAST] = true; P.phase = "share"; P.playing = false;

function endChapter() { if (lesson().chapters[P.ch].pause) enterPause(); else if (P.ch < LAST) jumpTo(P.ch + 1); else enterShare(); }
function jumpTo(i) {
  P.ch = i; P.line = 0; P.t = 0; P.phase = "video"; P.timerOn = false; P.timeUp = false; P.playing = true;
  for (let j = 0; j <= LAST; j++) P.done[j] = j < i;
}
function resumeVideo() { if (P.ch < LAST) jumpTo(P.ch + 1); }
function playerPlay() {
  if (P.phase === "video") { P.playing = !P.playing; paintPlayer(false); return; }  // keep the stage, so the slow zoom pauses and resumes in place
  if (P.phase === "ready") { P.phase = "video"; P.playing = true; }

}
function nextChapter() {

function tickPlayer(d) {
  if (P.phase === "video" && P.playing) {
    P.t += d * S.speed;
    while (P.t >= LINE_MS && P.phase === "video") { P.t -= LINE_MS; P.line++; if (P.line >= curLines().length) endChapter(); }
  } else if ((P.phase === "pause" || P.phase === "share") && P.timerOn && P.left > 0) {
    P.left = Math.max(0, P.left - d / 1000 * TIMER_RATE);
    if (P.left === 0) { P.timerOn = false; P.timeUp = true; if (S.screen === "s12") toast("Time is up. Move on when the room is ready."); }
  }

}

    save();
  },
  portWeek: (el) => { S.port.week = el.dataset.v; render(); },
  scPick: (el) => { const a = showcase().items, k = a.indexOf(el.dataset.id); if (k < 0) a.push(el.dataset.id); else a.splice(k, 1); render(); },
  genLink: () => { generateLink(); render(); }
};
function afterCount() { if (S.screen === "s12") paintPlayer(true); save(); }
const TOUR_ACTIONS = {
  play: () => { if (P.phase !== "video" || !P.playing) playerPlay(); },
  playTrailer: () => { UI.clip = null; clipToggle("trailer"); },
  generateLink: () => { generateLink(); render(); }
};
const TOUR_SETUP = {
  libraryFilter: () => { S.lib.type = UI.tour.path === "library" ? "workshop" : "all"; S.lib.ages = "all"; },
  programDetail: () => { S.lib.programId = UI.tour.path === "library" ? "w-guitar" : "p-music"; },
  scheduleForm: () => { TOUR_SETUP.programDetail(); S.sched.repeat = UI.tour.path === "library" ? "once" : "weekly"; S.sched.date = UI.tour.path === "library" ? "2026-12-05" : "2026-12-02"; S.sched.capacity = 20; S.sched.caregivers = true; },
  playerStart: () => { P = freshPlayer(); },
  step1Pause: () => { jumpTo(1); enterPause(); },
  openCount: () => { TOUR_SETUP.step1Pause(); UI.drawer = "count"; },
  makeTimer: () => { jumpTo(4); enterPause(); },
  science: () => { jumpTo(LAST); P.line = 1; P.playing = false; },
  openCapture: () => { enterShare(); UI.drawer = "capture"; UI.cap = freshCap(); },
  showcase: () => { if (!showcase().items.length) showcase().items = items().slice(0, 3).map((p) => p.id); },
  familyView: () => { if (!showcase().link) generateLink(true); }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});
/* "Let me click": when the viewer clicks the highlighted thing themselves, the tour tip comes back */
document.addEventListener("click", (e) => {
  const T = UI.tour; if (!T || !T.waiting) return;
  const st = TOUR[T.path][T.i];
  if (e.target.closest(st.target)) setTimeout(() => { if (UI.tour === T) { T.waiting = false; T.did = true; tourDraw(); } }, 500);
}, true);
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form=assign]"); if (!f) return;
  e.preventDefault();
  const p = S.data.sample.partners.find((x) => x.id === $("#asPartner").value), id = $("#asProgram").value;
  if (p.programs.indexOf(id) < 0) { p.programs.push(id); toast(prog(id).title + " assigned to " + p.name + "."); } else toast("Already assigned.");
  render();
});
function setField(el) {
  const f = el.dataset.field, val = el.type === "checkbox" ? el.checked : el.value;
  if (f === "invite") { S.setup.invites[Number(el.dataset.i)][el.dataset.k] = val; return false; }
  if (f === "prep") { const a = sess().prep, i = Number(el.dataset.i); const k = a.indexOf(i); if (el.checked && k < 0) a.push(i); if (!el.checked && k >= 0) a.splice(k, 1); if (a.length < lesson().materials.length) sess().ready = false; return true; }
  if (f === "notes") { sess().notes = val; return false; }
  if (f === "capCaption") { UI.cap.caption = val; return false; }
  if (f === "capTeam") { UI.cap.team = val; return false; }
  if (f === "scTitle") { showcase().title = val; return false; }
  if (f === "scExp") { showcase().expiresInDays = Number(val); return true; }
  const path = f.split("."), obj = S[path[0]];
  obj[path[1]] = el.type === "number" ? Number(val) : val;
  return el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT";
}
document.addEventListener("input", (e) => { const el = e.target.closest("[data-field]"); if (el && el.type !== "checkbox" && el.type !== "radio" && el.tagName !== "SELECT") { setField(el); save(); } });
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-field]"); if (!el) return;
  if (el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT") { if (setField(el)) render(); save(); }
});

/* ---------- guided tour ---------- */
function tourStart(path) {
  UI.drawer = null; renderDrawer();
  UI.tour = { path: path, i: 0, paused: false, waiting: false, did: false };
  tourShow(0);
}
function tourShow(i) {
  const T = UI.tour, steps = TOUR[T.path];
  T.i = Math.max(0, Math.min(steps.length - 1, i)); T.waiting = false; T.paused = false; T.did = false;
  const st = steps[T.i];
  if (S.mode !== T.path) applyMode(T.path);
  S.speed = 4;
  UI.drawer = null; stopClip();
  if (UI.projector) setProjector(false, true);
  if (S.screen === "s12" && st.screen !== "s12") P.playing = false;
  if (st.screen === "s12" && S.screen !== "s12") UI.key = "";
  S.screen = st.screen;
  if (st.setup) TOUR_SETUP[st.setup]();
  render();
  const el = $(st.target);
  if (el) el.scrollIntoView({ block: "center", behavior: "auto" });
  tourDraw();
}
function tourNext() { const T = UI.tour; if (T.i >= TOUR[T.path].length - 1) { tourExit(true); return; } tourShow(T.i + 1); }
function tourExit(finished) {
  UI.tour = null; $("#tourRoot").innerHTML = "";
  toast(finished ? "That's the full program, end to end. Reset demo to run it again." : "Tour closed. Everything stays clickable.");
  const b = $("#tourBtn"); if (b) b.focus();
}
function tourDraw() {
  const T = UI.tour, root = $("#tourRoot");
  if (!T) { root.innerHTML = ""; return; }
  const steps = TOUR[T.path], st = steps[T.i], n = steps.length, cur = SCREENS[st.screen].stage;
  if (T.paused) {
    root.innerHTML = '<div class="tour-mini" role="region" aria-label="Guided tour, paused"><span>Tour paused at step ' + (T.i + 1) + " of " + n + '</span><button class="btn btn--sun" id="tourResumeBtn" data-act="tourResume">' + I.play + 'Resume tour</button><button class="btn btn--ghost" data-act="tourExit">Exit</button></div>';
    $("#tourResumeBtn").focus();
    return;
  }
  if (T.waiting) {
    root.innerHTML = '<div class="tour-spot" id="tourSpot"></div><div class="tour-mini" role="region" aria-label="Guided tour"><span>Your turn: click the highlighted control.</span><button class="btn btn--ghost" data-act="tourShowTip">Show the tip again</button></div>';
    tourPlace(); return;
  }
  root.innerHTML = '<div class="tour-spot" id="tourSpot"></div>'
    + '<div class="tour-tip" id="tourTip" role="dialog" aria-modal="true" aria-labelledby="tourTitle" aria-describedby="tourBody">'
    + '<div class="tour-tip__head">' + poseImg("chike", "wave") + '<div><p class="tour-tip__step">Step ' + (T.i + 1) + " of " + n + " &middot; " + (T.path === "school" ? "School" : "Library") + ' tour</p><h2 id="tourTitle">' + esc(st.title) + "</h2></div></div>"
    + '<p class="tour-tip__body" id="tourBody">' + esc(st.body) + "</p>"
    + '<ol class="tour-map" aria-label="Journey stages">' + TOUR_FLOWS.map((f, k) => '<li class="' + (k === cur ? "now" : k < cur ? "done" : "") + '"' + (k === cur ? ' aria-current="step"' : "") + ">" + f.label + "</li>").join("") + "</ol>"
    + (st.action ? '<div class="tour-tip__act">' + (T.did ? '<span class="done-chip">' + I.check + "Done. Press Next when ready.</span>" : '<button class="btn btn--sun" id="tourDo" data-act="tourDo">' + esc(st.actionLabel) + '</button><button class="btn btn--ghost" id="tourLetMe" data-act="tourLetMe">Let me click</button>') + "</div>" : "")
    + '<div class="tour-tip__nav"><button class="btn btn--ghost" id="tourBack" data-act="tourPrev"' + (T.i === 0 ? " disabled" : "") + ">Back</button>"
    + '<button class="btn btn--go" id="tourNextBtn" data-act="tourNext">' + (T.i === n - 1 ? "Finish" : "Next " + I.right) + "</button></div>"
    + '<div class="tour-tip__tools"><button data-act="tourPause">Pause tour</button><button data-act="tourRestart">Restart</button><button data-act="reset">Reset demo</button><button data-act="tourExit">Skip tour</button></div></div>';
  tourPlace();
  const f = $("#tourDo") || $("#tourNextBtn"); if (f) f.focus({ preventScroll: true });
}
function tourPlace() {
  const T = UI.tour; if (!T || T.paused) return;
  const st = TOUR[T.path][T.i], el = $(st.target), spot = $("#tourSpot"), tip = $("#tourTip");
  if (!spot) return;
  if (!el) { spot.style.display = "none"; if (tip) { tip.style.left = Math.max(16, (innerWidth - tip.offsetWidth) / 2) + "px"; tip.style.top = Math.max(16, (innerHeight - tip.offsetHeight) / 2) + "px"; } return; }
  const r = el.getBoundingClientRect(), pad = 8;
  spot.style.display = "block";
  spot.style.left = (r.left - pad) + "px"; spot.style.top = (r.top - pad) + "px";
  spot.style.width = (r.width + pad * 2) + "px"; spot.style.height = (r.height + pad * 2) + "px";
  if (!tip) return;
  const vw = innerWidth, vh = innerHeight, tw = tip.offsetWidth, th = tip.offsetHeight, gap = 20;
  let left, top;
  if (vw < 640) { left = 16; top = vh - th - 16; }
  else if (r.bottom + gap + th < vh - 8) { top = r.bottom + gap; left = r.left; }
  else if (r.top - gap - th > 8) { top = r.top - gap - th; left = r.left; }
  else if (r.right + gap + tw < vw - 8) { left = r.right + gap; top = r.top; }
  else if (r.left - gap - tw > 8) { left = r.left - gap - tw; top = r.top; }
  else { left = vw - tw - 16; top = vh - th - 16; }
  tip.style.left = Math.max(16, Math.min(left, vw - tw - 16)) + "px";
  tip.style.top = Math.max(16, Math.min(top, vh - th - 16)) + "px";
}
window.addEventListener("resize", () => tourPlace());
window.addEventListener("scroll", () => tourPlace(), { passive: true });

/* keyboard: tour arrows and Esc, focus traps for the tour tip and drawers, Esc leaves projector mode */
document.addEventListener("keydown", (e) => {
  const T = UI.tour, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Tab") {
    const box = (UI.drawer && $("#drawer")) || (T && !T.paused && !T.waiting && $("#tourTip"));
    if (!box) return;
    const f = Array.prototype.filter.call(box.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"), (x) => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  const so = e.target.closest && e.target.closest(".seg__opt");
  if (so && (e.key === "ArrowRight" || e.key === "ArrowLeft") && !(T && !T.paused)) {
    e.preventDefault();
    const all = Array.from(so.parentNode.querySelectorAll(".seg__opt")), i = all.indexOf(so);
    const nx = all[(i + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length], id = nx.id;
    nx.click();
    const again = (id && document.getElementById(id)) || document.querySelector(".seg__opt.is-on[data-act='" + nx.dataset.act + "']");
    if (again) again.focus();
    return;
  }
  if (T && !T.paused) {
    if (e.key === "Escape") { e.preventDefault(); tourExit(); return; }
    if (!typing && !T.waiting && e.key === "ArrowRight") { e.preventDefault(); tourNext(); return; }
    if (!typing && !T.waiting && e.key === "ArrowLeft") { e.preventDefault(); if (T.i > 0) tourShow(T.i - 1); return; }
  }
  if (e.key === "Escape") {
    if (UI.drawer) { e.preventDefault(); closeDrawer(); return; }
    if (UI.projector) { e.preventDefault(); setProjector(false); }
  }
});

/* one clock for the player and the clips */
let last = performance.now();
setInterval(() => { const now = performance.now(), d = Math.min(500, now - last); last = now; tickPlayer(d); tickClip(d); }, 100);
render();
</script>
