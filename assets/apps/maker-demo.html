<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maker Program demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maker Program demo. A clickable, simulated prototype for schools (Units) and libraries (Workshops).
   The look follows docs/mockups/maker-demo-player-draft.html, the parent progress report style. */
:root{
  --ink:#1E2226; --paper:#FAF4E6; --paper-card:#FFFBF3; --cyan:#1273B0; --cyan-deep:#0A5280; --sun:#F2C230; --leaf:#2F6B2C;
  --slate:#56616A; --line:#DDE6EB; --line2:#C3D2DB; --sky:#EAF4FA; --skyline:#C6DDEB; --plum:#6C3E8C;
  --halftone:radial-gradient(rgba(30,34,38,.07) 1px, transparent 1.2px);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{ box-sizing:border-box; }
body{ margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink); background:var(--paper);
  background-image:var(--halftone); background-size:7px 7px; line-height:1.45; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
button:disabled{ cursor:not-allowed; opacity:.55; }
a{ color:var(--cyan-deep); font-weight:700; }
:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
h1, h2, h3, p{ margin:0; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:-9999px; top:8px; z-index:200; background:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:10px 16px; font-weight:800; }
.skip:focus{ left:12px; }
.fade{ animation:fade .38s var(--ease) both; }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

/* top bar */
.top{ position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; padding:10px 24px; background:#fff; border-bottom:3px solid var(--ink); }
.brand{ display:flex; align-items:center; gap:12px; font-weight:800; }
.brand img{ height:34px; width:auto; }
.brand span{ font-size:.9rem; color:var(--slate); font-weight:600; padding-left:12px; border-left:2px solid var(--line); }
.brand .demo{ border:0; padding:3px 7px; color:#fff; }
.demo{ font-size:.72rem; font-weight:800; letter-spacing:.04em; background:var(--plum); color:#fff; border-radius:6px; padding:3px 7px; }
.topctl{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.seg{ display:inline-flex; border:2.5px solid var(--ink); border-radius:999px; overflow:hidden; background:#fff; box-shadow:2px 2px 0 var(--ink); }
.seg button{ border:0; background:none; min-height:44px; padding:0 12px; font-size:.86rem; font-weight:800; }
.seg button + button{ border-left:2.5px solid var(--ink); }
.seg button[aria-pressed="true"]{ background:var(--ink); color:#fff; }
.seg button:focus-visible{ outline-offset:-5px; outline-color:var(--sun); }
.pill, .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px; border:2.5px solid var(--ink); background:#fff; border-radius:999px; padding:0 16px; font-size:.9rem; font-weight:800; box-shadow:2px 2px 0 var(--ink); text-decoration:none; color:var(--ink); }
.pill--sun, .btn--sun{ background:var(--sun); }
.btn--primary{ background:var(--cyan); color:#fff; }
.btn--ghost{ box-shadow:none; border-color:var(--line2); }
.btn--lg{ min-height:52px; padding:0 22px; font-size:1rem; }
.pill svg, .btn svg{ width:17px; height:17px; flex:none; }
.pill[aria-pressed="true"]{ background:var(--sky); }

/* sheet */
.wrap{ max-width:1320px; margin:0 auto; padding:22px 28px 48px; }
.sheet{ background:#fff; border:3px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:6px 6px 0 var(--ink); }
.band{ background-image:var(--halftone), linear-gradient(180deg,#CFE6F4 0%,#E2F0F7 55%,#F1F7FA 100%); background-size:7px 7px,100% 100%;
  border-bottom:3px solid var(--ink); padding:22px 32px 0; }
.head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; }
.head h1{ font-size:1.5rem; font-weight:800; letter-spacing:-.01em; }
.head h1:focus{ outline:none; }
.meta{ font-size:.86rem; color:var(--slate); font-weight:600; margin-top:4px; }
.tabs{ display:flex; gap:8px 12px; margin-top:16px; padding-bottom:16px; overflow-x:auto; }
.tabs button{ min-height:44px; border:2.5px solid transparent; background:none; border-radius:12px; padding:0 14px; font-size:.95rem; font-weight:700; color:#3E464C; white-space:nowrap; }
.tabs button[aria-current="page"]{ background:var(--sun); border-color:var(--ink); color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
.tabs--solo{ padding-bottom:16px; }
.body{ padding:26px 32px 32px; }
.body--player{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; }

/* shared blocks */
.grid{ display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }
.cols{ display:grid; gap:24px; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); align-items:start; }
.cols--even{ grid-template-columns:1fr 1fr; }
.stack > * + *{ margin-top:16px; }
.card{ background:#fff; border:2.5px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:18px 20px; }
.card--soft{ border:2px solid var(--line2); box-shadow:none; }
.card--sky{ background:linear-gradient(180deg,#EAF4FA 0%,#F5F9FC 100%); }
.card h2{ font-size:1.08rem; font-weight:800; }
.card h3{ font-size:1rem; font-weight:800; }
.eyebrow{ display:block; font-size:.8rem; font-weight:800; color:var(--plum); margin-bottom:6px; }
.lead{ font-size:1.05rem; color:#2E363C; }
.muted{ color:var(--slate); font-weight:600; font-size:.9rem; }
.row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.row--between{ justify-content:space-between; }
.mt{ margin-top:16px; } .mt-s{ margin-top:8px; } .mt-l{ margin-top:26px; }
ul.clean{ list-style:none; padding:0; margin:0; }
ul.bullets{ margin:8px 0 0; padding-left:20px; }
ul.bullets li + li{ margin-top:4px; }
.tag{ display:inline-flex; align-items:center; gap:5px; border:1.5px solid var(--skyline); background:var(--sky); border-radius:999px; padding:3px 10px; font-size:.8rem; font-weight:700; }
.status{ display:inline-flex; align-items:center; gap:5px; border:2px solid var(--line2); border-radius:999px; padding:2px 10px; font-size:.8rem; font-weight:800; background:#fff; }
.status svg{ width:14px; height:14px; }
.status--ok{ background:#E3F3DC; border-color:var(--leaf); color:var(--leaf); }
.status--sun{ background:#FFF3C9; border-color:#B98A00; color:#6B4E00; }
.status--plum{ background:#F1E8F7; border-color:var(--plum); color:var(--plum); }
.status--new{ background:var(--sun); border-color:var(--ink); color:var(--ink); }
.note{ display:flex; gap:10px; align-items:flex-start; background:#FFF8E1; border:2px solid #E7C65A; border-radius:12px; padding:10px 14px; font-size:.9rem; font-weight:600; }
.note svg{ width:18px; height:18px; flex:none; margin-top:2px; }
.divider{ border:0; border-top:1px dashed var(--skyline); margin:16px 0; }
.stat{ border:2px solid var(--line2); border-radius:14px; padding:12px 14px; background:#fff; }
.stat b{ display:block; font-size:1.6rem; line-height:1.1; }
.stat span{ font-size:.85rem; color:var(--slate); font-weight:700; }
.stats{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }

/* forms */
.field{ display:block; }
.field + .field{ margin-top:14px; }
.field > span, .label{ display:block; font-weight:800; font-size:.9rem; margin-bottom:6px; }
.input{ width:100%; min-height:44px; border:2px solid var(--line2); border-radius:12px; padding:8px 12px; background:#fff; }
.input:focus{ border-color:var(--cyan); }
textarea.input{ min-height:96px; resize:vertical; }
.check{ display:flex; gap:12px; align-items:flex-start; min-height:44px; padding:8px 0; font-weight:600; cursor:pointer; }
.check input{ width:22px; height:22px; margin:1px 0 0; flex:none; accent-color:var(--cyan); }
.check small{ display:block; color:var(--slate); font-weight:600; }
fieldset{ border:0; padding:0; margin:0; }
legend{ font-weight:800; font-size:.9rem; margin-bottom:6px; padding:0; }
.switch{ display:inline-flex; align-items:center; gap:10px; min-height:44px; border:0; background:none; font-weight:800; padding:0; }
.switch i{ width:46px; height:26px; border-radius:999px; border:2.5px solid var(--ink); background:#fff; position:relative; flex:none; }
.switch i::after{ content:""; position:absolute; top:3px; left:3px; width:15px; height:15px; border-radius:50%; background:var(--ink); }
.switch[aria-pressed="true"] i{ background:var(--leaf); }
.switch[aria-pressed="true"] i::after{ left:auto; right:3px; background:#fff; }

/* landing */
.hero{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:30px; align-items:center; }
.hero h2{ font-size:2.1rem; line-height:1.15; font-weight:800; letter-spacing:-.015em; }
.hero .lead{ margin-top:12px; }
.hosts{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:16px; border:2px dashed var(--skyline); border-radius:18px; background:var(--sky); }
.hostcard{ text-align:center; background:#fff; border:2.5px solid var(--ink); border-radius:16px; padding:14px 10px; box-shadow:3px 3px 0 var(--ink); }
.hostcard .ring{ width:96px; height:96px; margin:0 auto 10px; }
.hostcard b{ display:block; font-size:1.05rem; }
.hostcard span{ display:block; font-size:.85rem; color:var(--slate); font-weight:700; }
.hostcard q{ display:block; margin-top:6px; font-size:.85rem; font-weight:600; quotes:none; }
.crew{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; font-size:.88rem; font-weight:700; color:var(--slate); }
.ring{ display:inline-block; vertical-align:middle; flex:none; border-radius:50%; border:3px solid var(--ink); box-shadow:0 0 0 5px var(--ringc,#8FDDBE); overflow:hidden; background:#fff; }
.ring img{ width:100%; height:100%; object-fit:cover; display:block; }
.flowstrip{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.flowstrip div{ border:2px solid var(--line2); border-radius:14px; padding:10px 12px; background:#fff; font-size:.85rem; font-weight:600; color:var(--slate); }
.flowstrip b{ display:block; color:var(--ink); font-size:.95rem; }

/* choose setting, plans */
.choice{ display:flex; flex-direction:column; gap:12px; }
.choice h2{ font-size:1.3rem; }
.choice[aria-current="true"]{ background:#FFFBEA; }
.tier{ display:flex; flex-direction:column; gap:10px; position:relative; }
.tier[data-picked="true"]{ background:#FFFBEA; box-shadow:6px 6px 0 var(--ink); }
.price{ font-size:1.5rem; font-weight:800; }
.price small{ font-size:.9rem; color:var(--slate); font-weight:700; }
.ribbon{ position:absolute; top:-14px; right:16px; }
.summary td, .summary th{ padding:10px 0; border-bottom:1px dashed var(--skyline); text-align:left; }
.summary td:last-child, .summary th:last-child{ text-align:right; font-weight:800; }
.tbl{ width:100%; border-collapse:collapse; font-size:.92rem; }
.tbl th{ text-align:left; font-size:.8rem; color:var(--slate); font-weight:800; padding:8px 10px; border-bottom:2px solid var(--line2); }
.tbl td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
.tblwrap{ overflow-x:auto; }

/* program library */
.filters{ display:flex; flex-wrap:wrap; gap:14px 18px; align-items:flex-end; margin-bottom:22px; }
.filters .field{ margin:0; min-width:170px; }
.prog{ display:flex; flex-direction:column; gap:10px; }
.prog h2{ font-size:1.1rem; }
.steamm{ display:flex; gap:4px; }
.steamm span{ width:26px; height:26px; border-radius:7px; display:grid; place-items:center; font-weight:800; font-size:.78rem; border:1.5px solid var(--line2); color:#7C868D; background:#fff; }
.steamm span.on{ background:var(--sun); border:2px solid var(--ink); color:var(--ink); }
.faces{ display:flex; padding-left:8px; }
.faces .ring{ width:40px; height:40px; margin-left:-8px; box-shadow:none; border-width:2.5px; }
.prog .btn{ align-self:flex-start; margin-top:auto; }

/* clips (simulated short videos) */
.clip{ border:3px solid var(--ink); border-radius:16px; overflow:hidden; background:linear-gradient(180deg,#FFF4D6 0%,#FBE3C3 100%); }
.clip__stage{ position:relative; aspect-ratio:16/9; container-type:inline-size; background:linear-gradient(0deg,#E9C79A 0 24%,transparent 24%); }
.clip__who{ position:absolute; left:50%; top:9%; transform:translateX(-50%); text-align:center; }
.clip__who .ring{ display:block; width:26cqw; height:26cqw; margin:0 auto; }
.clip__who b{ display:inline-block; margin-top:3cqw; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:2px 12px; font-size:max(.8rem,2.6cqw); }
.clip__cap{ position:absolute; left:50%; bottom:5%; transform:translateX(-50%); width:88%; background:rgba(30,34,38,.88); color:#fff; border-radius:10px; padding:8px 12px; font-size:max(.85rem,3.1cqw); font-weight:700; text-align:center; }
.clip__tag{ position:absolute; top:10px; left:10px; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:800; }
.clip__bar{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:#fff; border-top:3px solid var(--ink); }
.clip__bar .track{ flex:1; height:8px; border-radius:999px; background:#E4ECF1; border:1.5px solid var(--line2); overflow:hidden; }
.clip__bar .track i{ display:block; height:100%; width:0; background:var(--cyan); }
.clip__bar span{ font-size:.82rem; font-weight:700; color:var(--slate); white-space:nowrap; }
.ibtn{ width:44px; height:44px; display:grid; place-items:center; border:2.5px solid var(--ink); border-radius:999px; background:#fff; box-shadow:2px 2px 0 var(--ink); flex:none; padding:0; }
.ibtn svg{ width:20px; height:20px; }
.ibtn--play{ width:52px; height:52px; background:var(--cyan); color:#fff; }

/* the session player stage */
.stage{ position:relative; aspect-ratio:16/9; border:3px solid var(--ink); border-radius:18px; overflow:hidden; container-type:inline-size;
  background:linear-gradient(180deg,#FFF4D6 0%,#FBE3C3 100%); }
.scene{ position:absolute; inset:0; }
.scene--1{ background:linear-gradient(0deg,#E9C79A 0 26%,transparent 26%), linear-gradient(180deg,#FFF4D6 0%,#FBE3C3 100%); }
.scene--2{ background:linear-gradient(0deg,#BFD9E8 0 26%,transparent 26%), linear-gradient(180deg,#EEF7FC 0%,#D8ECF7 100%); }
.scene--3{ background:radial-gradient(rgba(108,62,140,.16) 2px, transparent 2.4px) 0 0/18px 18px, linear-gradient(0deg,#D9B98C 0 26%,transparent 26%), linear-gradient(180deg,#F6EEDC 0%,#EBDDC2 100%); }
.scene--4{ background:linear-gradient(0deg,#CDBBE0 0 26%,transparent 26%), linear-gradient(180deg,#F5EFFA 0%,#E6DAF2 100%); }
.scene--5{ background:linear-gradient(0deg,#A9D8C9 0 26%,transparent 26%), linear-gradient(180deg,#EFFAF6 0%,#D6F0E7 100%); }
.stage__chap{ position:absolute; top:14px; left:14px; background:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:5px 12px; font-size:max(.78rem,1.6cqw); font-weight:800; z-index:2; }
.stage__off{ position:absolute; top:12px; right:12px; z-index:2; display:inline-flex; align-items:center; gap:6px; min-height:44px; background:rgba(255,255,255,.9); border:2px solid var(--ink); border-radius:999px; padding:0 12px; font-size:.78rem; font-weight:700; }
.stage__off svg{ width:14px; height:14px; }
.stage__off[aria-pressed="true"]{ background:#E3F3DC; }
.host{ position:absolute; left:50%; top:11%; transform:translateX(-50%); text-align:center; }
.host__pic{ width:21cqw; height:21cqw; margin:0 auto; border-radius:50%; border:4px solid var(--ink); box-shadow:0 0 0 1cqw var(--ringc,#8FDDBE), .5cqw .5cqw 0 1cqw var(--ink); overflow:hidden; background:#fff; }
.host__pic img{ width:100%; height:100%; object-fit:cover; display:block; }
/* when the full-body pose PNGs are switched on (USE_POSES), a standing figure replaces the circle */
.host__figure{ display:block; height:50cqw; max-height:none; width:auto; margin:0 auto -2cqw; filter:drop-shadow(.6cqw .6cqw 0 rgba(30,34,38,.25)); }
.host--figure{ top:auto; bottom:22%; }
.host__name{ display:inline-block; margin-top:2cqw; background:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:4px 14px; font-weight:800; font-size:max(.85rem,1.9cqw); }
.host__name small{ color:var(--slate); font-weight:700; margin-left:4px; font-size:.85em; }
.side-hosts{ position:absolute; bottom:24%; display:flex; gap:10px; }
.side-hosts--l{ left:3%; } .side-hosts--r{ right:3%; }
.mini{ width:9cqw; height:9cqw; border-radius:50%; border:3px solid var(--ink); overflow:hidden; background:#fff; opacity:.8; }
.mini img{ width:100%; height:100%; object-fit:cover; display:block; }
.hosts-all{ position:absolute; left:0; right:0; top:12%; display:flex; justify-content:center; gap:4cqw; }
.hosts-all .host__pic{ width:15cqw; height:15cqw; }
.hosts-all figure{ margin:0; text-align:center; }
.hosts-all figcaption{ margin-top:2cqw; font-weight:800; font-size:max(.8rem,1.7cqw); }
.caption{ position:absolute; left:50%; bottom:3.2%; transform:translateX(-50%); width:min(86%,820px); background:rgba(30,34,38,.88); color:#fff;
  border-radius:12px; padding:1.4cqw 2cqw; font-size:max(.95rem,2.4cqw); font-weight:700; line-height:1.35; text-align:center; z-index:2; }
.intro{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6cqw; text-align:center; padding:4cqw; }
.intro .faces .ring{ width:11cqw; height:11cqw; margin-left:-2cqw; border-width:3px; }
.intro__title{ font-size:max(1.3rem,4.4cqw); font-weight:800; }
.intro__sub{ font-size:max(.9rem,1.9cqw); font-weight:700; color:#3E464C; }
.pausecard{ position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; padding:3cqw;
  background-image:var(--halftone), linear-gradient(180deg,rgba(207,230,244,.97) 0%,rgba(241,247,250,.97) 100%); background-size:7px 7px,100% 100%; overflow:auto; }
.pausecard__in{ width:min(100%,760px); background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink); padding:2.4cqw 3cqw; }
.pausecard__top{ display:flex; align-items:center; gap:14px; }
.pausecard__top .ring{ width:max(48px,8cqw); height:max(48px,8cqw); flex:none; }
.pausecard__label{ display:inline-block; background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:3px 12px; font-weight:800; font-size:max(.8rem,1.6cqw); }
.pausecard__say{ margin-top:4px; font-weight:700; color:var(--slate); font-size:max(.85rem,1.6cqw); }
.pausecard__prompt{ margin-top:1.8cqw; font-size:max(1.05rem,2.9cqw); font-weight:800; line-height:1.25; }
.timer{ display:flex; align-items:center; gap:14px; margin-top:1.8cqw; }
.timer__num{ font-size:max(1.6rem,5cqw); font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
.pausecard--make .timer__num{ font-size:max(2.2rem,8.5cqw); color:var(--cyan-deep); }
.timer__bar{ flex:1; height:12px; border-radius:999px; background:#E4ECF1; border:1.5px solid var(--line2); overflow:hidden; }
.timer__bar i{ display:block; height:100%; background:var(--leaf); }
.timeup{ margin-top:8px; font-weight:800; color:var(--plum); }
.pausecard__btns{ display:flex; flex-wrap:wrap; gap:10px; margin-top:1.8cqw; }
.bar{ height:8px; border-radius:999px; background:#E4ECF1; margin:14px 0 0; overflow:hidden; border:1.5px solid var(--line2); }
.bar i{ display:block; height:100%; width:0; background:var(--cyan); }
.ctl{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
.ctl__left, .ctl__right{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.time{ font-size:.9rem; font-weight:700; color:var(--slate); margin-left:6px; font-variant-numeric:tabular-nums; }
.rail{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.chip{ display:inline-flex; align-items:center; gap:7px; min-height:44px; border:2px solid var(--line2); border-radius:999px; padding:0 14px; font-size:.86rem; font-weight:700; background:#fff; color:#3E464C; }
.chip b{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.75rem; background:var(--sky); border:1.5px solid var(--skyline); }
.chip b svg{ width:13px; height:13px; }
.chip--done{ border-color:var(--leaf); color:var(--leaf); }
.chip--done b{ background:#E3F3DC; border-color:var(--leaf); }
.chip--now{ border:2.5px solid var(--ink); background:var(--sun); color:var(--ink); box-shadow:2px 2px 0 var(--ink); }
.chip--now b{ background:#fff; border-color:var(--ink); }
.only-proj{ display:none !important; }
/* the facilitator's panel */

function paintPlayer(force) {
  const stage = $("#stage"); if (!stage) return;
  const key = [P.ch, P.line, P.phase, P.playing, P.timerOn, P.timeUp, S.captions, S.offline, S.mode, countLabel()].join("|");
  if (force || key !== UI.key) {
    UI.key = key;
    const ae = document.activeElement, fid = ae && ae.id;
    stage.innerHTML = stageHTML();
    $("#rail").innerHTML = railHTML();
    $("#sidePanel").innerHTML = panelHTML();
    const pb = $("#playBtn");
    const lbl = P.phase === "pause" ? "Resume video" : P.phase === "done" ? "Play again" : P.playing ? "Pause" : "Play";
    pb.innerHTML = (P.playing && P.phase === "video") ? I.pause : I.play; pb.setAttribute("aria-label", lbl);
    $("#countLbl").textContent = countLabel();
    const again = fid && document.getElementById(fid);
    if (again && document.activeElement !== again) again.focus({ preventScroll: true });
    if (P.phase === "video") { const l = curLines()[Math.min(P.line, curLines().length - 1)]; $("#capLive").textContent = HOST_ART[speakerOf(l) === "all" ? "chike" : speakerOf(l)].name + ": " + l.text; }
    if (UI.tour) tourPlace();
  }
  const pos = chapterPos();
  $("#pbar").style.width = Math.round(pos.frac * 100) + "%";
  $("#ptime").textContent = fmtClock(pos.cur) + " / " + fmtClock(pos.total);
  const tn = $("#timerNum"); if (tn) tn.textContent = fmtClock(P.left);
  const tb = $("#timerBar"); if (tb) tb.style.width = (P.total ? Math.round(100 * P.left / P.total) : 0) + "%";
}
function enterPause() {
  const ch = lesson().chapters[P.ch];
  P.done[P.ch] = true; P.phase = "pause"; P.line = curLines().length - 1; P.t = 0;
  P.total = P.left = pauseMinutes(ch.pause, S.mode) * 60; P.timerOn = true; P.timeUp = false;
  $("#capLive").textContent = "Paused for " + ch.pause.label + ". " + ch.pause.prompt;
}
function endChapter() {
  if (lesson().chapters[P.ch].pause) { enterPause(); return; }
  P.done[P.ch] = true; P.phase = "done"; P.playing = false; sess().completed = true; save();
  $("#capLive").textContent = "The session video is done.";
}
function jumpTo(i) {
  P.ch = i; P.line = 0; P.t = 0; P.phase = "video"; P.timerOn = false; P.timeUp = false; P.playing = true;
  for (let j = 0; j < 5; j++) P.done[j] = j < i;
}
function resumeVideo() { if (P.ch < 4) jumpTo(P.ch + 1); }
function playerPlay() {
  if (P.phase === "ready") { P.phase = "video"; P.playing = true; }
  else if (P.phase === "video") P.playing = !P.playing;
  else if (P.phase === "pause") resumeVideo();
  else { P = freshPlayer(); P.phase = "video"; P.playing = true; }
  paintPlayer(true);
}
function back10() {
  if (P.phase === "ready") return;
  if (P.phase !== "video") { P.phase = "video"; P.timerOn = false; P.timeUp = false; P.line = Math.max(0, curLines().length - 1); P.t = 0; P.playing = true; P.done[P.ch] = false; }
  else { const pos = Math.max(0, P.line * LINE_MS + P.t - LINE_MS); P.line = Math.floor(pos / LINE_MS); P.t = pos % LINE_MS; }
  paintPlayer(true);
}
function nextChapter() {
  if (P.phase === "done") return;
  P.done[P.ch] = true;
  if (P.ch < 4) jumpTo(P.ch + 1); else endChapter();
  paintPlayer(true);
}
function tickPlayer(d) {
  if (P.phase === "video" && P.playing) {
    P.t += d * S.speed;
    while (P.t >= LINE_MS && P.phase === "video") { P.t -= LINE_MS; P.line++; if (P.line >= curLines().length) endChapter(); }
  } else if (P.phase === "pause" && P.timerOn && P.left > 0) {
    P.left = Math.max(0, P.left - d / 1000 * TIMER_RATE);
    if (P.left === 0) { P.timerOn = false; P.timeUp = true; if (S.screen === "s12") toast("Time is up. Resume the video when the room is ready."); }
  }
  if (S.screen === "s12") paintPlayer(false);
}

  else if (r.right + gap + tw < vw - 8) { left = r.right + gap; top = r.top; }
  else if (r.left - gap - tw > 8) { left = r.left - gap - tw; top = r.top; }
  else { left = vw - tw - 16; top = vh - th - 16; }
  tip.style.left = Math.max(16, Math.min(left, vw - tw - 16)) + "px";
  tip.style.top = Math.max(16, Math.min(top, vh - th - 16)) + "px";
}
window.addEventListener("resize", () => tourPlace());
window.addEventListener("scroll", () => tourPlace(), { passive: true });

/* keyboard: tour arrows and Esc, focus traps for the tour tip and drawers */
document.addEventListener("keydown", (e) => {
  const T = UI.tour, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === "Tab") {
    const box = (T && !T.paused && !T.waiting && $("#tourTip")) || (UI.drawer && $("#drawer"));
    if (!box) return;
    const f = Array.prototype.filter.call(box.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"), (x) => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (T && !T.paused) {
    if (e.key === "Escape") { e.preventDefault(); tourExit(); return; }
    if (!typing && !T.waiting && e.key === "ArrowRight") { e.preventDefault(); tourNext(); return; }
    if (!typing && !T.waiting && e.key === "ArrowLeft") { e.preventDefault(); if (T.i > 0) tourShow(T.i - 1); return; }
  }
  if (e.key === "Escape") {
    if (UI.drawer) { e.preventDefault(); closeDrawer(); return; }
    if (UI.projector) { e.preventDefault(); setProjector(false); }
  }
});

/* one clock for the player and the clips */
let last = performance.now();
setInterval(() => { const now = performance.now(), d = Math.min(500, now - last); last = now; tickPlayer(d); tickClip(d); }, 100);
render();
</script>
