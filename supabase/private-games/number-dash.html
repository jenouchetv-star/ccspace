<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Runner</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root{ --ink:#fff7ef; --mute:#ffd9c2; --panel:rgba(14,34,70,.66); --line:rgba(255,255,255,.16); --gold:#ffd23f; --cyan:#5ce1ff; --pink:#ff5fa2; --green:#3dff9a; --red:#ff5a6e; }
  html, body { margin:0; height:100%; background:#8fd3ff; color:var(--ink); font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; touch-action:none; }
  #stage canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; inset:0; pointer-events:none; }
  .hud .tap { pointer-events:auto; }
  .stat { position:absolute; top:max(14px, env(safe-area-inset-top)); display:flex; gap:10px; }
  .stat--left { left:max(16px, env(safe-area-inset-left)); }
  .stat--right { right:max(16px, env(safe-area-inset-right)); }
  .chip { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px);
    font-weight:900; font-size:1.15rem; font-variant-numeric:tabular-nums; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .chip svg { width:22px; height:22px; }
  .chip--streak { color:var(--gold); }
  .chip--streak[hidden] { display:none; }
  .hearts { display:flex; gap:4px; }
  .hearts svg { width:26px; height:26px; transition:transform .25s ease, opacity .25s ease; }
  .hearts svg.gone { opacity:.2; transform:scale(.7); }
  .ask { position:absolute; left:50%; top:max(70px, calc(env(safe-area-inset-top) + 58px)); transform:translateX(-50%) scale(.9); opacity:0; transition:opacity .25s ease, transform .35s cubic-bezier(.3,1.6,.5,1);
    padding:12px 28px 14px; border-radius:24px; background:linear-gradient(180deg, rgba(26,62,128,.92), rgba(14,36,80,.92)); border:2px solid rgba(255,210,63,.6);
    box-shadow:0 0 0 6px rgba(255,210,63,.12), 0 18px 40px rgba(0,0,0,.4); text-align:center; }
  .ask.is-on { opacity:1; transform:translateX(-50%) scale(1); }
  .ask__label { font-size:.85rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  .ask__q { display:flex; align-items:center; justify-content:center; gap:12px; font-size:clamp(2.2rem, 6vw, 3.6rem); font-weight:900; line-height:1.05; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
  .ask__q svg { width:.9em; height:.9em; flex:none; }
  .ask.is-pick { border-color:var(--gold); box-shadow:0 0 0 8px rgba(255,210,63,.25), 0 18px 40px rgba(0,0,0,.4); }
  .ask.is-pick .ask__label { animation:blink .6s ease-in-out infinite alternate; }
  @keyframes blink { to { opacity:.45; } }
  .ask.is-up .ask__q { color:#7dffb8; } .ask.is-down .ask__q { color:#ffb36b; }
  .pop { position:absolute; left:50%; top:42%; transform:translate(-50%, -50%); font-weight:900; font-size:3rem; pointer-events:none; text-shadow:0 4px 18px rgba(0,0,0,.4); animation:pop 1s ease forwards; }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%, -30%) scale(.6); } 15% { opacity:1; transform:translate(-50%, -50%) scale(1.1); } 70% { opacity:1; } 100% { opacity:0; transform:translate(-50%, -90%) scale(1); } }
  .keys { position:absolute; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:8px; flex-wrap:nowrap; white-space:nowrap; justify-content:center; opacity:.9; }
  .key { display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-weight:800; font-size:.9rem; color:var(--mute); }
  .key b { display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 6px; border-radius:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-bottom-width:3px; color:var(--ink); }
  /* super speed: a meter, and on a touchscreen the button to hold */
  .super { position:absolute; right:max(16px, env(safe-area-inset-right)); bottom:max(64px, calc(env(safe-area-inset-bottom) + 58px)); appearance:none; border:0; padding:0; background:none; font:inherit; color:var(--ink); cursor:default; touch-action:none; -webkit-tap-highlight-color:transparent; }
  .super__box { display:flex; align-items:center; gap:10px; padding:10px 16px 10px 12px; border-radius:999px; background:var(--panel); border:2px solid rgba(255,255,255,.18); backdrop-filter:blur(10px); box-shadow:0 8px 24px rgba(0,0,0,.3); transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease; }
  .super svg { width:26px; height:26px; color:var(--cyan); flex:none; }
  .super__text { display:grid; gap:5px; }
  .super__label { font-weight:900; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; }
  .super__bar { display:block; width:120px; height:8px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; }
  .super__fill { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg, #5ce1ff, #ffffff); transform-origin:left center; }
  .super__box.is-ready { border-color:rgba(92,225,255,.7); }
  .super__box.is-on { border-color:#5ce1ff; box-shadow:0 0 0 6px rgba(92,225,255,.22), 0 0 30px rgba(92,225,255,.6); transform:scale(1.05); }
  .super.is-down .super__box { transform:scale(.96); }
  @media (pointer:coarse){ .super { cursor:pointer; bottom:max(20px, env(safe-area-inset-bottom)); } .super__box { padding:14px 20px 14px 16px; } .super svg { width:34px; height:34px; } }
  /* menus */
  .screen { position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 35%, rgba(10,30,70,.12), rgba(8,22,52,.72)); opacity:0; pointer-events:none; transition:opacity .4s ease; }
  .screen.is-on { opacity:1; pointer-events:auto; }
  .card { width:min(940px, 100%); text-align:center; }
  .logo { margin:0; font-size:clamp(3rem, 10vw, 6.4rem); font-weight:900; line-height:.92; letter-spacing:-.02em;
    background:linear-gradient(180deg, #fff 0%, #ffe28a 45%, #ff8a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 0 rgba(20,40,100,.6)) drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
  .tag { margin:14px 0 26px; font-size:clamp(1rem, 2.4vw, 1.3rem); font-weight:800; color:var(--mute); }
  .levels { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:10px; }
  .lvl { appearance:none; text-align:center; cursor:pointer; padding:14px 6px; border-radius:18px; font-size:1.5rem; font-weight:900; line-height:1; color:var(--ink); font-family:inherit;
    background:linear-gradient(180deg, rgba(30,70,140,.9), rgba(16,40,88,.92)); border:2px solid rgba(255,255,255,.14); box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .18s cubic-bezier(.3,1.6,.5,1), border-color .18s ease, box-shadow .18s ease; }
  .lvl:hover, .lvl:focus-visible, .lvl.is-focus { transform:translateY(-6px) scale(1.03); border-color:var(--gold); box-shadow:0 0 0 5px rgba(255,210,63,.18), 0 18px 40px rgba(0,0,0,.45); outline:none; }
  .hint { margin-top:22px; font-weight:800; color:var(--mute); font-size:1rem; }
  .big { font-size:clamp(2.6rem, 8vw, 4.4rem); font-weight:900; margin:0; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
  .btn { appearance:none; cursor:pointer; font:inherit; font-weight:900; font-size:1.15rem; padding:14px 26px; border-radius:999px; border:2px solid rgba(255,255,255,.2); color:var(--ink);
    background:rgba(255,255,255,.08); transition:transform .15s cubic-bezier(.3,1.6,.5,1), border-color .15s ease, background .15s ease; }
  .btn--go { background:linear-gradient(180deg, #ffb13d, #ff6a1f); border-color:rgba(255,255,255,.35); box-shadow:0 6px 0 #a33c08, 0 14px 30px rgba(0,0,0,.35); }
  .btn:hover, .btn:focus-visible, .btn.is-focus { transform:scale(1.06); border-color:var(--gold); outline:none; }
  .results { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; margin:22px auto 0; max-width:620px; }
  .res { padding:14px; border-radius:18px; background:var(--panel); border:1px solid var(--line); }
  .res b { display:block; font-size:2rem; font-weight:900; font-variant-numeric:tabular-nums; }
  .res span { font-size:.85rem; font-weight:800; color:var(--mute); letter-spacing:.06em; text-transform:uppercase; }
  .count { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; font-size:clamp(5rem, 20vw, 11rem); font-weight:900; color:#fff; text-shadow:0 10px 40px rgba(255,120,60,.7); }
  .count span { animation:countin .9s ease forwards; }
  @keyframes countin { 0% { opacity:0; transform:scale(1.8); } 25% { opacity:1; transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:scale(.8); } }
  .icon-btn { position:absolute; top:max(14px, env(safe-area-inset-top)); right:max(16px, env(safe-area-inset-right)); }
  #title { place-items:center start; padding-left:clamp(24px, 6vw, 96px); }
  #title .card { width:min(600px, 100%); text-align:left; }
  .step { margin:18px 0 10px; font-size:.95rem; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  .runners { display:flex; gap:10px; flex-wrap:wrap; }
  .levels--pick { max-width:620px; margin:0 auto; }
  .lvl.is-on { border-color:var(--gold); background:linear-gradient(180deg, rgba(60,110,200,.95), rgba(30,70,150,.95)); }
  .grade-chip { appearance:none; cursor:pointer; color:var(--ink); font:inherit; font-weight:900; font-size:1rem; gap:6px; padding:8px 12px 8px 16px; }
  .grade-chip svg { width:18px; height:18px; }
  .grade-chip:hover, .grade-chip:focus-visible { border-color:var(--gold); outline:none; }
  .who { appearance:none; cursor:pointer; font:inherit; font-weight:900; font-size:1.15rem; color:var(--ink); display:flex; align-items:center; gap:10px; padding:10px 18px 10px 10px; border-radius:999px;
    background:rgba(16,40,88,.88); border:2px solid rgba(255,255,255,.16); transition:transform .15s cubic-bezier(.3,1.6,.5,1), border-color .15s ease; }
  .who__face { width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.7); object-fit:cover; object-position:50% 18%; flex:none; }
  .who.is-on { border-color:var(--gold); background:rgba(34,84,166,.95); box-shadow:0 0 0 5px rgba(255,210,63,.16); }
  .who:hover, .who:focus-visible { transform:scale(1.06); border-color:var(--gold); outline:none; }
  #title .levels { grid-template-columns:repeat(7, minmax(0, 1fr)); gap:10px; }
  @media (max-aspect-ratio: 11/10){ #title { place-items:end center; padding:24px 16px 28px; } #title .card { text-align:center; } .runners { justify-content:center; } #title .logo { font-size:clamp(2.4rem, 11vw, 4rem); } #title .levels { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  @media (max-width:760px){ .levels { grid-template-columns:repeat(4, minmax(0, 1fr)); } .keys { display:none; } }
  @media (max-height:520px){ .tag { margin:6px 0 12px; } .lvl { padding:10px 6px; font-size:1.25rem; } .ask { top:58px; padding:6px 20px 8px; } }
  @media (prefers-reduced-motion: reduce){ * { animation-duration:.01ms !important; transition:none !important; } }
</style>

<body>
<div id="stage" aria-label="Math Runner. Grab coins and run through the door that leaves you the most."></div>
<div class="hud" id="hud" hidden>
  <div class="stat stat--left">
    <div class="chip chip--streak" id="streak-chip" hidden aria-label="Right answers in a row"><svg viewBox="0 0 24 24" fill="#ffd23f"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg><span id="streak">0</span></div>
  </div>
  <div class="stat stat--right"><button class="chip grade-chip tap" id="grade-chip" type="button" data-act="grade" aria-label="Change grade"><span id="grade-name">K</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="chip hearts" id="hearts" aria-label="Hearts"></div></div>
  <div class="ask is-on" id="ask"><div class="ask__label" id="ask-label">Your coins</div><div class="ask__q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffc542" stroke="#fff3c4" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#c98a12" stroke-width="2"/></svg><span id="ask-q" aria-live="polite">0</span></div></div>

    <span class="super__box" id="super">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2z" fill="currentColor"/></svg>
      <span class="super__text"><span class="super__label">Super speed</span><span class="super__bar"><span class="super__fill" id="super-fill"></span></span></span>
    </span>
  </button>
</div>
<div class="screen is-on" id="title">
  <div class="card">
    <h1 class="logo">Math<br>Runner</h1>
    <p class="tag">Grab coins. Pick the door that leaves you the most.</p>
    <p class="step">Who's running?</p>
    <div class="runners" id="runners"></div>

</div>

  <div class="card"><p class="big">Paused</p><div class="row"><button class="btn btn--go" data-act="resume">Keep running</button><button class="btn" data-act="sound" id="sound-btn">Sound on</button><button class="btn" data-act="quit">Change runner</button></div><p class="step">Change grade</p><div class="levels levels--pick" id="pause-levels"></div></div>
</div>

  <div class="card">
    <p class="big" id="over-title">Great run!</p>
    <div class="results">
      <div class="res"><b id="r-score">0</b><span>Coins</span></div>
      <div class="res"><b id="r-right">0</b><span>Best doors</span></div>
      <div class="res"><b id="r-best">0</b><span>Most coins</span></div>
    </div>
    <div class="row"><button class="btn btn--go" data-act="again">Run again</button><button class="btn" data-act="quit">Change runner</button></div><p class="step">Change grade</p><div class="levels levels--pick" id="over-levels"></div>
  </div>
</div>
<div class="count" id="count" aria-live="assertive"></div>
<script type="module">
import * as THREE from "three";
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

/*LOGIC-START*/
/* The rules of Math Runner: plain numbers, no drawing, so they can be tested on their own. */
const LEVELS = [
  { id: "k",  short: "K",   title: "Kindergarten" },
  { id: "g1", short: "1st", title: "1st grade" },
  { id: "g2", short: "2nd", title: "2nd grade" },
  { id: "g3", short: "3rd", title: "3rd grade" },
  { id: "g4", short: "4th", title: "4th grade" },
  { id: "g5", short: "5th", title: "5th grade" },
  { id: "g6", short: "6th", title: "6th grade" }
];
/* the three lanes, left to right, across the track */
const LANES = [-1.7, 0, 1.7];
const START_SPEED = 18, MAX_SPEED = 32;

/** A small seeded random number generator (mulberry32), so a run can be repeated. */
function makeRng(seed){
  let s = seed | 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const int = (rand, lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
function shuffle(rand, a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* The doors. Each gate has three doors, one per lane, like "+8", "−10", "×3" or "÷4". Running through one
   changes the coins the runner carries, so the math is a choice ("12 coins: is ×3 or +8 better?"), not a sum
   to work out. [lowest, highest] number on each kind of door, per grade; step rounds the + and − numbers. */
const DOOR_RULES = {
  k:  { add: [1, 5],    sub: [1, 5],    step: 1 },
  g1: { add: [2, 10],   sub: [2, 10],   step: 1 },
  g2: { add: [5, 20],   sub: [5, 20],   mul: [2, 2],  step: 1 },
  g3: { add: [5, 30],   sub: [5, 30],   mul: [2, 5],  div: [2, 3],  step: 1 },
  g4: { add: [10, 50],  sub: [10, 50],  mul: [2, 9],  div: [2, 5],  step: 5 },
  g5: { add: [20, 100], sub: [20, 100], mul: [2, 10], div: [2, 10], step: 5 },
  g6: { add: [50, 200], sub: [50, 200], mul: [2, 12], div: [2, 12], step: 10 }
};
/* the most coins the bag holds, so the numbers stay ones each grade can think about */
const BAG_MAX = { k: 50, g1: 120, g2: 500, g3: 1000, g4: 9999, g5: 9999, g6: 9999 };
function bagMax(levelId){ return BAG_MAX[levelId] || 9999; }
function doorLabel(d){ return d.op + d.n; }
/** The coins after running through a door: never below zero, always whole (sharing rounds down), never past
    the bag's size when a grade is given. */
function applyDoor(coins, d, levelId){
  let c = d.op === "+" ? coins + d.n : d.op === "−" ? coins - d.n : d.op === "×" ? coins * d.n : Math.floor(coins / d.n);
  c = Math.max(0, c);
  return levelId ? Math.min(bagMax(levelId), c) : c;
}
/** The doors (by lane) that leave the most coins. */
function bestDoors(coins, doors){
  const after = doors.map(d => applyDoor(coins, d));
  const top = Math.max(...after);
  return after.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
}
/** Three different doors for a gate, in random lanes: at least one that adds and one that takes away. */
function makeDoors(levelId, rand){
  const R = DOOR_RULES[levelId] || DOOR_RULES.k;
  const num = (lo, hi, step) => { const s = step || 1; return Math.max(lo, Math.min(hi, Math.round(int(rand, lo, hi) / s) * s)) || lo; };
  const door = (op) => op === "+" ? { op, n: num(R.add[0], R.add[1], R.step) } : op === "−" ? { op, n: num(R.sub[0], R.sub[1], R.step) }
    : op === "×" ? { op, n: int(rand, R.mul[0], R.mul[1]) } : { op, n: int(rand, R.div[0], R.div[1]) };
  const gain = () => R.mul && rand() < 0.5 ? "×" : "+";
  const loss = () => R.div && rand() < 0.45 ? "÷" : "−";
  const any = () => { const ops = ["+", "−"].concat(R.mul ? ["×"] : [], R.div ? ["÷"] : []); return ops[int(rand, 0, ops.length - 1)]; };
  for (let tries = 0; tries < 30; tries++){
    const doors = [door(gain()), door(loss()), door(any())];
    if (new Set(doors.map(doorLabel)).size === 3) return shuffle(rand, doors);
  }
  /* very small grades can run out of different numbers: fall back to a set that is always different */
  return shuffle(rand, [{ op: "+", n: R.add[1] }, { op: "−", n: R.sub[0] }, { op: "+", n: R.add[0] }]);
}

/** One row of the track: what stands in each lane. difficulty runs from 0 (the start) to 1 (fast). Walls block
    a lane and must be gone around; hurdles are jumped, bars are slid under; there is never a wall in every lane. */
function makeRow(rand, difficulty){
  const d = Math.max(0, Math.min(1, difficulty));
  const pWall = d < 0.15 ? 0 : 0.1 + 0.22 * d, pHurdle = 0.16 + 0.12 * d, pBar = d < 0.1 ? 0 : 0.1 + 0.1 * d, pCoin = 0.42;
  const row = [];
  for (let lane = 0; lane < 3; lane++){
    const x = rand();
    if (x < pWall) row.push({ type: "wall", lane });
    else if (x < pWall + pHurdle) row.push({ type: "hurdle", lane });
    else if (x < pWall + pHurdle + pBar) row.push({ type: "bar", lane });
    else if (x < pWall + pHurdle + pBar + pCoin) row.push({ type: "coin", lane });
  }
  const walls = row.filter(o => o.type === "wall");
  if (walls.length === 3) walls[int(rand, 0, 2)].type = "coin";
  return row;
}

/** What happens when the runner meets something in a lane: "collect" (a coin), "hit" or "pass". The runner is
    { lane, y (height of the feet), sliding }. */
function hitTest(item, runner){
  if (item.lane !== runner.lane) return "pass";
  if (item.type === "coin") return "collect";
  if (item.type === "hurdle") return runner.y >= 0.5 ? "pass" : "hit";
  if (item.type === "bar") return runner.sliding ? "pass" : "hit";
  if (item.type === "wall") return "hit";
  return "pass";
}
/** How fast the track goes after this many meters: calm at first, then a little faster, up to a top speed. */
function speedAt(distance){ return Math.min(MAX_SPEED, START_SPEED + distance / 120); }
/* super speed: hold to run much faster. The meter holds 3 seconds of it, refills a quarter second each second,
   and each coin adds a little more. */
const SUPER = { full: 3, mult: 1.7, refill: 0.25, coin: 0.15 };
function superStep(meter, holding, dt){
  if (holding && meter > 0) return { meter: Math.max(0, meter - dt), on: true };
  return { meter: Math.min(SUPER.full, meter + SUPER.refill * dt), on: false };
}
function superCoin(meter){ return Math.min(SUPER.full, meter + SUPER.coin); }

  function jump(){ if (S.y > 0.05) return false; S.vy = 9; S.slide = 0; return true; }
  function slide(){ if (S.y > 0.05){ S.vy = -16; } S.slide = 0.75; return true; }
  function move(d){ const n = Math.max(0, Math.min(2, S.lane + d)); if (n === S.lane) return false; S.lane = n; return true; }
  function reset(){ Object.assign(S, { lane: 1, x: 0, y: 0, vy: 0, slide: 0, stumble: 0, invuln: 0 }); }
  const ease = (cur, want, k, dt) => cur + (want - cur) * Math.min(1, dt * k);
  function update(dt, speed, running, facingCamera){
    S.t += dt * (running ? Math.min(speed, 32) / 14 : 0.6);   /* the stride speeds up with the track, up to a point, so it never flickers */
    S.x += (LANES[S.lane] - S.x) * Math.min(1, dt * 12);
    if (S.y > 0 || S.vy > 0){ S.vy -= 27 * dt; S.y = Math.max(0, S.y + S.vy * dt); if (S.y === 0) S.vy = 0; }
    S.slide = Math.max(0, S.slide - dt); S.stumble = Math.max(0, S.stumble - dt); S.invuln = Math.max(0, S.invuln - dt);
    S.face = ease(S.face, facingCamera ? Math.PI : 0, 5, dt);
    root.position.set(S.x, S.y, 0);

      const c = card, air = S.y > 0.05, sliding = S.slide > 0;
      root.rotation.set(0, 0, 0);
      const f = running && !air ? Math.floor(S.t * c.run.fps) % c.run.frames : running ? 3 : Math.floor(S.t * 10) % c.run.frames;
      showFrame(c, f);
      const lean = (S.x - LANES[S.lane]) * 0.16 + (S.stumble > 0 ? Math.sin(S.stumble * 40) * 0.2 : 0);
      c.sp.material.rotation += (lean - c.sp.material.rotation) * Math.min(1, dt * 14);
      const sq = sliding ? 0.55 : 1, w = c.h * c.run.fw / c.run.fh;
      c.sp.scale.y += (c.h * sq - c.sp.scale.y) * Math.min(1, dt * 18);
      c.sp.scale.x = w * (sliding ? 1.18 : 1);
      c.sp.visible = S.invuln > 0 ? Math.floor(S.invuln * 12) % 2 === 0 : true;
      shadow.scale.setScalar(1 / (1 + S.y * 0.6)); shadow.position.y = 0.02 - S.y;

    }
    root.rotation.set(0, S.face, (LANES[S.lane] - S.x) * 0.2);
    const r = rig, air = S.y > 0.05, sliding = S.slide > 0, k = 16;
    const ph = S.t * 7.2, s = Math.sin(ph), c = Math.cos(ph);

      thL = thR = 0.05; shL = shR = -0.1; upL = -0.1; upR = 2.6 + Math.sin(S.t * 6) * 0.35; elL = 0.3; elR = 0.4; lean = 0; bob = Math.sin(S.t * 3) * 0.015;
    } else if (sliding){                   /* a baseball slide: lean back, one leg out front */

    } else {                               /* running: knees lift, arms pump, a little bounce */

      upL = -s * 0.85; upR = s * 0.85; elL = elR = 1.35; lean = -0.16; bob = Math.abs(c) * 0.06;
    }
    if (S.stumble > 0){ lean += Math.sin(S.stumble * 40) * 0.25; }
    r.legL.thigh.rotation.x = ease(r.legL.thigh.rotation.x, thL, k, dt); r.legR.thigh.rotation.x = ease(r.legR.thigh.rotation.x, thR, k, dt);
    r.legL.shin.rotation.x = ease(r.legL.shin.rotation.x, shL, k, dt); r.legR.shin.rotation.x = ease(r.legR.shin.rotation.x, shR, k, dt);
    r.legL.foot.rotation.x = -r.legL.shin.rotation.x * 0.4 - r.legL.thigh.rotation.x * 0.2; r.legR.foot.rotation.x = -r.legR.shin.rotation.x * 0.4 - r.legR.thigh.rotation.x * 0.2;
    r.armL.upper.rotation.x = ease(r.armL.upper.rotation.x, upL, k, dt); r.armR.upper.rotation.x = ease(r.armR.upper.rotation.x, upR, k, dt);
    r.armL.fore.rotation.x = ease(r.armL.fore.rotation.x, elL, k, dt); r.armR.fore.rotation.x = ease(r.armR.fore.rotation.x, elR, k, dt);
    r.armL.upper.rotation.z = -0.12; r.armR.upper.rotation.z = !running ? 0.5 : 0.12;
    r.torso.rotation.x = ease(r.torso.rotation.x, lean, 10, dt);
    r.torso.rotation.y = running && !air && !sliding ? s * 0.12 : 0;
    r.head.rotation.x = -r.torso.rotation.x * 0.6;
    r.hips.position.y = ease(r.hips.position.y, 0.95 + drop + bob, 18, dt);
    if (r.g.userData.tail) r.g.userData.tail.rotation.x = 0.2 + (running ? Math.sin(ph * 2) * 0.25 + 0.3 : Math.sin(S.t * 3) * 0.1);
    r.g.visible = S.invuln > 0 ? Math.floor(S.invuln * 12) % 2 === 0 : true;
    shadow.scale.setScalar(1 / (1 + S.y * 0.6)); shadow.position.y = 0.02 - S.y;
  }
  return { S, root, jump, slide, move, reset, update, laneNow, setLook, get look(){ return lookId; } };
})();

const Fx = (() => {
  const bits = [], box = new THREE.BoxGeometry(1, 1, 1), ball = new THREE.SphereGeometry(1, 8, 6);
  let shake = 0;
  function burst(at, colors, { n = 24, size = 0.08, speed = 4, up = 3, life = 1, geo = box } = {}){
    for (let i = 0; i < n; i++){
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: colors[i % colors.length], transparent: true, userData: { outlineParameters: NO_LINE } }));
      m.scale.setScalar(size * (0.6 + Math.random() * 0.8)); m.position.copy(at);
      const a = Math.random() * Math.PI * 2;
      bits.push({ m, v: new THREE.Vector3(Math.cos(a) * speed * Math.random(), up * (0.5 + Math.random()), Math.sin(a) * speed * Math.random()), spin: new THREE.Vector3(Math.random() * 8, Math.random() * 8, 0), age: 0, life });
      scene.add(m);
    }
  }
  function update(dt, scroll){
    for (let i = bits.length - 1; i >= 0; i--){
      const b = bits[i]; b.age += dt; b.v.y -= 9 * dt;
      b.m.position.addScaledVector(b.v, dt); b.m.position.z += scroll * dt;
      b.m.rotation.x += b.spin.x * dt; b.m.rotation.y += b.spin.y * dt;
      b.m.material.opacity = Math.max(0, 1 - b.age / b.life);
      if (b.age > b.life){ scene.remove(b.m); b.m.material.dispose(); bits.splice(i, 1); }
    }
    shake = Math.max(0, shake - dt * 1.6);
  }
  return { burst, update, shake(v){ if (!REDUCED) shake = Math.max(shake, v); }, get shakeAmt(){ return shake; } };
})();

/* speed lines that streak past when running fast */
const Streaks = (() => {
  const n = 60, pos = new Float32Array(n * 6), geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, userData: { outlineParameters: NO_LINE } });
  const lines = new THREE.LineSegments(geo, m); scene.add(lines);
  const seeds = [];
  for (let i = 0; i < n; i++) seeds.push({ x: (Math.random() - 0.5) * 16, y: Math.random() * 6 - 0.5, z: -Math.random() * 40 });
  function update(dt, speed, on, superOn){
    m.opacity += ((on ? (superOn ? 0.85 : Math.min(1, Math.max(0, (speed - 21) / 8)) * 0.4) : 0) - m.opacity) * Math.min(1, dt * 6);
    m.color.setHex(0xffffff);
    for (let i = 0; i < n; i++){
      const s = seeds[i]; s.z += speed * 2.2 * dt;
      if (s.z > 6){ s.z = -40; s.x = (Math.random() - 0.5) * 16; if (Math.abs(s.x) < 3) s.x += Math.sign(s.x || 1) * 3; }
      pos.set([s.x, s.y, s.z, s.x, s.y, s.z - 1.2 - speed * 0.08], i * 6);
    }
    geo.attributes.position.needsUpdate = true;
  }
  return { update };
})();

/* ======================= sound: effects and a little music, made on the spot ======================= */
/* the soundtrack file: on the site (the game runs inside the site's page, so this path works there and in the preview) */
const MUSIC_URL = "/assets/audio/number-dash-theme.mp3";
const Sfx = (() => {
  let ctx = null, master = null, music = null, on = true, loop = null;
  function wake(){
    if (ctx){ if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
      music = ctx.createGain(); music.gain.value = 0.22; music.connect(master); } catch (_e) { ctx = null; }
  }
  function tone(f, dur, { type = "sine", vol = 0.2, to = null, delay = 0, out = null } = {}){
    if (!ctx || !on) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || master); o.start(t); o.stop(t + dur + 0.03);
  }
  const S = {
    coin: () => { tone(1320, 0.08, { type: "square", vol: 0.06 }); tone(1760, 0.14, { type: "square", vol: 0.06, delay: 0.06 }); },
    jump: () => tone(300, 0.22, { type: "triangle", vol: 0.14, to: 720 }),
    slide: () => tone(500, 0.25, { type: "sawtooth", vol: 0.05, to: 160 }),
    lane: () => tone(620, 0.05, { type: "triangle", vol: 0.06 }),
    right: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, { type: "triangle", vol: 0.13, delay: i * 0.06 })),
    wrong: () => { tone(330, 0.2, { type: "sine", vol: 0.16, to: 247 }); tone(247, 0.3, { type: "sine", vol: 0.14, to: 196, delay: 0.16 }); },
    hit: () => { tone(160, 0.3, { type: "sine", vol: 0.3, to: 70 }); tone(90, 0.2, { type: "square", vol: 0.05 }); },
    heart: () => [784, 988, 1319].forEach((f, i) => tone(f, 0.2, { type: "sine", vol: 0.12, delay: i * 0.08 })),
    beep: () => tone(660, 0.12, { type: "square", vol: 0.08 }),
    door: () => { tone(660, 0.12, { type: "triangle", vol: 0.1 }); tone(880, 0.16, { type: "triangle", vol: 0.1, delay: 0.08 }); },
    go: () => tone(990, 0.35, { type: "square", vol: 0.09 }),
    move: () => tone(520, 0.04, { type: "triangle", vol: 0.05 }),
    pick: () => tone(880, 0.08, { type: "triangle", vol: 0.1 }),
    whoosh: () => { tone(180, 0.45, { type: "sawtooth", vol: 0.07, to: 900 }); tone(360, 0.35, { type: "triangle", vol: 0.08, to: 1400, delay: 0.05 }); },
    smash: () => { tone(220, 0.16, { type: "square", vol: 0.07, to: 90 }); tone(1200, 0.1, { type: "triangle", vol: 0.06, to: 600 }); }
  };
  /* the music: a bouncy bass and a bright arpeggio, scheduled a little ahead */
  const BASS = [45, 45, 52, 52, 50, 50, 48, 52], ARP = [0, 4, 7, 12, 7, 4];
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function startMusic(){
    if (!ctx || loop) return;
    let step = 0, next = ctx.currentTime + 0.05;
    const beat = 60 / 128 / 2;
    loop = setInterval(() => {
      if (!on) { next = ctx.currentTime + 0.05; return; }
      while (next < ctx.currentTime + 0.25){
        const bar = Math.floor(step / 8) % BASS.length, root = BASS[bar];
        const d = next - ctx.currentTime;
        if (step % 2 === 0) tone(hz(root), beat * 1.8, { type: "triangle", vol: 0.5, delay: d, out: music });
        tone(hz(root + 24 + ARP[step % ARP.length]), beat * 0.9, { type: "square", vol: 0.08, delay: d, out: music });
        if (step % 4 === 0) tone(120, 0.08, { type: "sine", vol: 0.4, to: 50, delay: d, out: music });

  const track = new Audio(); track.src = MUSIC_URL; track.loop = true; track.preload = "auto"; track.volume = 0.5;
  let usingTrack = false;
  function startSong(){
    if (usingTrack){ if (on) track.play().catch(() => {}); return; }
    track.play().then(() => { usingTrack = true; stopMusic(); if (!on) track.pause(); }).catch(() => startMusic());
  }
  return { wake, play(n){ wake(); S[n] && S[n](); }, startMusic: startSong, stopMusic, get on(){ return on; },
    set on(v){ on = v; if (usingTrack){ if (v) track.play().catch(() => {}); else track.pause(); } } };
})();

  }

  const prev = Game.best[Game.level] || 0;
  if (Game.coins > prev){ Game.best[Game.level] = Game.coins; saveBest(); }
  $("over-title").textContent = Game.coins > prev && prev > 0 ? "New best!" : Game.right >= 5 ? "Great run!" : "Nice running!";
  $("r-score").textContent = Game.coins; $("r-right").textContent = Game.right + " of " + Game.asked; $("r-best").textContent = Game.best[Game.level] || Game.coins;
  $("ask").classList.remove("is-pick");
  setTimeout(() => { showScreen("over"); focusFirst("over"); }, 900);
}
function pause(){ if (Game.mode !== "run") return; Game.mode = "paused"; paintGrades(); showScreen("paused"); focusFirst("paused"); }
function resume(){ if (Game.mode !== "paused") return; showScreen(null); Game.mode = "run"; }
function toTitle(){ Game.mode = "title"; Things.clear(); Runner.reset(); $("hud").hidden = true; $("ask").classList.remove("is-pick"); buildLevels(); showScreen("title"); focusFirst("title"); }
addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

/* the next row of the track: a gate every few rows, a gentle stretch around each gate */
function spawnRow(z){
  Game.rowCount++;
  const r = Game.rowCount;
  if (r > 2 && r % GATE_EVERY === 0){
    Things.spawn({ type: "gate", doors: makeDoors(Game.level, Game.rand) }, z);
    return;
  }
  const nearGate = (r + 1) % GATE_EVERY === 0 || (r - 1) % GATE_EVERY === 0;
  const difficulty = Math.min(1, Game.distance / 1400);
  const row = nearGate ? [{ type: "coin", lane: Math.floor(Game.rand() * 3) }] : makeRow(Game.rand, difficulty);
  for (const item of row){
    if (item.type === "coin"){ for (let k = 0; k < 3; k++) Things.spawn({ type: "coin", lane: item.lane }, z - k * 1.6); }
    else Things.spawn(item, z);
  }
}

function update(dt){
  const running = Game.mode === "run";
  if (running){
    Game.slowT = Math.max(0, Game.slowT - dt); Game.boostT = Math.max(0, Game.boostT - dt);
    const was = Game.superOn, sup = superStep(Game.superMeter, Game.superHeld, dt);
    Game.superMeter = sup.meter; Game.superOn = sup.on;
    if (sup.on && !was){ Sfx.play("whoosh"); rumble(0.5, 200); Fx.shake(0.12); }
    const target = speedAt(Game.distance) * PACE[Game.level] * (Game.slowT > 0 ? 0.55 : 1) * (Game.boostT > 0 ? 1.25 : 1) * (sup.on ? SUPER.mult : 1);
    Game.speed += (target - Game.speed) * Math.min(1, dt * (sup.on ? 5 : 2.5));
    paintSuper();
  } else if (Game.mode === "title") Game.speed = 0;
  else if (Game.mode === "countdown") Game.speed = 0;
  else Game.speed *= Math.max(0, 1 - dt * 3);
  const sp = Game.mode === "paused" ? 0 : Game.speed, dz = sp * dt;

  /* scroll the world toward the camera */
  for (const t of track){ t.position.z += dz; if (t.position.z > TILE * 2) t.position.z -= TILE * TILES; }
  for (const s of scenery){
    s.position.z += dz * (s.userData.cloud ? 0.35 : 0.6);
    if (s.position.z > 20){ if (s.userData.cloud) s.position.z -= 200; else placeIsland(s, -150 - Math.random() * 20); }
  }
  if (running){
    Game.distance += dz;
    while (Game.distance + 0 >= Game.nextRowAt){ spawnRow(SPAWN_Z); Game.nextRowAt += ROW_GAP; }
  }
  const R = Runner.S, lane = Runner.laneNow();
  for (let i = Things.live.length - 1; i >= 0; i--){
    const t = Things.live[i], before = t.z;
    t.z += dz; t.mesh.position.z = t.z;
    if (t.mesh.userData.spin) t.mesh.userData.spin.rotation.y = Math.sin(performance.now() / 300 + t.z * 0.3) * 0.75;   /* a wobble, so a coin never turns edge-on */
    if (t.type === "gate" && !t.done && t.z > -80 && running && Game.gate !== t){
      Game.gate = t; $("ask-label").textContent = "Pick a door!"; $("ask").classList.add("is-pick");
    }
    if (running && !t.done && before < 0 && t.z >= 0){
      t.done = true;
      if (t.type === "gate") onGate(t, lane);
      else {
        const res = hitTest(t, { lane, y: R.y, sliding: R.slide > 0 });
        if (res === "hit" && Game.superOn){ smash(t); }
        else if (res === "collect"){ Game.coins = Math.min(bagMax(Game.level), Game.coins + 1); Game.superMeter = superCoin(Game.superMeter); Sfx.play("coin"); Fx.burst(new THREE.Vector3(LANES[t.lane], 1, 0), [0xffd23f, 0xfff3c4], { n: 8, size: 0.05, speed: 2, up: 2, life: 0.5 }); t.mesh.visible = false; }
        else if (res === "hit" && R.invuln <= 0) onHit(t);
      }
      paintHud();
    }
    if (t.z > 10){ Things.dispose(t); Things.live.splice(i, 1); }
  }
  Runner.update(dt, Math.max(sp, 6), running || Game.mode === "paused", Game.mode === "title");
  /* the coin count rolls up or down to the new number, so a kid sees it change */
  if (Game.shown !== Game.coins){
    const d = Game.coins - Game.shown, step = Math.max(1, Math.abs(d) * Math.min(1, dt * 7));
    Game.shown = Math.abs(d) <= step ? Game.coins : Game.shown + Math.sign(d) * step;
    $("ask-q").textContent = Math.round(Game.shown);
  }
  Fx.update(dt, sp);
  Streaks.update(dt, sp, running, Game.superOn);
  /* sparks kick up behind the runner's feet at super speed */
  if (Game.superOn && Math.random() < dt * 40) Fx.burst(new THREE.Vector3(R.x + (Math.random() - 0.5) * 0.5, 0.1, 0.3), [0x5ce1ff, 0xffffff, 0xffd23f], { n: 2, size: 0.05, speed: 1.5, up: 1.5, life: 0.35 });

  /* the camera rides behind and above, leaning with the runner, wider when fast */
  const cx = R.x * 0.55, sh = Fx.shakeAmt;
  if (Game.mode === "title"){
    /* the chosen kid stands on the path facing you, a little to the right of the menu (below it on a narrow screen) */
    const a = performance.now() / 5000, wide = innerWidth / innerHeight > 1.1;
    camera.position.set(0.9 + Math.sin(a) * 0.35, 1.75 + Math.sin(a * 1.3) * 0.08, 4.4);
    camera.lookAt(wide ? -1.55 : 0, wide ? 1.25 : 0.55, 0);
  } else {
    camera.position.x += (cx - camera.position.x) * Math.min(1, dt * 5);
    camera.position.y += (4.2 + R.y * 0.3 - camera.position.y) * Math.min(1, dt * 5);
    camera.position.z += ((Game.superOn ? 8.9 : 8) - camera.position.z) * Math.min(1, dt * 4);
    camera.lookAt(R.x * 0.7, 0.8 + R.y * 0.25, -13);
    if (sh > 0){ camera.position.x += (Math.random() - 0.5) * sh; camera.position.y += (Math.random() - 0.5) * sh; }
  }
  const fov = 62 + (running ? Math.min(9, Math.max(0, Game.speed - 18) * 0.8) : 0) + (Game.boostT > 0 ? 3 : 0) + (Game.superOn ? 12 : 0);
  if (Math.abs(camera.fov - fov) > 0.05){ camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
}

function onGate(t, lane){
  const doors = t.doors, door = doors[lane], before = Game.coins;
  const after = applyDoor(before, door, Game.level), best = bestDoors(before, doors);
  Game.asked++; Game.coins = after;
  const panels = t.mesh.userData.panels, at = new THREE.Vector3(LANES[lane], 1.6, 0);
  for (const i of best){ panels[i].curtain.material.color.set(0x3dff9a); panels[i].curtain.material.opacity = 0.5; }
  const ask = $("ask");
  ask.classList.remove("is-pick", "is-up", "is-down"); void ask.offsetWidth;
  ask.classList.add(after >= before ? "is-up" : "is-down");
  setTimeout(() => ask.classList.remove("is-up", "is-down"), 900);
  $("ask-label").textContent = "Your coins";
  if (best.includes(lane)){
    Game.streak++; Game.right++; Game.boostT = 1.4;
    Fx.burst(at, [0x3dff9a, 0xffd23f, 0x5ce1ff, 0xff5fa2], { n: 40, size: 0.09, speed: 5, up: 4, life: 1.2 });
    Sfx.play("right"); rumble(0.4, 160);
    pop(doorLabel(door) + "  Best door!", "#3dff9a");
    /* every five best doors in a row earns a heart back (up to five) */
    if (Game.streak % 5 === 0 && Game.hearts < 5){ Game.hearts++; setTimeout(() => { Sfx.play("heart"); pop("+1 heart", "#ff5a6e"); }, 650); }
  } else {
    Game.streak = 0;
    panels[lane].curtain.material.color.set(0xffa040); panels[lane].curtain.material.opacity = 0.45;
    Sfx.play(after < before ? "wrong" : "door"); rumble(0.2, 120);
    /* a less good door just shows which one was best: it never costs a heart */
    pop(doorLabel(door), after < before ? "#ffb36b" : "#ffffff");
    setTimeout(() => pop(doorLabel(doors[best[0]]) + " was best", "#ffd23f"), 550);
  }
  Game.gate = null;
}
function onHit(t){
  Game.hearts--; Game.streak = 0; Game.slowT = 1.2;
  Runner.S.invuln = 1.5; Runner.S.stumble = 0.4;
  Fx.burst(new THREE.Vector3(LANES[t.lane], 0.8, 0), [0xffffff, 0xffc6e8], { n: 14, size: 0.12, speed: 3, up: 2.5, life: 0.6, geo: new THREE.SphereGeometry(1, 6, 4) });
  Fx.shake(0.35); Sfx.play("hit"); rumble(0.9, 260);
  if (t.type !== "coin") t.mesh.visible = false;
  if (Game.hearts <= 0) endRun();
}
/* at super speed the runner bursts straight through things, and it costs nothing */
function smash(t){
  Fx.burst(new THREE.Vector3(LANES[t.lane], 0.8, 0), [0x5ce1ff, 0xffffff, 0xffd23f, 0xff5fa2], { n: 26, size: 0.1, speed: 6, up: 3, life: 0.7, geo: new THREE.BoxGeometry(1, 1, 1) });
  Fx.shake(0.18); Sfx.play("smash"); rumble(0.6, 140);
  t.mesh.visible = false;
}

/* ======================= controls: keys, swipes, a game controller (the mouse only works the menus) ======================= */
function act(name){
  if (Game.mode !== "run") return;
  if (name === "left" && Runner.move(-1)) Sfx.play("lane");
  if (name === "right" && Runner.move(1)) Sfx.play("lane");
  if (name === "jump" && Runner.jump()) Sfx.play("jump");
  if (name === "slide" && Runner.slide()) Sfx.play("slide");
}
const KEYS = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "jump", KeyW: "jump", ArrowDown: "slide", KeyS: "slide" };
addEventListener("keydown", (e) => {
  /* during a run Space is super speed only: it must never press a menu button behind the game */
  if (e.code === "Space" && (Game.mode === "run" || Game.mode === "countdown")) e.preventDefault();
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  Sfx.wake();
  if (Game.mode === "title" || Game.mode === "over" || Game.mode === "paused"){
    if (menuKey(e.code)) e.preventDefault();
    if (e.code === "Escape" && Game.mode === "paused") resume();
    return;
  }
  if (e.code === "Escape" || e.code === "KeyP"){ pause(); return; }
  /* Space, not Shift: tapping Shift five times makes Windows offer Sticky Keys */
  if (e.code === "Space"){ e.preventDefault(); Game.superHeld = true; return; }
  const a = KEYS[e.code]; if (a){ e.preventDefault(); act(a); }
});
/* super speed lasts only while it is held */
addEventListener("keyup", (e) => {
  if (e.code !== "Space") return;
  Game.superHeld = false;
  if (Game.mode === "run" || Game.mode === "countdown") e.preventDefault();
});
addEventListener("blur", () => { Game.superHeld = false; });
{
  const btn = $("super-btn");
  const hold = (v) => (e) => { e.preventDefault(); Sfx.wake(); Game.superHeld = v; btn.classList.toggle("is-down", v); };
  btn.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") return; btn.setPointerCapture(e.pointerId); hold(true)(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, hold(false));
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}
function paintSuper(){
  const f = Game.superMeter / SUPER.full;
  $("super-fill").style.transform = "scaleX(" + f.toFixed(3) + ")";
  $("super").classList.toggle("is-on", Game.superOn);
  $("super").classList.toggle("is-ready", f >= 0.99 && !Game.superOn);
}
/* swipes on a touchscreen; a quick tap jumps */
{
  let start = null;
  const st = $("stage");
  st.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") return; start = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  st.addEventListener("pointerup", (e) => {
    if (!start || e.pointerType === "mouse") return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y; start = null;
    Sfx.wake();
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return act("jump");
    if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? "left" : "right"); else act(dy < 0 ? "jump" : "slide");
  });
}
/* a game controller: the d-pad or stick moves and works the menus, A jumps (or picks), B slides, Start pauses */
const padWas = {};
function pollPad(){
  const gp = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find(Boolean);
  if (!gp) return;
  const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const now = { left: b(14) || ax < -0.55, right: b(15) || ax > 0.55, up: b(12) || ay < -0.55, down: b(13) || ay > 0.55, a: b(0), b: b(1), start: b(9), go: b(7) || b(5) || b(2) };
  const pressed = (k) => now[k] && !padWas[k];
  if (now.go !== !!padWas.go) Game.superHeld = now.go;   /* the right trigger, RB or X: hold for super speed */
  if (Game.mode === "run"){
    if (pressed("left")) act("left"); if (pressed("right")) act("right");
    if (pressed("a") || pressed("up")) act("jump"); if (pressed("b") || pressed("down")) act("slide");
    if (pressed("start")) pause();
  } else if (Game.mode !== "countdown"){
    if (pressed("left")) menuKey("ArrowLeft"); if (pressed("right")) menuKey("ArrowRight");
    if (pressed("up")) menuKey("ArrowUp"); if (pressed("down")) menuKey("ArrowDown");
    if (pressed("a")) menuKey("Enter");
    if (pressed("start") && Game.mode === "paused") resume();
  }
  Object.assign(padWas, now);
  if (!padHinted){ padHinted = true; paintKeys(); }
}
let padHinted = false;
function paintKeys(){
  const k = $("keys");
  k.innerHTML = padHinted
    ? '<span class="key"><b>Stick</b> Change lane</span><span class="key"><b>A</b> Jump</span><span class="key"><b>B</b> Slide</span><span class="key"><b>RT</b> Super speed</span><span class="key"><b>Start</b> Pause</span>'
    : '<span class="key"><b>&larr;</b><b>&rarr;</b> Change lane</span><span class="key"><b>&uarr;</b> Jump</span><span class="key"><b>&darr;</b> Slide</span><span class="key"><b>Space</b> Super speed</span><span class="key"><b>P</b> Pause</span>';
}

/* ======================= menus (keys, controller or mouse) ======================= */
/* each kid's face, from their picture on the site */
const FACES = { chike: "chike", zech: "zech", kiyah: "kylah", corey: "corey", mateo: "mateo", yuna: "yuna", stacey: "stacey", averi: "averi" };
function buildLevels(){
  $("runners").innerHTML = Object.entries(LOOKS).map(([id, L]) => '<button class="who' + (id === Game.runner ? " is-on" : "") + '" data-runner="' + id + '" aria-pressed="' + (id === Game.runner) + '">'
    + '<img class="who__face" src="/assets/characters/' + (FACES[id] || id) + '-thumb.jpg" alt="" width="40" height="40" style="background:#' + L.shirt.toString(16).padStart(6, "0") + '">' + L.name + '</button>').join("");
  $("levels").innerHTML = gradeButtons(false);
  paintGrades();
}
function gradeButtons(mark){
  return LEVELS.map((l) => '<button class="lvl' + (mark && l.id === Game.level ? " is-on" : "") + '" data-level="' + l.id + '" aria-label="' + l.title + '"' + (mark && l.id === Game.level ? ' aria-current="true"' : "") + '>' + l.short + '</button>').join("");
}
/* the grade rows on the pause and end screens, and the chip in the corner */
function paintGrades(){
  $("pause-levels").innerHTML = gradeButtons(true); $("over-levels").innerHTML = gradeButtons(true);
  const l = LEVELS.find((x) => x.id === Game.level) || LEVELS[0];
  $("grade-name").textContent = l.title;
}
function menuButtons(){ const s = document.querySelector(".screen.is-on"); return s ? [...s.querySelectorAll("button")] : []; }
function focusFirst(id){ const b = document.querySelector("#" + id + " .who.is-on") || document.querySelector("#" + id + " button"); if (b) setTimeout(() => b.focus({ preventScroll: true }), 50); }   /* on the title, start on the kid already picked */
function menuKey(code){
  const bs = menuButtons(); if (!bs.length) return false;
  let i = bs.indexOf(document.activeElement);
  if (code === "ArrowRight" || code === "ArrowDown"){ i = (i + 1 + bs.length) % bs.length; bs[i].focus(); Sfx.play("move"); return true; }
  if (code === "ArrowLeft" || code === "ArrowUp"){ i = (i - 1 + bs.length) % bs.length; bs[i].focus(); Sfx.play("move"); return true; }
  if (code === "Enter" || code === "Space"){ (bs[i] || bs[0]).click(); return true; }
  return false;
}
document.addEventListener("click", (e) => {
  const who = e.target.closest("[data-runner]");
  if (who){
    Game.runner = who.dataset.runner; Runner.setLook(Game.runner); Sfx.play("pick");
    try { localStorage.setItem("number-dash-runner", Game.runner); } catch (_e) { /* fine */ }
    for (const b of document.querySelectorAll("[data-runner]")){ const on = b.dataset.runner === Game.runner; b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", String(on)); }
    return;
  }
  const lvl = e.target.closest("[data-level]");
  if (lvl){ Sfx.play("pick"); startRun(lvl.dataset.level); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  Sfx.play("pick");
  const a = b.dataset.act;
  if (a === "resume") resume();
  if (a === "again") startRun(Game.level);
  if (a === "quit") toTitle();
  if (a === "grade"){ pause(); const cur = document.querySelector("#pause-levels .is-on"); if (cur) setTimeout(() => cur.focus({ preventScroll: true }), 60); }
  if (a === "sound"){ Sfx.on = !Sfx.on; b.textContent = Sfx.on ? "Sound on" : "Sound off"; }
});

/* ======================= the loop ======================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pollPad();
  update(dt);
  ink.render(scene, camera);
  requestAnimationFrame(frame);
}
buildLevels(); focusFirst("title");
camera.position.set(0, 3, 6);
requestAnimationFrame(frame);
window.ND = { THREE, Game, Runner, Things, startRun, act, LANES };
</script>
</body>
