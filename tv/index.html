<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play on this TV | Chike's Creative Space</title>
<meta name="robots" content="noindex">
<!-- chikescreativespace.com/tv (owner, 2026-11-26: Play on your TV, part 2; draft docs/mockups/play-on-tv-draft.html).
     Open on a TV's web browser. It shows a 4-letter code; a subscriber's phone types it in the game's On TV panel
     (or scans the QR), and this page then runs that game full screen, sealed like the site's game player, with its
     small saves kept here. Nobody signs in on the TV. The base is the site root so the game's files and its join link
     (new URL(..., document.baseURI)) point at the site. -->
<base href="/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1E2226; --paper:#FAF4E6; --cyan:#1273B0; --label:#235E85; --mute:#4b5259; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#E1F0F9; color:var(--ink); font-family:"Plus Jakarta Sans",system-ui,sans-serif; }
  .pair{ min-height:100%; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:center; gap:5vw; padding:6vh 7vw;
    background:radial-gradient(70vw 60vh at 0% 0%, rgba(143,227,240,.55), transparent 62%), radial-gradient(60vw 50vh at 100% 0%, rgba(255,209,64,.22), transparent 62%), linear-gradient(170deg, #E1F0F9, #FAF4E6 75%); }
  .logo{ height:clamp(48px,7vh,84px); }
  h1{ font-size:clamp(30px,5vw,64px); line-height:1.08; margin:3vh 0 1.5vh; font-weight:800; letter-spacing:-.02em; }
  p{ font-size:clamp(16px,1.9vw,26px); line-height:1.45; margin:0; color:#2b3137; max-width:34ch; }
  .code{ font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(72px,13vw,170px); letter-spacing:.16em; line-height:1; color:var(--cyan); margin:3vh 0 1.5vh; }
  .small{ font-size:clamp(14px,1.4vw,19px); color:var(--mute); }
  .qr{ justify-self:center; background:#fff; border:4px solid var(--ink); border-radius:22px; padding:14px; width:min(34vw,360px); aspect-ratio:1; box-shadow:8px 8px 0 var(--ink); display:grid; place-items:center; }
  .qr img, .qr svg{ width:100%; height:100%; image-rendering:pixelated; }
  .qr + .small{ text-align:center; margin-top:2vh; }
  .side{ display:flex; flex-direction:column; align-items:center; }
  .msg{ min-height:100%; display:grid; place-items:center; text-align:center; padding:8vh 8vw; }
  .msg p{ margin:2vh auto 0; }
  .btn{ display:inline-block; margin-top:3vh; font:inherit; font-weight:800; font-size:clamp(16px,1.8vw,24px); border:4px solid var(--ink); border-radius:999px; background:#F2C230; padding:12px 28px; box-shadow:5px 5px 0 var(--ink); cursor:pointer; color:var(--ink); }
  .btn:focus-visible{ outline:4px solid var(--cyan); outline-offset:5px; }
  .play{ position:fixed; inset:0; background:#132029; }
  .play iframe{ width:100%; height:100%; border:0; display:block; }
  [hidden]{ display:none !important; }
  @media (max-width:760px){ .pair{ grid-template-columns:1fr; text-align:center; } p{ margin-inline:auto; } .qr{ width:min(70vw,300px); } }
</style>
</head>
<body>
<main id="pair" class="pair" hidden>
  <div>
    <img class="logo" src="/assets/brand/logo.webp" alt="Chike's Creative Space">
    <h1>Play on this TV</h1>
    <p>On your phone, open the game in the Subscriber&rsquo;s Portal, tap <b>On TV</b>, and type this code. Or scan the code with your phone.</p>
    <div class="code" id="code" aria-live="polite">&nbsp;</div>
    <p class="small" id="left">&nbsp;</p>
  </div>
  <div class="side"><div class="qr" id="qr" aria-hidden="true"></div><p class="small">Scan with your phone</p></div>
</main>
<main id="note" class="msg" hidden><div><img class="logo" src="/assets/brand/logo.webp" alt="Chike's Creative Space"><h1 id="noteH"></h1><p id="noteP"></p><button class="btn" id="again" type="button">Get a new code</button></div></main>
<div id="play" class="play" hidden></div>
<script>
(function(){
  var URL_ = "https://wdctkfhwygwwulipwnys.supabase.co/functions/v1/tv-link";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkY3RrZmh3eWd3d3VsaXB3bnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTUzNjUsImV4cCI6MjEwMzU5MTM2NX0.5KraVohURHNDx-n0mb6o3egJPf1KkpecBSz8fMRlQcI";
  var $ = function(id){ return document.getElementById(id); };
  var link = null, timer = null, tick = null;
  function call(body){
    return fetch(URL_, { method:"POST", headers:{ "apikey":KEY, "Authorization":"Bearer " + KEY, "Content-Type":"application/json" }, body:JSON.stringify(body) })
      .then(function(r){ return r.json(); });
  }
  function show(id){ ["pair", "note", "play"].forEach(function(k){ $(k).hidden = k !== id; }); }
  function note(h, p){ clearTimeout(timer); clearInterval(tick); $("noteH").textContent = h; $("noteP").textContent = p; show("note"); $("again").focus(); }
  function qr(text){
    var box = $("qr");
    function draw(){ try { var q = window.qrcode(0, "M"); q.addData(text); q.make(); box.innerHTML = q.createSvgTag({ scalable:true, margin:0 }); } catch(e){ box.textContent = ""; } }
    if (window.qrcode) return draw();
    var s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"; s.onload = draw; document.head.appendChild(s);
  }
  function start(){
    clearTimeout(timer); clearInterval(tick);
    call({ action:"new" }).then(function(r){
      if (!r || !r.ok){ note("This TV can’t get a code right now", "Wait a minute, then try again."); return; }
      link = r; $("code").textContent = r.code;
      qr(location.origin + "/grown-ups/tv?code=" + r.code);
      show("pair");
      var end = Date.parse(r.expiresAt);
      var paint = function(){ var s = Math.max(0, Math.round((end - Date.now()) / 1000)); $("left").textContent = "A new code comes in " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "."; if (s <= 0) start(); };
      paint(); tick = setInterval(paint, 1000);
      wait();
    }).catch(function(){ note("This TV isn’t online", "Check the TV’s internet connection, then try again."); });
  }
  function wait(){
    timer = setTimeout(function(){
      call({ action:"wait", code:link.code, secret:link.secret }).then(function(r){
        if (r && r.ok && r.paired){ play(r); return; }
        if (r && r.ok){ wait(); return; }
        start();   /* the code ran out: a fresh one */
      }).catch(function(){ wait(); });
    }, 2500);
  }
  function play(r){
    clearTimeout(timer); clearInterval(tick);
    document.title = r.title + " | Chike's Creative Space";
    var f = document.createElement("iframe");
    f.title = r.title;
    f.setAttribute("sandbox", "allow-scripts allow-popups");
    f.setAttribute("allow", "fullscreen; autoplay; clipboard-write");
    f.srcdoc = r.html;
    $("play").innerHTML = ""; $("play").appendChild(f); show("play");
    f.focus();
  }
  /* the sealed game keeps a small save here, the same way the site keeps one (index.html game-save) */
  var PREFIX = "ccs-game-save:";
  window.addEventListener("message", function(ev){
    var d = ev.data, f = document.querySelector("#play iframe");
    if (!d || typeof d !== "object" || !f || ev.source !== f.contentWindow) return;
    if (d.ccsSave !== "get" && d.ccsSave !== "set") return;
    if (typeof d.game !== "string" || !/^[a-z0-9][a-z0-9-]{0,39}$/.test(d.game)) return;
    try {
      if (d.ccsSave === "set"){ var t = JSON.stringify(d.data); if (t && t.length <= 4096) localStorage.setItem(PREFIX + d.game, t); return; }
      var data = null; try { data = JSON.parse(localStorage.getItem(PREFIX + d.game) || "null"); } catch(e){}
      ev.source.postMessage({ ccsSave:"data", game:d.game, data:data }, "*");
    } catch(e){}
  });
  $("again").addEventListener("click", start);
  start();
})();
</script>
</body>
</html>
